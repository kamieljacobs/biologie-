<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biologie bij Kamiel</title>
<meta name="description" content="Uitlegfilms, tools en practica voor biologie in havo, vwo en onderbouw.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script>
(function(){try{var t=localStorage.getItem('thema');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();
</script>
<style>
/* Ontwerp: rustig en enkelkolommig, zoals een goed opgemaakt naslagwerk.
   Huisstijl van de films (navy, goud, Fraunces). Beeld = eigen lijntekeningen per hoofdstuk, als platen in een biologieboek. */
:root{
  --bg:#0F1726; --bg2:#0B1220; --surface:#141E33; --line:rgba(143,160,181,.16); --line2:rgba(143,160,181,.30);
  --text:#F2F2EE; --text2:#A3ACBA; --text3:#7D8899;
  --goud:#E0B64A; --goud-ink:#1A1405; --goud-text:#E8C266; --goud-soft:rgba(224,182,74,.13);
  --groen:#7FC48F; --koraal:#E8876C; --paars:#A897DB; --teal:#6DB3D6; --oker:#D2AE66;
  --titel:"Fraunces",Georgia,"Times New Roman",serif;
  --tekst:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --meta:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --bg2:#ECEFF3; --surface:#FFFFFF; --line:rgba(20,32,52,.10); --line2:rgba(20,32,52,.22);
  --text:#121C2E; --text2:#4E5A6C; --text3:#6B7687;
  --goud:#D9AC3C; --goud-ink:#1A1405; --goud-text:#8A650C; --goud-soft:rgba(217,172,60,.16);
  --groen:#2F8A47; --koraal:#B9502F; --paars:#6550AD; --teal:#25729C; --oker:#8C6A1C;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--tekst);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--goud);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:24px}
.smal{max-width:1080px}
h1,h2,h3{font-family:var(--titel);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--meta);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
[hidden]{display:none!important}
.kunst{color:var(--c,var(--goud))}
.kunst .acc{color:var(--goud)}

/* Kopbalk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px 28px;min-height:66px;flex-wrap:wrap;padding-block:8px}
.merk{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--titel);white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:8px;color:var(--text2);font-weight:600;font-size:15px}
.nav a:hover{color:var(--text)}
.nav a[aria-current]{color:var(--text);box-shadow:inset 0 -2px 0 var(--goud);border-radius:0}
.rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line2)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--text2);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--goud);color:var(--goud-ink)}
.icoon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.icoon:hover{color:var(--text)}

/* Homepage */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:center;padding-block:52px 40px}
.hero .mono{color:var(--goud-text)}
.hero h1{font-size:clamp(40px,5.2vw,62px);line-height:1.03;margin:16px 0 20px;font-weight:700}
.hero p{margin:0;color:var(--text2);font-size:19px;max-width:48ch}
.hero .knoppen{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.knop{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--goud);color:var(--goud-ink);font-weight:700;font-size:15px;border:0}
.knop:hover{filter:brightness(1.06)}
.knop.stil{background:none;color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.knop.stil:hover{box-shadow:inset 0 0 0 1px var(--text3)}

.plaat{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:4px;background:var(--surface)}
.plaat figure{margin:0;padding:20px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.plaat figure:nth-child(odd){border-right:1px solid var(--line)}
.plaat figure:nth-child(-n+2){border-bottom:1px solid var(--line)}
.plaat figcaption{color:var(--text3);font-family:var(--meta);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.plaat svg{width:100%;max-width:130px;height:auto}

.blok{padding-block:8px 48px}
.blok-kop{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.blok-kop h2{font-size:32px}
.blok-kop p{margin:0;color:var(--text3);font-size:15px}

.ond{padding-top:30px}
.ond-kop{display:flex;align-items:baseline;gap:14px;padding-bottom:8px}
.ond-kop .code{color:var(--goud-text)}
.ond-kop .rest{color:var(--text3);font-size:14px}
.rij{display:grid;grid-template-columns:64px minmax(0,1fr) auto 20px;gap:20px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.rij:last-child{border-bottom:1px solid var(--line)}
a.rij:hover{background:linear-gradient(90deg,var(--goud-soft),transparent 70%)}
.rij .embleem{width:64px;height:64px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.rij .embleem svg{width:46px;height:46px}
.rij .lbl{color:var(--text3)}
.rij h3{font-size:22px;line-height:1.2;margin-top:2px}
.rij .hfd{color:var(--text2);font-size:15px}
.rij .mat{color:var(--text2);font-size:14px;text-align:right;white-space:nowrap}
.rij .pijl{color:var(--text3);transition:transform .2s,color .2s}
a.rij:hover .pijl{transform:translateX(4px);color:var(--goud-text)}
.rij.leeg{opacity:.55}
.rij.leeg .embleem{background:none;border-style:dashed}

.binnenkort{display:flex;flex-wrap:wrap;gap:8px 28px;padding-top:16px;color:var(--text2)}
.binnenkort span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--text3);margin-right:10px;vertical-align:middle}


/* PTA-onderdelen als blokken */
.ondgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ondblok{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:18px;background:var(--surface);overflow:hidden;min-width:0}
.ondblok header{padding:22px 22px 16px;border-bottom:1px solid var(--line);background:radial-gradient(260px 120px at 100% 0,var(--goud-soft),transparent)}
.ondtitel{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ondnaam{font-size:27px;line-height:1.08;letter-spacing:-.015em;min-height:2.16em;margin-bottom:12px}
.ondcode{font:600 13px/1 var(--meta);letter-spacing:.12em;color:var(--goud-text)}
.ondtitel{align-items:center}
.weging{font:600 13px/1 var(--meta);color:var(--goud-ink);background:var(--goud);padding:6px 9px;border-radius:999px}
.ondsub{color:var(--text3);margin-top:8px;min-height:15px}
.ondkunst{display:flex;gap:8px;margin-top:16px}
.ondkunst span{width:46px;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.ondkunst svg{width:32px;height:32px}
.ondblok ul{list-style:none;margin:0;padding:6px 0 10px}
.ondblok li a,.ondblok li.leeg{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:10px 22px}
.ondblok li .lbl{grid-column:1/-1;color:var(--text3);font-size:11px}
.ondblok li b{font:700 19px/1.25 var(--titel)}
.ondblok li .mat{color:var(--text3);font-size:13px;align-self:end;white-space:nowrap}
.ondblok li a:hover{background:var(--goud-soft)}
.ondblok li a:hover b{color:var(--goud-text)}
.ondblok li.leeg{opacity:.5}
.ondblok li + li{border-top:1px solid var(--line)}
.blok .binnenkort{margin-top:22px;align-items:baseline}
.binnenkort .bk-lbl::before{display:none}
@media (max-width:1040px){.ondgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.ondgrid{grid-template-columns:1fr}}

/* Hoofdstukpagina */
.kop{border-bottom:1px solid var(--line)}
.kop .wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;align-items:center;padding-block:44px 40px}
.terug{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-weight:600;font-size:15px}
.terug:hover{color:var(--text)}
.kop .lbl{color:var(--c,var(--goud-text));margin:26px 0 8px}
.kop h1{font-size:clamp(40px,5vw,60px);line-height:1.02}
.kop p{margin:12px 0 0;color:var(--text2);max-width:58ch}
.kop .groot{justify-self:end;width:220px;height:220px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center}
.kop .groot svg{width:150px;height:150px}
.voortgang{display:flex;align-items:center;gap:12px;margin-top:22px;color:var(--text3);font-size:14px}
.voortgang .balk{width:160px;height:4px;border-radius:99px;background:var(--line2);overflow:hidden}
.voortgang .balk i{display:block;height:100%;background:var(--goud)}

.lijst{padding-block:12px 8px}
.lijst h2{font-size:26px;margin:36px 0 6px}
.film{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:20px;align-items:start;padding:22px 4px;border-top:1px solid var(--line)}
.film:last-child{border-bottom:1px solid var(--line)}
.film .nr{font:500 34px/1 var(--titel);color:var(--text3);padding-top:2px;font-variant-numeric:tabular-nums}
.film.is-gezien .nr{color:var(--goud-text)}
.film h3{font-size:24px;line-height:1.15}
.film h3 a:hover{color:var(--goud-text)}
.film .vraag{margin:6px 0 0;font-size:18px;color:var(--text)}
.film .tekst{margin:4px 0 0;color:var(--text2);font-size:15px}
.film .meta{margin-top:8px;color:var(--text3);display:flex;gap:14px;flex-wrap:wrap}
.film .acties{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:4px}
.vink{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--text3);font-size:14px;font-weight:600;padding:4px 2px;min-height:32px}
.vink .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text3);display:inline-flex;align-items:center;justify-content:center}
.film.is-gezien .vink{color:var(--goud-text)}
.film.is-gezien .vink .box{background:var(--goud);border-color:var(--goud);color:var(--goud-ink)}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-top:14px}
.tool{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:16px;background:var(--surface);overflow:hidden;transition:border-color .18s,transform .18s}
a.tool:hover{border-color:var(--text3);transform:translateY(-2px)}
.tool .ik{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.tool .ik svg{width:100%;max-width:300px;height:auto;aspect-ratio:220/130}
.tool .fig{font:600 10.5px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.plaatje .lab{fill:var(--text2);stroke:none;font:500 8px var(--meta);letter-spacing:.02em}
.plaatje .acc-t{fill:var(--goud-text)}
.plaatje .leid{stroke:var(--text3);stroke-width:.7}
.tool > div{padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.tool .open{margin-top:auto;padding-top:10px;color:var(--goud-text);font-weight:700;font-size:14px}
.tool .volgt{margin-top:auto;padding-top:10px;color:var(--text3)}
.tool h3{font-size:19px;line-height:1.25}
a.tool:hover h3{color:var(--goud-text)}
.tool p{margin:2px 0 0;color:var(--text2);font-size:14px}
.tool.leeg{opacity:.55}
.tool.leeg{border-style:dashed;background:none}
.tool.leeg .ik{background:none}

.reeks{padding-top:34px}
.reeks-kop{display:flex;align-items:center;gap:14px;padding-bottom:6px}
.reeks-kop .embleem{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.reeks-kop .embleem svg{width:30px;height:30px}
.reeks-kop h2{font-size:24px}
.reeks-kop a{color:var(--goud-text);font-weight:700;font-size:14px;white-space:nowrap}
.fries{flex:1;min-width:0;height:44px;opacity:.75}
@media (max-width:600px){.reeks-kop .fries{display:none}.reeks-kop a{margin-left:auto}}
.kort{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:11px 4px;border-top:1px solid var(--line)}
.kort .n{font:500 18px/1 var(--titel);color:var(--text3)}
.kort b{font:600 18px/1.3 var(--titel);color:var(--text)}
.kort:hover b{color:var(--goud-text)}
.kort span{display:block;color:var(--text3);font-size:14px}
.kort .t{color:var(--text3);font-family:var(--meta);font-size:12px}


.film{grid-template-columns:76px minmax(0,1fr) auto}
.film .nr{position:relative;padding:0;font-size:0}
.film .nr .beeld{display:flex;width:72px;height:72px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);align-items:center;justify-content:center}
.film .nr .beeld svg{width:46px;height:46px}
.film .nr .n{position:absolute;left:-4px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--bg);border:1px solid var(--line2);font:600 12px/22px var(--meta);color:var(--text2);text-align:center}
.film.is-gezien .nr .beeld{border-color:var(--goud)}
.film.is-gezien .nr .n{background:var(--goud);border-color:var(--goud);color:var(--goud-ink)}
.kort{grid-template-columns:44px 22px minmax(0,1fr) auto;align-items:center}
.kort .beeld{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.kort .beeld svg{width:30px;height:30px}
@media (max-width:600px){.film{grid-template-columns:56px minmax(0,1fr)}.film .nr .beeld{width:52px;height:52px}.film .nr .beeld svg{width:34px;height:34px}.kort{grid-template-columns:40px minmax(0,1fr) auto}.kort .n{display:none}}
.ond-scheiding{display:flex;align-items:baseline;gap:14px;margin:52px 0 0;padding-bottom:10px;border-bottom:2px solid var(--goud)}
.ond-scheiding .mono{color:var(--goud-text)}
.ond-scheiding h2{font-size:30px}
.ond-scheiding + .reeks{padding-top:20px}
footer{margin-top:56px;border-top:1px solid var(--line);color:var(--text3);font-size:14px}
footer .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;padding-block:26px 44px}
footer a:hover{color:var(--text)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:36px;padding-block:44px 40px}
  .plaat{max-width:420px}
  .kop .wrap{grid-template-columns:1fr}
  .kop .groot{justify-self:start;width:120px;height:120px;order:-1}
  .kop .groot svg{width:84px;height:84px}
  .rechts{margin-left:0}
}
@media (max-width:600px){
  .wrap{padding-inline:16px}
  .bar .wrap{gap:6px 12px}
  .nav a{padding:6px 8px;font-size:14px}
  .rij{grid-template-columns:48px minmax(0,1fr) 16px;gap:14px}
  .rij .embleem{width:48px;height:48px}.rij .embleem svg{width:34px;height:34px}
  .rij .mat{grid-column:2;text-align:left;white-space:normal}
  .rij .pijl{grid-row:1;grid-column:3}
  .film{grid-template-columns:40px minmax(0,1fr)}
  .film .nr{font-size:26px}
  .film .acties{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="merk" href="#home" aria-label="Biologie bij Kamiel, naar de homepage">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="none" stroke="var(--goud)" stroke-width="1.5"/><path d="M8 19.5c5.5 0 11-5 12.5-12-6.5 1.4-12 6.6-12.5 12z" fill="none" stroke="var(--goud)" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 19.5l7.5-7.5" stroke="var(--goud)" stroke-width="1.5" stroke-linecap="round"/></svg>
      Biologie bij Kamiel
    </a>
    <nav class="nav" aria-label="Hoofdmenu">
      <a href="#home" data-nav="home">Hoofdstukken</a>
      <a href="#films" data-nav="films">Films</a>
      <a href="#tools" data-nav="tools">Tools</a>
      <a href="challenges.html">Challenges</a>
      <a href="pta-route.html">PTA-route</a>
    </nav>
    <div class="rechts">
      <div class="seg" role="group" aria-label="Kies je niveau">
        <button type="button" data-niveau="havo">havo</button>
        <button type="button" data-niveau="vwo">vwo</button>
        <button type="button" data-niveau="onderbouw">onderbouw</button>
      </div>
      <button class="icoon" id="thema" type="button" aria-label="Wissel tussen licht en donker"></button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>Biologie bij Kamiel · uitlegfilms en tools voor havo, vwo en onderbouw</span>
    <a href="#films">Alle films</a>
    <a href="#tools">Alle tools</a>
    <a href="challenges.html">Challenges</a>
    <a href="pta-route.html">PTA-route</a>
  </div>
</footer>

<script>
/* ===== INHOUD — films, tools en hoofdstukken. Een nieuwe film: voeg hem toe aan films[] van het hoofdstuk. ===== */
const BASE = "";
const HOOFDSTUKKEN = {
 "erfelijkheid": {
  "label": "H3",
  "titel": "Erfelijkheid",
  "meta": "havo · vwo · Biologie voor jou H3 · Nectar H3 · 6 films, kijk ze op volgorde",
  "films": [
   {
    "href": "films/erfelijkheid/1-chromosomen.html",
    "titel": "Chromosomen",
    "vraag": "Hoeveel chromosomen zitten er in één cel, en waarom in paren?",
    "tekst": "Waar erfelijke informatie zit en hoe die wordt doorgegeven",
    "duur": 7,
    "bij": "Film 1 · § 3.1 – 3.2"
   },
   {
    "href": "films/erfelijkheid/2-monohybride-kruisingen.html",
    "titel": "Monohybride kruisingen",
    "vraag": "Hoe weet je welke allelen een plant heeft, zonder DNA-test?",
    "tekst": "Eén eigenschap, twee allelen, het kruisingsschema",
    "duur": 5,
    "bij": "Film 2 · § 3.3"
   },
   {
    "href": "films/erfelijkheid/3-voorbij-dominant-en-recessief.html",
    "titel": "Voorbij dominant en recessief",
    "vraag": "Mengen allelen zich, zoals verf?",
    "tekst": "Intermediair, codominantie en meerdere allelen (bloedgroepen)",
    "duur": 5,
    "bij": "Film 3 · § 3.3"
   },
   {

const hoofdstukVan=href=>(href||'').replace(/^#/,'').split('-')[0];

function telling(id){

function hoofdstuk(id){
  const h=HOOFDSTUKKEN[id], n=h.films.length, k=h.films.filter(f=>gezien[f.href]).length;
  let out=`<section class="kop"><div class="wrap">

function toolRij(t){
  const fig=toolFig(t.naam), nr=TOOLPLAAT.findIndex(([re])=>re.test(t.naam))+1;

  let pagina='home';
  if(h==='films'){app.innerHTML=films();pagina='films'}
  else if(h==='tools'){app.innerHTML=tools();pagina='tools'}
  else if(HOOFDSTUKKEN[id]){app.innerHTML=hoofdstuk(id);pagina=id}
  else app.innerHTML=home();
  document.querySelectorAll('[data-nav]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.nav===(pagina==='films'||pagina==='tools'?pagina:'home')));
  document.title=pagina==='home'?'Biologie bij Kamiel':`${pagina==='films'?'Films':pagina==='tools'?'Tools':HOOFDSTUKKEN[id].titel} · Biologie bij Kamiel`;
  const el=h&&h!==pagina&&h!=='home'?document.getElementById(h):null;
  if(el) el.scrollIntoView(); else window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const f=e.target.closest('.film'); if(!f) return;
  if(e.target.closest('.vink')){const k=f.dataset.href; if(gezien[k]) delete gezien[k]; else gezien[k]=1; schrijf('gezien',JSON.stringify(gezien)); render(); return;}
  if(e.target.closest('a')){gezien[f.dataset.href]=1; schrijf('gezien',JSON.stringify(gezien));}
});
window.addEventListener('hashchange',render);
themaKnop(); render();
})();
</script>
