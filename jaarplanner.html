<title>Jaarplanner biologie 2026-2027</title>

<style>
/* weekplanning: afvinken */
.pl-bar{margin:0 0 16px}
.pl-prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
td.mid .ms{gap:4px}
td.mid .ms .chip{font-size:12px}
td.hw .tick span{line-height:1.4}
tr.klaar td.wk b::after{content:" ✓";color:var(--accent)}
tr.klaar td{background:color-mix(in srgb,var(--accent) 7%,var(--row))}

/* Layout: one weekly ledger, grouped per hoofdstuk; chapter color on the left edge only. */
:root{
  --bg:#fbfaf7; --fg:#1f2a25; --muted:#6b7570; --line:#dcdfd9; --row:#ffffff;
  --off:#eeeeea; --off-fg:#7a817c; --toets:#fff3c4; --eigen:#dcebf5;
  --accent:#2d6a4f; --display:"Source Serif 4",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191a; --fg:#e6e9e6; --muted:#9aa39e; --line:#30383a; --row:#1c2224;
  --off:#22282a; --off-fg:#7d8683; --toets:#4a3d10; --eigen:#1f3340; --accent:#7fc8a4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191a; --fg:#e6e9e6; --muted:#9aa39e; --line:#30383a; --row:#1c2224;
  --off:#22282a; --off-fg:#7d8683; --toets:#4a3d10; --eigen:#1f3340; --accent:#7fc8a4; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding:0 16px;padding-block:28px 48px}
.wrap{max-width:1180px;margin:0 auto}
h1{font:700 30px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:4px;margin:10px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
[hidden]{display:none!important}
.notes a,.rt-intro a{color:var(--accent)}
.tab{all:unset;cursor:pointer;white-space:nowrap;flex:none;padding:8px 18px;font:600 14px var(--body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.06em}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 22px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border:1px solid var(--line);border-radius:3px;display:inline-block}
.blok{margin:0 0 26px}
.blok h2{font:600 18px/1.2 var(--display);margin:0 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.blok h2 small{font:500 12px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--row)}
table{border-collapse:collapse;width:100%;min-width:1050px}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.wk{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);width:92px}
td.wk b{color:var(--fg);font-weight:600}
td.par{width:19%}
td.mid{width:24%}
td.mid.gu{width:19%}
td.hw{width:17%}
td.opm{width:11%}
td.opm{color:var(--muted)}
tr.off td{background:var(--off);color:var(--off-fg)}
tr.act td{background:repeating-linear-gradient(135deg,var(--off) 0 8px,var(--row) 8px 12px);color:var(--off-fg)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:1px 7px;border-radius:3px;margin-right:8px;border:1px solid currentColor}
tr.toets td{background:var(--toets)}
tr.eigen td{background:var(--eigen)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);margin:0 4px 4px 0;white-space:nowrap}
a.chip{text-decoration:none;background:color-mix(in srgb,var(--accent) 10%,transparent)}
a.chip:hover{background:var(--accent);color:var(--row)}
.chip.vid::before{content:"▶ ";font-size:10px}
.chip.tool::before{content:"⚙ ";font-size:10px}
.leeg{color:var(--muted);font-style:italic}
.notes{margin-top:30px;max-width:70ch;color:var(--muted);font-size:13px}
.notes h3{font:600 15px var(--display);color:var(--fg);margin:0 0 6px}
.notes ul{padding-left:18px;margin:0}


/* PTA-route als blokken */
.ond{background:transparent;border:0;border-radius:0;margin:0 0 28px;overflow:visible}
.ond header{background:transparent;border:0;border-bottom:2px solid var(--line);padding:0 0 8px;margin:0 0 12px}
.ond-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ond-grid .sub-onderdeel{display:flex;flex-direction:column;gap:10px;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-items:stretch}
.ond-grid .sub-onderdeel:last-child{border-bottom:1px solid var(--line)}
.ond-grid .sub-onderdeel.done{border-color:var(--accent);background:var(--accent-soft)}
.ond-grid .sub-onderdeel h3{font-size:17px}
.ond-grid .sub-onderdeel .af{margin-left:26px}


/* PTA-route-tab */
.rt-intro{max-width:72ch;color:var(--muted);margin:0 0 12px}
.rt-switch{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 14px}
.rt-switch button{all:unset;cursor:pointer;padding:6px 16px;font:600 13px var(--body);color:var(--muted)}
.rt-switch button[aria-pressed="true"]{background:var(--accent);color:var(--row)}
.rt-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rt-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
:root{--row2:#f4f3ee;--accent-soft:#e3efe8;--amber:#9a6b00;--amber-soft:#fff3c4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--row2:#202a2d;--accent-soft:#1f3328;--amber:#f2c46b;--amber-soft:#4a3d10}}
:root[data-theme="dark"]{--row2:#202a2d;--accent-soft:#1f3328;--amber:#f2c46b;--amber-soft:#4a3d10}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted);margin:0 0 20px}
.meta b{color:var(--fg);font-weight:600}
.ond{background:var(--row);border:1px solid var(--line);border-radius:8px;margin:0 0 20px;overflow:hidden}
.ond header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--row2)}
.ond header h2{font:600 20px/1.2 var(--display);margin:0}
.ond header .w{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:999px;font-weight:600}
.ond header .prog{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub-onderdeel{display:grid;grid-template-columns:minmax(180px,.9fr) minmax(220px,1.2fr) minmax(220px,1.4fr);gap:10px 18px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start}
.sub-onderdeel:last-child{border-bottom:0}
.sub-onderdeel h3{font:600 15.5px/1.3 var(--body);margin:0 0 4px;display:flex;align-items:flex-start;gap:8px}
.chk{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.sub-onderdeel.done h3 span{color:var(--muted);text-decoration:line-through}
.af{margin:0 0 0 26px;font-size:12.5px;color:var(--muted)}
.af b{color:var(--amber);font-weight:600}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.hs{margin:0;padding:0;list-style:none}
.hs li{margin:0 0 3px}
.hs small{color:var(--muted)}
a.chip{background:var(--accent-soft)}
a.chip:hover{background:var(--accent);color:var(--row)}
.chip.soon{border-style:dashed;color:var(--muted);border-color:var(--line)}
.chip.ext{border-color:var(--line);color:var(--fg);background:transparent}

.coach-report{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px;max-height:520px;overflow:auto}
.cr-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding:0 0 10px;margin:0 0 12px}
.cr-titel{font:600 17px var(--display)}
.cr-wie{font-size:13px;color:var(--muted)}
.cr-tot{font-size:13px;color:var(--muted)}.cr-tot b{font-size:20px;color:var(--accent)}
.cr-groep{margin:0 0 14px}
.cr-kop{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.cr-rij{background:var(--row);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;break-inside:avoid}
.cr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cr-sub{display:block;font-size:12.5px;color:var(--muted)}

.cr-bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cr-bar i{display:block;height:100%;background:var(--accent)}

.cr-items li{display:flex;align-items:baseline;gap:8px;font-size:13.5px}

.cr-leeg{color:var(--muted);margin:0}

// ---------- Overzicht voor de coach (gedeeld door weekplanning en PTA-route) ----------
// rep = {titel, naam, datum, groepen:[{kop, rijen:[{titel, sub, items:[{ok, soort, label}]}]}]}
const COACH=(function(){
  const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const sorted=items=>items.filter(i=>i.ok).concat(items.filter(i=>!i.ok&&!i.extra));
  const req=items=>items.filter(i=>!i.extra);   // verplicht: huiswerk en films; tools zijn extra
  const telling=rep=>{let d=0,t=0;for(const g of rep.groepen)for(const r of g.rijen)for(const i of req(r.items)){t++;if(i.ok)d++}return {d,t}};
  const col=(kop,its,cls)=>`<div class="cr-col ${cls}"><div class="cr-colkop">${kop} <span>${its.length}</span></div>${its.length?`<ul>${its.map(i=>`<li><span class="cr-ico" aria-hidden="true">${cls==="ok"?"✓":""}</span><span class="cr-lbl">${e(i.label)}</span><span class="cr-soort">${e(i.soort)}${i.extra?" · extra":""}</span></li>`).join("")}</ul>`:`<p class="cr-niets">${cls==="ok"?"nog niets":"alles gedaan"}</p>`}</div>`;
  function html(rep){
    if(!rep.groepen.length) return `<p class="cr-leeg">Je hebt nog niets afgevinkt.</p>`;
    const {d,t}=telling(rep);
    let out=`<div class="cr-top"><div><div class="cr-titel">${e(rep.titel)}</div><div class="cr-wie">${rep.naam?e(rep.naam)+" · ":""}${e(rep.datum)}</div></div><div class="cr-tot"><b>${d}</b> van ${t} gedaan</div></div>`;
    for(const g of rep.groepen){
      out+=`<div class="cr-groep"><div class="cr-kop">${e(g.kop)}</div>`;
      for(const r of g.rijen){
        const R=req(r.items), n=R.filter(i=>i.ok).length, pct=R.length?Math.round(100*n/R.length):100;
        out+=`<div class="cr-rij"><div class="cr-head"><div><b>${e(r.titel)}</b>${r.sub?`<span class="cr-sub">${e(r.sub)}</span>`:""}</div><div class="cr-prog"><span>${n} van ${R.length}</span><i class="cr-bar"><i style="width:${pct}%"></i></i></div></div><div class="cr-cols">`
          +col("Gedaan",r.items.filter(i=>i.ok),"ok")+col("Nog niet gedaan",r.items.filter(i=>!i.ok&&!i.extra),"nee")+`</div></div>`;
      }
      out+=`</div>`;
    }
    return out;
  }
  // Platte tekst (voor als plakken als tabel niet lukt)
  function text(rep){
    if(!rep.groepen.length) return `${rep.titel}\n${rep.naam?rep.naam+" · ":""}${rep.datum}\n\nNog niets afgevinkt.`;
    const {d,t}=telling(rep);
    const L=[rep.titel,`${rep.naam?rep.naam+" · ":""}${rep.datum} · ${d} van ${t} gedaan`,""];
    for(const g of rep.groepen){
      L.push(g.kop.toUpperCase());
      for(const r of g.rijen){
        const R=req(r.items), n=R.filter(i=>i.ok).length;
        L.push(`${r.titel}${r.sub?" · "+r.sub:""} (${n} van ${R.length})`);
        for(const i of sorted(r.items)) L.push(`  ${i.ok?"✓":"○"} ${i.label} (${i.soort.toLowerCase()}${i.extra?", extra":""}${i.ok?"":", nog niet"})`);
        L.push("");
      }
    }
    return L.join("\n").trim();
  }
  // Tabel met inline opmaak, zodat hij netjes in Teams of Word plakt
  function pasteHtml(rep){
    if(!rep.groepen.length) return `<p>${e(rep.titel)}<br>Nog niets afgevinkt.</p>`;
    const {d,t}=telling(rep), td='style="padding:4px 10px;border-bottom:1px solid #e3e3e3;vertical-align:top"';
    let h=`<p><b>${e(rep.titel)}</b><br>${rep.naam?e(rep.naam)+" · ":""}${e(rep.datum)} · ${d} van ${t} gedaan</p>`;
    for(const g of rep.groepen){
      h+=`<p style="margin:12px 0 4px"><b>${e(g.kop)}</b></p><table style="border-collapse:collapse;font-size:13px">`;
      for(const r of g.rijen){
        const R=req(r.items), n=R.filter(i=>i.ok).length;
        h+=`<tr><td colspan="3" style="padding:8px 10px 4px;background:#eef4f0"><b>${e(r.titel)}</b>${r.sub?" · "+e(r.sub):""} — ${n} van ${R.length}</td></tr>`;
        for(const i of sorted(r.items)) h+=`<tr><td ${td}><span style="color:${i.ok?"#2d6a4f":"#9aa39e"}">${i.ok?"✓":"○"}</span></td><td ${td}>${e(i.label)}</td><td ${td}><span style="color:#6b7570">${e(i.soort.toLowerCase())}${i.extra?", extra":""}${i.ok?"":", nog niet"}</span></td></tr>`;
      }
      h+=`</table>`;
    }
    return h;
  }
  function panel(rep,tip){
    return `<section class="mentor" id="mentor"><div class="mentor-h"><h2>Overzicht voor je coach</h2><button type="button" class="btn ghost" data-coach="close">Sluiten</button></div>
      <p class="mentor-tip">${e(tip)}</p>
      <label class="mentor-naam">Je naam <input type="text" id="coach-naam" value="${e(rep.naam)}" autocomplete="name"></label>
      <div class="coach-report" id="coach-report">${html(rep)}</div>
      <div class="mentor-btns"><button type="button" class="btn" data-coach="copy">Kopieer voor Teams</button><button type="button" class="btn ghost" data-coach="print">Afdrukken of pdf</button><span class="copied" id="copied" hidden>Gekopieerd, plak het in Teams</span></div></section>`;
  }
  // Knoppen en naamveld koppelen; getRep() bouwt het overzicht opnieuw, onClose sluit het paneel
  function wire(el,getRep,onClose){
    const naam=el.querySelector("#coach-naam");
    if(naam) naam.addEventListener("input",()=>{try{localStorage.setItem("pta-naam",naam.value)}catch(x){}const box=el.querySelector("#coach-report");if(box)box.innerHTML=html(getRep())});
    el.querySelectorAll("[data-coach]").forEach(b=>b.addEventListener("click",()=>{
      const a=b.dataset.coach;
      if(a==="close") onClose();
      else if(a==="print"){document.body.classList.add("print-mentor");window.print();setTimeout(()=>document.body.classList.remove("print-mentor"),500)}
      else if(a==="copy"){
        const rep=getRep(), txt=text(rep), ok=()=>{const c=el.querySelector("#copied");if(c){c.hidden=false;setTimeout(()=>{c.hidden=true},2500)}};
        const plain=()=>{try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(x){fallback()}};
        const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(x){}ta.remove()};
        try{navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([pasteHtml(rep)],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]).then(ok,plain)}catch(x){plain()}
      }
    }));
  }
  const naam=()=>{try{return localStorage.getItem("pta-naam")||""}catch(x){return ""}};
  const datum=()=>new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
  // Knop "Alles uitvinken": eerste klik vraagt om bevestiging, tweede klik wist alle sleutels met dit voorvoegsel
  function resetKnop(btn,prefix,klaar){
    let armed=false,timer=null;
    btn.addEventListener("click",()=>{
      if(!armed){armed=true;btn.textContent="Zeker weten? Klik nog een keer";btn.classList.add("warn");timer=setTimeout(()=>{armed=false;btn.textContent="Alles uitvinken";btn.classList.remove("warn")},4000);return}
      clearTimeout(timer);
      try{const weg=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(prefix)===0)weg.push(k)}weg.forEach(k=>localStorage.removeItem(k))}catch(x){}
      klaar();
    });
  }
  return {html,text,panel,wire,naam,datum,resetKnop};
})();

  // ---- PTA-route: weergave, afvinken per onderdeel en mentoroverzicht ----
  // Afvinken wordt alleen in de eigen browser bewaard (localStorage).
  // Het coachoverzicht maakt daarvan een tekst die de leerling kan kopiëren (Teams) of afdrukken.
  const KEY=(...p)=>"pta:"+p.join(":");
  const getB=k=>{try{return localStorage.getItem(k)==="1"}catch(e){return false}};
  const setB=(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(e){}};
  const getS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
  const setS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const escH=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rank=m=>(m[0]==="tool"?2:0)+(m[3]==="ext"?1:0);   // eigen films, dan GU-films, dan tools (extra)
  const sortM=m=>m.slice().sort((a,b)=>rank(a)-rank(b));
  // Alle afvinkbare dingen van één subonderdeel: hoofdstukken (lezen en opdrachten) en films/tools.
  function items(lvl,o,x){
    const out=x.h.map(([h])=>({k:KEY(lvl,o.code,x.n,"h",h),label:h,kind:"Hoofdstuk",what:"gelezen en opdrachten gemaakt"}));
    for(const [t,n,u,fl] of sortM(x.m)) out.push({k:KEY(lvl,o.code,x.n,t,n),label:n,kind:t==="tool"?"Tool":(fl==="ext"?"Film (GU)":"Film"),what:t==="tool"?"gedaan":"gekeken",extra:t==="tool"||fl==="ext"});
    return out;
  }
  let lvl=getS("pta-tab","havo"); if(!DATA[lvl]) lvl="havo";
  let mentorOpen=false;

  function cards(){
    const P=DATA[lvl]; let out="";
    for(const o of P.ond){
      const total=o.subs.length, done=o.subs.filter(x=>getB(KEY(lvl,o.code,x.n))).length;
      out+=`<section class="ond"><header><h2>${o.code}</h2><span class="prog">${done} van ${total} onderwerpen af</span></header><div class="ond-grid">`;
      for(const x of o.subs){
        const k=KEY(lvl,o.code,x.n), d=getB(k), its=items(lvl,o,x), req=its.filter(i=>!i.extra), nd=req.filter(i=>getB(i.k)).length;
        const hs=x.h.map(([h,b])=>{const ik=KEY(lvl,o.code,x.n,"h",h);return `<li><label class="tick"><input type="checkbox" class="it" data-key="${escH(ik)}" ${getB(ik)?"checked":""}><span>${escH(h)}${b?` <small>· ${escH(b)}</small>`:""}</span></label></li>`}).join("");
        const li=([t,n,u,fl])=>{
          const ik=KEY(lvl,o.code,x.n,t,n), cls=`chip ${t}${fl?" "+fl:""}`;
          const nn=fl==="ext"?String(n).replace(/^GU · /,""):KORT(n); const chip=u?`<a class="${cls}" href="${escH(u)}" target="_blank" rel="noopener">${escH(nn)}</a>`:`<span class="${cls}">${escH(nn)}</span>`;
          return `<li><input type="checkbox" class="it" data-key="${escH(ik)}" ${getB(ik)?"checked":""} aria-label="${t==="tool"?"Gedaan":"Gekeken"}: ${escH(n)}">${chip}${t==="tool"?'<span class="extra-tag">extra</span>':""}</li>`;
        };
        const ms=sortM(x.m.filter(z=>z[3]!=="ext")).map(li).join(""), gus=x.m.filter(z=>z[3]==="ext").map(li).join("");
        out+=`<div class="sub-onderdeel${d?" done":""}"><div><h3><input class="chk" type="checkbox" data-key="${escH(k)}" ${d?"checked":""} aria-label="Onderwerp af: ${escH(x.n)}"><span>${escH(x.n)}</span><span class="cnt">${nd}/${req.length}</span></h3>${x.af?`<p class="af"><b>${escH(x.af[0])}</b> · af vóór ${escH(x.af[1])}</p>`:""}</div>`
          +`<div><p class="k">Hoofdstukken · lezen en opdrachten maken</p><ul class="hs">${hs}</ul></div>`
          +`<div><p class="k">Films en tools</p>${ms?`<ul class="ms">${ms}</ul>`:`<span class="leeg">nog geen eigen materiaal</span>`}${gus?`<p class="k gu-k">Extra · Gewoon Uitgelegd</p><ul class="ms gu">${gus}</ul>`:""}</div></div>`;
      }
      out+=`</div></section>`;
    }
    return out;
  }

  // Overzicht voor de coach: alleen onderwerpen waarin iets is afgevinkt, met ook wat nog open staat
  function coachRep(){
    const P=DATA[lvl], groepen=[];
    for(const o of P.ond){
      const rijen=[];
      for(const x of o.subs){
        const its=items(lvl,o,x), subDone=getB(KEY(lvl,o.code,x.n));

      }

    return {titel:`PTA-route biologie · ${lvl}`,naam:COACH.naam(),datum:COACH.datum(),groepen};

  function html(){
    const P=DATA[lvl];

      +(mentorOpen?COACH.panel(coachRep(),"Hier staan de onderwerpen waarin je iets hebt afgevinkt: wat je hebt gedaan en welke hoofdstukken of films nog open staan. Tools en films van Gewoon Uitgelegd zijn extra en staan er alleen in als je ze hebt gedaan. Je vinkjes worden alleen in deze browser bewaard; kopieer het overzicht naar je coach in Teams, of druk het af of sla het op als pdf."):"")
      +`<div class="meta"><span><b>${escH(P.methode)}</b></span><span>${escH(P.pta)}</span></div>`
      +`<div class="rt-legend"><span><i class="chip vid">film</i> eigen film</span><span><i class="chip tool">tool</i><span class="extra-tag">extra</span> extra stof, als je tijd over hebt</span><span><i class="chip ext vid">GU · film</i> extra: van Gewoon Uitgelegd</span><span>☐ vink af wat je hebt gedaan</span></div>`
      +cards();
  }

  function mount(el,notesEl){
    const y=window.scrollY;
    el.innerHTML=html();
    if(notesEl) notesEl.innerHTML=DATA[lvl].notes.map(n=>`<li>${escH(n)}</li>`).join("");
    window.scrollTo(0,y);
    el.querySelectorAll("[data-rt]").forEach(b=>b.addEventListener("click",()=>{lvl=b.dataset.rt;setS("pta-tab",lvl);mount(el,notesEl)}));
    el.querySelectorAll(".chk,.it").forEach(c=>c.addEventListener("change",()=>{setB(c.dataset.key,c.checked);mount(el,notesEl)}));
    el.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.act==="mentor"){mentorOpen=!mentorOpen;mount(el,notesEl);if(mentorOpen){const m=el.querySelector("#mentor");if(m&&m.scrollIntoView)m.scrollIntoView({block:"start"})}}
    }));
    const rb=el.querySelector("[data-reset]"); if(rb) COACH.resetKnop(rb,`pta:${lvl}:`,()=>mount(el,notesEl));
    if(mentorOpen) COACH.wire(el,coachRep,()=>{mentorOpen=false;mount(el,notesEl)});
  }

  return {mount};
})();

// Zet de blokken op de kalender: vakanties en feestdagen vallen vanzelf op de juiste week.
function rooster(level){
  const P=PLANNERS[level], extra=KALENDER_EXTRA[level]||{}, out=[]; let d=new Date(START);
  const k=()=>iso(d), off=()=>KALENDER[k()]||extra[k()];
  const push=(bi,r)=>{out.push({d:new Date(d),bi,r});d.setDate(d.getDate()+7)};
  P.blokken.forEach((b,bi)=>{
    if(b.vul){
      while(k()<=EINDE[level]){ if(off()) push(bi,{type:"off",opm:off()}); else push(bi,{...b.vul,opm:DAGNOTITIES[k()]||""}) }
      while(off()&&out.length<60) push(bi,{type:"off",opm:off()});   // aansluitende vakantie/CE nog tonen
      return;
    }
    for(const r of b.rijen){
      while(off()) push(bi,{type:"off",opm:off()});
      if(r.metVolgende){ out.push({d:new Date(d),bi,r:{...r,opm:"Toets in deze week; het volgende hoofdstuk begint ook"}}); continue; }
      push(bi,{...r,opm:[r.opm,DAGNOTITIES[k()]].filter(Boolean).join(" · ")});
    }
  });
  return out;
}
function blokSub(b,rows){
  if(b.sub) return b.sub;
  const les=rows.filter(x=>x.r.type!=="off"&&x.r.type!=="toets"), toets=rows.find(x=>x.r.type==="toets");
  const dag=x=>x.d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"});
  if(b.vul){const l=rows.filter(x=>x.r.type!=="off");return l.length?`${l.length} weken · ${dag(l[0])} t/m ${dag(l[l.length-1])}`:""}
  return `${les.length} ${les.length===1?"week":"weken"}${toets?(toets.r.metVolgende?` · toets in de 4e week (${dag(toets)}), samen met de start van het volgende hoofdstuk`:` + toets · toets week van ${dag(toets)}`):""}`;
}

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ---------- Afvinken in de weekplanning ----------
// Per lesweek: het huiswerk (lezen en maken) en elke film of tool. Alleen in de eigen browser bewaard.
const PL={
  get:k=>{try{return localStorage.getItem(k)==="1"}catch(e){return false}},
  set:(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(e){}},
  getS:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  setS:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  open:false,
};
const LEVELNAAM={havo4:"havo 4",havo5:"havo 5",vwo45:"vwo 4+5",vwo6:"vwo 6"};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// Alle lesweken met hun afvinkbare dingen
function plWeeks(level){
  const P=PLANNERS[level], out=[];
  for(const x of rooster(level)){
    const r=x.r; if(r.type==="off") continue;
    const secs=(r.par.match(/§ \d+\.\d+|\bB\d+\b/g)||[]).join(" + ");
    const hw=[secs?`Lezen en maken ${secs}`:"",r.hw].filter(Boolean).join(" · ");
    const its=[];
    if(hw) its.push({k:`pl:${level}:${iso(x.d)}:${r.type==="toets"?"toets":"hw"}`,label:hw,kind:"Huiswerk"});
    for(const [t,n,u] of (r.mid||[])){ const gu=/gewoonuitgelegd/.test(u||""); its.push({k:`pl:${level}:${iso(x.d)}:${t}:${n}`,label:n,kind:t==="tool"?"Tool":(gu?"Film (GU)":"Film"),t,n,extra:t==="tool"||gu}); }
    out.push({d:x.d,blok:P.blokken[x.bi].titel,r,hwText:hw,its});
  }
  return out;
}
function plCoachRep(level){
  // Alleen weken waarin iets is afgevinkt, met ook wat die week nog open staat
  const groepen=[]; let g=null;
  for(const w of plWeeks(level)){
    if(!w.its.some(i=>PL.get(i.k))) continue;
    if(!g||g.kop!==w.blok){g={kop:w.blok,rijen:[]};groepen.push(g)}
    g.rijen.push({titel:`wk ${isoWeek(w.d)} · ${w.d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}`,sub:w.r.par,items:w.its.map(i=>({ok:PL.get(i.k),soort:i.kind,label:i.label,extra:i.extra}))});
  }
  return {titel:`Jaarplanner biologie · ${LEVELNAAM[level]}`,naam:COACH.naam(),datum:COACH.datum(),groepen};
}

  const weeks=plWeeks(level), all=weeks.flatMap(w=>w.its).filter(i=>!i.extra), nDone=all.filter(i=>PL.get(i.k)).length;
  let out=`<div class="rt-bar pl-bar"><span class="pl-prog">${nDone} van ${all.length} afgevinkt</span><div class="rt-acts"><button type="button" class="btn ghost" data-reset>Alles uitvinken</button><button type="button" class="btn" data-pl="mentor" aria-expanded="${PL.open}">Overzicht voor je coach</button></div></div>`;
  if(PL.open) out+=COACH.panel(plCoachRep(level),"Hier staan de weken waarin je iets hebt afgevinkt: wat je hebt gedaan en welk huiswerk of welke films je die week nog niet hebt gedaan. Tools en films van Gewoon Uitgelegd zijn extra en staan er alleen in als je ze hebt gedaan. Je vinkjes worden alleen in deze browser bewaard; kopieer het overzicht naar je coach in Teams, of druk het af of sla het op als pdf.");
  const ro=rooster(level);
  P.blokken.forEach((b,bi)=>{
    const rows=ro.filter(x=>x.bi===bi); if(!rows.length) return;
    out+=`<section class="blok"><h2>${esc(b.titel)} <small>${esc(blokSub(b,rows))}</small></h2><div class="tw"><table><thead><tr><th>Week</th><th>Paragrafen / les</th><th>Eigen films en tools</th><th>Extra · Gewoon Uitgelegd</th><th>Huiswerk</th><th>Opmerkingen</th></tr></thead><tbody>`;
    for(const x of rows){
      const r=x.r, d=x.d;
      const dat=`${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const wk=`<td class="wk"><b>wk ${isoWeek(d)}</b><br>ma ${dat}</td>`;
      if(r.type==="off"){
        const act=/activiteitenweek/i.test(r.opm);
        out+=`<tr class="${act?"act":"off"}">${wk}<td colspan="5"><span class="tag">${act?"Activiteitenweek":"Vakantie"}</span>${esc(r.opm)} · geen les</td></tr>`}
      else{
        const day=iso(d);
        const isGU=m=>/gewoonuitgelegd/.test(m[2]||""); const rk=m=>(isGU(m)?2:0)+(m[0]==="tool"?1:0);
        const chipLi=([t,n,u])=>{ const gu=/gewoonuitgelegd/.test(u||"");
          const k=`pl:${level}:${day}:${t}:${n}`;
          const href=u?(/^https?:\/\//.test(u)?u:SITE.replace(/\/$/,"")+"/"+u.replace(/^\//,"")):"";
          const chip=u?`<a class="chip ${t}${gu?" ext":""}" href="${esc(href)}" target="_blank" rel="noopener">${esc(gu?n.replace(/ \(GU\)$/,""):KORT(n))}</a>`:`<span class="chip ${t}">${esc(n)}</span>`;
          return `<li><input type="checkbox" class="pl-it" data-key="${esc(k)}" ${PL.get(k)?"checked":""} aria-label="${t==="tool"?"Gedaan":"Gekeken"}: ${esc(n)}">${chip}${t==="tool"?'<span class="extra-tag">extra</span>':""}</li>`;
        };
        const all=(r.mid||[]).slice().sort((a,b)=>rk(a)-rk(b)), mid=all.filter(m=>!isGU(m)).map(chipLi).join(""), gum=all.filter(isGU).map(chipLi).join("");
        const midHtml=mid?`<ul class="ms">${mid}</ul>`:`<span class="leeg">—</span>`, guHtml=gum?`<ul class="ms">${gum}</ul>`:`<span class="leeg">—</span>`;
        // Standaard huiswerk: de paragrafen van die week lezen en maken; r.hw is een aanvulling.
        const secs=(r.par.match(/§ \d+\.\d+|\bB\d+\b/g)||[]).join(" + ");
        const basis=secs?`Lezen en maken ${secs}`:"";
        const hwParts=[basis,r.hw].filter(Boolean);
        const hk=`pl:${level}:${day}:${r.type==="toets"?"toets":"hw"}`;
        const hw=hwParts.length?`<label class="tick"><input type="checkbox" class="pl-it" data-key="${esc(hk)}" ${PL.get(hk)?"checked":""}><span>${hwParts.map(esc).join("<br>")}</span></label>`:`<span class="leeg">nog invullen</span>`;
        const par=r.par||`<span class="leeg">nog invullen</span>`;
        const w=weeks.find(x=>iso(x.d)===day), req=w?w.its.filter(i=>!i.extra):[], alles=req.length&&req.every(i=>PL.get(i.k));
        out+=`<tr class="${r.type||""}${alles?" klaar":""}">${wk}<td class="par">${r.par?esc(r.par):par}</td><td class="mid">${midHtml}</td><td class="mid gu">${guHtml}</td><td class="hw">${hw}</td><td class="opm">${esc(r.opm)}</td></tr>`;
      }
    }
    out+=`</tbody></table></div></section>`;
  });
  const el=document.getElementById("planner");
  el.innerHTML=out;
  window.scrollTo(0,y);
  el.querySelectorAll(".pl-it").forEach(c=>c.addEventListener("change",()=>{PL.set(c.dataset.key,c.checked);render(level)}));
  el.querySelectorAll("[data-pl]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.pl==="mentor"){PL.open=!PL.open;render(level);if(PL.open){const m=el.querySelector("#mentor");if(m&&m.scrollIntoView)m.scrollIntoView({block:"start"})}}
  }));
  const rb=el.querySelector("[data-reset]"); if(rb) COACH.resetKnop(rb,`pl:${level}:`,()=>render(level));
  if(PL.open) COACH.wire(el,()=>plCoachRep(level),()=>{PL.open=false;render(level)});
  document.getElementById("sub").textContent=P.sub;
  document.getElementById("notes").innerHTML=[...P.notes,...COMMON_NOTES].map(n=>`<li>${n}</li>`).join("");
  document.title=`Jaarplanner biologie ${LEVELNAAM[level]} 2026-2027`;
  try{localStorage.setItem("planner-tab",level)}catch(e){}
  try{history.replaceState(null,"","#"+level)}catch(e){}
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>render(t.dataset.tab)));
let start="havo4";
try{const h=location.hash.replace("#","");if(PLANNERS[h]||h==="route")start=h;else{const s=localStorage.getItem("planner-tab");if(PLANNERS[s]||s==="route")start=s}}catch(e){}
render(start);
</script>
