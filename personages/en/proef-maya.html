<script src="../lib_cast.js"></script>
<script>
// ===== Maya, rijkere castversie (proef 25 okt 2026) =====
// Vooraanzicht in de coördinaten van de still (uitsnede 400 × 1150, voeten op y 1150, midden x 200), zijaanzicht in kopmaten.
const M = {
  huid:'#8A4A26', huidS:'#6F3A1D', haar:'#1C1613', haarL:'#3A2C24',
  trui:'#D9922A', truiS:'#BE7A1D', truiL:'#E6A645',
  jeans:'#4C76A0', jeansS:'#3C6189', jeansL:'#6B93BB', naad:'#C9A35C',
  schoen:'#F1EBE3', schoenS:'#D6CCC0', zool:'#E2D9CE',
  oog:'#1A1210', mond:'#5A2418', lip:'#7A3A26'
};
const LIJNKLEUR = (kl) => _mix(kl.startsWith('#') ? kl : '#000000', 0.68, '#140E14');
let LIJN = true, LW = 2.4;

function vorm(ctx, pad, vul, schaduw) { // vul, eventueel schaduw binnen de vorm, dan contour
  pad(); ctx.fillStyle = vul; ctx.fill();
  if (schaduw) { ctx.save(); pad(); ctx.clip(); schaduw(); ctx.restore(); }
  if (LIJN) { pad(); ctx.strokeStyle = LIJNKLEUR(vul); ctx.lineWidth = LW; ctx.stroke(); }
}
function capsule(ctx, x1, y1, r1, x2, y2, r2, nieuw = true) { const a = Math.atan2(y2 - y1, x2 - x1), nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
  if (nieuw) ctx.beginPath(); ctx.moveTo(x1 + nx * r1, y1 + ny * r1); ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
  ctx.arc(x2, y2, r2, a + Math.PI / 2, a - Math.PI / 2, true); ctx.lineTo(x1 - nx * r1, y1 - ny * r1); ctx.arc(x1, y1, r1, a - Math.PI / 2, a + Math.PI / 2, true); ctx.closePath(); }
function unie(ctx, cirkels, vul, lijn = LIJN) { // bolle haarvorm uit cirkels: eerst dubbele contour, dan vulling (alleen buitenrand zichtbaar)
  if (lijn) { ctx.fillStyle = LIJNKLEUR(vul); for (const [x, y, r] of cirkels) { ctx.beginPath(); ctx.arc(x, y, r + LW, 0, 6.283); ctx.fill(); } }
  ctx.fillStyle = vul; for (const [x, y, r] of cirkels) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); } }
function vormen(ctx, paden, vul, schaduw) { // meerdere paden als één silhouet: dubbele contour onder, vulling erboven, schaduw binnen de vulling
  if (LIJN) { ctx.strokeStyle = LIJNKLEUR(vul); ctx.lineWidth = LW * 2; for (const p of paden) { p(); ctx.stroke(); } }
  ctx.fillStyle = vul; for (const p of paden) { p(); ctx.fill(); }
  if (schaduw) for (const p of paden) { ctx.save(); p(); ctx.clip(); schaduw(); ctx.restore(); }
}
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;

// ---------- hand (lokaal: oorsprong = pols, +y = richting van de onderarm) ----------
function hand(ctx, soort, schaal = 1, golf = 0) {
  const delen = []; // elk deel is een eigen pad, zodat alles samen één silhouet wordt (dubbele contour eronder, vulling erboven)
  const vinger = (x, y, ang, len, r) => delen.push(() => { const ex = x + Math.sin(ang) * len, ey = y + Math.cos(ang) * len; capsule(ctx, x, y, r, ex, ey, r * 0.85); });
  delen.push(() => { ctx.beginPath(); ctx.ellipse(0, 20 * schaal, 14 * schaal, 19 * schaal, 0, 0, 6.283); });
  if (soort === 'wijs') { vinger(-3 * schaal, 30 * schaal, -0.05, 30 * schaal, 5 * schaal); for (let i = 0; i < 3; i++) delen.push(() => { ctx.beginPath(); ctx.ellipse((1 + i * 5) * schaal, 34 * schaal, 5 * schaal, 6 * schaal, 0, 0, 6.283); }); }
  else if (soort === 'open' || soort === 'zwaai') { const sp = soort === 'zwaai' ? 0.14 + golf * 0.05 : 0.08; for (let i = 0; i < 4; i++) vinger((-8 + i * 5.5) * schaal, 32 * schaal, (i - 1.5) * sp, (i === 0 ? 18 : i === 3 ? 16 : 21) * schaal, 4.4 * schaal); }
  else { for (let i = 0; i < 4; i++) vinger((-7.5 + i * 5) * schaal, 32 * schaal, 0.06 * (i - 1.5), (i === 3 ? 12 : 16) * schaal, 4.4 * schaal); }
  vinger(12 * schaal, 12 * schaal, soort === 'wijs' ? 0.9 : -0.6, 16 * schaal, 5 * schaal); // duim
  if (LIJN) { ctx.fillStyle = LIJNKLEUR(M.huid); ctx.strokeStyle = LIJNKLEUR(M.huid); ctx.lineWidth = LW * 2; for (const d of delen) { d(); ctx.stroke(); } }
  ctx.fillStyle = M.huid; for (const d of delen) { d(); ctx.fill(); }
  ctx.fillStyle = M.huidS; ctx.beginPath(); ctx.ellipse(-5 * schaal, 24 * schaal, 5 * schaal, 11 * schaal, 0, 0, 6.283); ctx.fill(); // schaduwtint in de handpalm
}

// ---------- arm (vooraanzicht) ----------
// s = -1 links in beeld (Maya's rechterarm), +1 rechts in beeld; a1/a2 = hoek t.o.v. recht omlaag, + = naar buiten
function arm(ctx, s, a1, a2, o = {}) {
  const S = [s < 0 ? 104 : 304, 330], L1 = 146, L2 = 166 * (o.kort || 1);
  const E = [S[0] + s * Math.sin(a1) * L1, S[1] + Math.cos(a1) * L1];
  const W = [E[0] + s * Math.sin(a2) * L2, E[1] + Math.cos(a2) * L2];
  const dir = Math.atan2(W[0] - E[0], W[1] - E[1]);
  const C = [E[0] + (W[0] - E[0]) * 0.86, E[1] + (W[1] - E[1]) * 0.86]; // begin manchet
  // hand eerst, de manchet valt eroverheen
  ctx.save();
  if (o.zak) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(400, 0); ctx.lineTo(400, 1150); ctx.lineTo(0, 1150); ctx.lineTo(0, 600); ctx.lineTo(108, 600); ctx.quadraticCurveTo(150, 588, 200, 572); ctx.lineTo(200, 0); ctx.closePath(); ctx.clip(); }
  ctx.translate(W[0], W[1]); ctx.rotate(-dir); if (s < 0) ctx.scale(-1, 1);
  hand(ctx, o.hand || 'rust', 1.45, o.golf || 0); ctx.restore();
  if (o.zak && LIJN) { ctx.strokeStyle = LIJNKLEUR(M.jeans); ctx.lineWidth = LW; ctx.beginPath(); ctx.moveTo(108, 600); ctx.quadraticCurveTo(150, 588, 186, 576); ctx.stroke(); }
  if (o.zak) { ctx.fillStyle = M.jeansS; ctx.beginPath(); ctx.moveTo(108, 600); ctx.quadraticCurveTo(150, 588, 186, 576); ctx.lineTo(186, 583); ctx.quadraticCurveTo(150, 596, 110, 607); ctx.closePath(); ctx.fill(); }
  // mouw: bovenarm en ruime onderarm (ballonmouw), dan de manchet
  const vul = M.trui, Mx = [(E[0] + C[0]) / 2, (E[1] + C[1]) / 2];
  vormen(ctx, [() => capsule(ctx, S[0], S[1], 30, E[0], E[1], 27), () => capsule(ctx, E[0], E[1], 27, Mx[0], Mx[1], 31), () => capsule(ctx, Mx[0], Mx[1], 31, C[0], C[1], 23)], vul,
    () => { ctx.fillStyle = M.truiS; ctx.beginPath(); ctx.ellipse(Mx[0] + Math.cos(dir) * s * 18, Mx[1] - Math.sin(dir) * s * 18, 13, 70, -dir, 0, 6.283); ctx.fill(); });
  const M2 = [W[0] + (C[0] - W[0]) * 0.1, W[1] + (C[1] - W[1]) * 0.1];
  vorm(ctx, () => { capsule(ctx, C[0], C[1], 21, M2[0], M2[1], 19); }, M.truiS, () => { ctx.strokeStyle = M.trui; ctx.lineWidth = 1.6; for (let i = -2; i <= 2; i++) { const px = Math.cos(dir), py = -Math.sin(dir); ctx.beginPath(); ctx.moveTo(C[0] + px * i * 7 - Math.sin(dir) * 4, C[1] + py * i * 7 - Math.cos(dir) * 4); ctx.lineTo(M2[0] + px * i * 7, M2[1] + py * i * 7); ctx.stroke(); } });
  // plooi bij de elleboog
  if (LIJN) { ctx.strokeStyle = LIJNKLEUR(vul); ctx.lineWidth = LW * 0.8; ctx.beginPath(); ctx.moveTo(E[0] - s * 12, E[1] - 6); ctx.quadraticCurveTo(E[0], E[1] + 4, E[0] + s * 10, E[1] - 2); ctx.stroke(); }
  return { E, W, dir };
}

// ---------- Maya vooraanzicht ----------
function mayaVoor(ctx, x, y, h, o = {}) {
  const t = o.t || 0, k = h / 1040;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-200, -1150); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const adem = Math.sin(t * 1.6) * 1.2, knik = o.knik || 0;
  // --- puff achter het hoofd (veert iets na bij een knik)
  const pv = Math.sin(t * 1.6 - 0.6) * 1.5 + knik * 6;
  const puff = []; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283; puff.push([166 + Math.cos(a) * 46 + pv * 0.3, 88 + Math.sin(a) * 40 + pv, 24 + (i % 3) * 3]); } puff.push([166, 88 + pv, 44]);
  unie(ctx, puff, M.haar);
  ctx.strokeStyle = M.haarL; ctx.lineWidth = 2.2; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283 + 0.3, r = 30 + (i % 2) * 10; ctx.beginPath(); ctx.arc(166 + Math.cos(a) * r, 88 + pv + Math.sin(a) * r * 0.8, 7, a + 1, a + 3); ctx.stroke(); }
  // --- benen (jeans), enkels, schoenen
  const been = (bin, buit, voetX) => {
    vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(buit[0][0], buit[0][1]); ctx.bezierCurveTo(buit[1][0], buit[1][1], buit[2][0], buit[2][1], buit[3][0], buit[3][1]); ctx.lineTo(bin[3][0], bin[3][1]); ctx.bezierCurveTo(bin[2][0], bin[2][1], bin[1][0], bin[1][1], bin[0][0], bin[0][1]); ctx.closePath(); }, M.jeans,
      () => { ctx.fillStyle = M.jeansS; ctx.beginPath(); ctx.moveTo(bin[0][0], bin[0][1]); ctx.bezierCurveTo(bin[1][0], bin[1][1], bin[2][0], bin[2][1], bin[3][0], bin[3][1]); ctx.lineTo(bin[3][0] + (buit[3][0] > bin[3][0] ? 26 : -26), bin[3][1]); ctx.lineTo(bin[0][0] + (buit[3][0] > bin[3][0] ? 20 : -20), bin[0][1] + 40); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = M.naad; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.4; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(buit[0][0] + (buit[3][0] > bin[3][0] ? -8 : 8), buit[0][1] + 30); ctx.bezierCurveTo(buit[1][0] + (buit[3][0] > bin[3][0] ? -8 : 8), buit[1][1], buit[2][0] + (buit[3][0] > bin[3][0] ? -8 : 8), buit[2][1], buit[3][0] + (buit[3][0] > bin[3][0] ? -8 : 8), buit[3][1]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; });
    // omgeslagen pijp
    const lx = Math.min(bin[3][0], buit[3][0]) - 4, rx = Math.max(bin[3][0], buit[3][0]) + 4;
    vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(lx, 1030); ctx.lineTo(rx, 1030); ctx.lineTo(rx + 2, 1056); ctx.lineTo(lx - 2, 1056); ctx.closePath(); }, M.jeansL);
    // enkel
    vorm(ctx, () => { ctx.beginPath(); ctx.rect(voetX - 18, 1054, 36, 32); }, M.huid);
    // sneaker (vooraanzicht, neus iets naar buiten)
    const z = voetX < 200 ? -1 : 1;
    vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(voetX - 30, 1082); ctx.quadraticCurveTo(voetX, 1070, voetX + 28, 1082); ctx.quadraticCurveTo(voetX + 34 + z * 14, 1100, voetX + 40 + z * 22, 1128); ctx.lineTo(voetX - 40 + z * 22, 1132); ctx.quadraticCurveTo(voetX - 38, 1100, voetX - 30, 1082); ctx.closePath(); }, M.schoen,
      () => { ctx.fillStyle = M.schoenS; ctx.fillRect(voetX - 50, 1118, 110, 16); ctx.strokeStyle = M.schoenS; ctx.lineWidth = 2.2; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(voetX - 12 + z * i * 3, 1088 + i * 8); ctx.lineTo(voetX + 12 + z * i * 3, 1088 + i * 8); ctx.stroke(); } });
    vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(voetX - 46 + z * 22, 1128); ctx.lineTo(voetX + 46 + z * 22, 1124); ctx.quadraticCurveTo(voetX + 50 + z * 22, 1146, voetX + 36 + z * 22, 1148); ctx.lineTo(voetX - 38 + z * 22, 1150); ctx.quadraticCurveTo(voetX - 50 + z * 22, 1146, voetX - 46 + z * 22, 1128); ctx.closePath(); }, M.zool);
  };
  been([[205, 640], [186, 800], [160, 930], [146, 1032]], [[120, 562], [100, 740], [84, 900], [76, 1032]], 112);
  been([[212, 640], [226, 800], [228, 930], [222, 1032]], [[296, 562], [304, 740], [298, 900], [290, 1032]], 256);
  // broekband, gulp, zakken
  vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(114, 548); ctx.lineTo(302, 548); ctx.lineTo(304, 600); ctx.quadraticCurveTo(208, 660, 112, 600); ctx.closePath(); }, M.jeans,
    () => { ctx.fillStyle = M.jeansS; ctx.fillRect(110, 575, 200, 6); });
  if (LIJN) { ctx.strokeStyle = LIJNKLEUR(M.jeans); ctx.lineWidth = LW * 0.8; ctx.beginPath(); ctx.moveTo(208, 578); ctx.quadraticCurveTo(212, 615, 205, 640); ctx.moveTo(250, 572); ctx.quadraticCurveTo(262, 600, 300, 604); ctx.stroke(); }
  for (const bx of [140, 190, 228, 276]) { ctx.fillStyle = M.jeansS; ctx.fillRect(bx - 3, 548, 6, 26); }
  ctx.fillStyle = M.naad; ctx.beginPath(); ctx.arc(208, 562, 5, 0, 6.283); ctx.fill();
  // --- trui (romp), met ademhaling
  ctx.save(); ctx.translate(0, -adem);
  vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(176, 296); ctx.bezierCurveTo(140, 300, 112, 304, 106, 334); ctx.bezierCurveTo(112, 420, 116, 500, 120, 548);
      ctx.quadraticCurveTo(208, 560 + adem, 296, 546); ctx.bezierCurveTo(298, 500, 300, 420, 304, 334); ctx.bezierCurveTo(296, 304, 270, 300, 238, 296); ctx.quadraticCurveTo(207, 314, 176, 296); ctx.closePath(); }, M.trui,
    () => { ctx.fillStyle = M.truiS; ctx.beginPath(); ctx.moveTo(262, 330); ctx.quadraticCurveTo(300, 420, 290, 552); ctx.lineTo(320, 552); ctx.lineTo(320, 330); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(118, 360); ctx.quadraticCurveTo(140, 450, 128, 548); ctx.lineTo(100, 548); ctx.lineTo(100, 360); ctx.closePath(); ctx.fill();
      ctx.fillStyle = M.truiS; ctx.fillRect(100, 528, 220, 30); // boord onderaan
      ctx.strokeStyle = M.trui; ctx.lineWidth = 1.5; for (let xx = 122; xx < 300; xx += 9) { ctx.beginPath(); ctx.moveTo(xx, 532); ctx.lineTo(xx, 556); ctx.stroke(); } });
  // plooien
  if (LIJN) { ctx.strokeStyle = LIJNKLEUR(M.trui); ctx.lineWidth = LW * 0.75; ctx.beginPath(); ctx.moveTo(150, 470); ctx.quadraticCurveTo(170, 490, 168, 520); ctx.moveTo(250, 450); ctx.quadraticCurveTo(240, 480, 252, 512); ctx.moveTo(118, 528); ctx.quadraticCurveTo(208, 536, 300, 526); ctx.stroke(); }
  ctx.restore();
  // --- armen
  const p = o.armen || { L: [0.24, -0.34, 'rust', true], R: [0.18, 0.05, 'rust'] };
  const kortV = (a2) => a2 > 1.6 ? 0.72 : 1;
  arm(ctx, -1, p.L[0], p.L[1], { hand: p.L[2], zak: p.L[3], kort: p.L[3] ? 0.78 : kortV(p.L[1]), golf: p.golf });
  arm(ctx, 1, p.R[0], p.R[1], { hand: p.R[2], golf: p.golf, kort: kortV(p.R[1]) });
  // --- hals en kraag
  ctx.save(); ctx.translate(0, -adem * 0.6);
  vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(184, 250); ctx.lineTo(230, 250); ctx.lineTo(234, 300); ctx.quadraticCurveTo(207, 312, 180, 300); ctx.closePath(); }, M.huid, () => { ctx.fillStyle = M.huidS; ctx.beginPath(); ctx.ellipse(207, 262, 30, 18, 0, 0, 6.283); ctx.fill(); });
  vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(172, 294); ctx.quadraticCurveTo(207, 322, 242, 294); ctx.quadraticCurveTo(246, 306, 240, 308); ctx.quadraticCurveTo(207, 334, 174, 308); ctx.quadraticCurveTo(168, 304, 172, 294); ctx.closePath(); }, M.truiS);
  // --- hoofd (iets kantelen bij praten)
  const kant = Math.sin(t * 0.7) * 0.025 + (o.kantel || 0);
  ctx.translate(207, 260); ctx.rotate(kant); ctx.translate(-207, -260 + knik * 3);
  // oren
  for (const s of [-1, 1]) vorm(ctx, () => { ctx.beginPath(); ctx.ellipse(207 + s * 60, 214, 11, 18, s * 0.15, 0, 6.283); }, M.huid, () => { ctx.fillStyle = M.huidS; ctx.beginPath(); ctx.ellipse(207 + s * 62, 216, 5, 10, 0, 0, 6.283); ctx.fill(); });
  // gezicht
  vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(207, 112); ctx.bezierCurveTo(250, 112, 268, 150, 266, 196); ctx.bezierCurveTo(264, 236, 240, 268, 207, 272); ctx.bezierCurveTo(174, 268, 150, 236, 148, 196); ctx.bezierCurveTo(146, 150, 164, 112, 207, 112); ctx.closePath(); }, M.huid,
    () => { ctx.fillStyle = M.huidS; ctx.beginPath(); ctx.ellipse(262, 210, 18, 60, 0.1, 0, 6.283); ctx.fill(); });
  // haarkap met haarlijn
  vorm(ctx, () => { ctx.beginPath(); ctx.moveTo(146, 200); ctx.bezierCurveTo(136, 150, 156, 104, 207, 100); ctx.bezierCurveTo(258, 100, 278, 150, 268, 200);
      ctx.bezierCurveTo(262, 168, 250, 150, 230, 146); ctx.quadraticCurveTo(207, 138, 184, 146); ctx.bezierCurveTo(164, 150, 152, 168, 146, 200); ctx.closePath(); }, M.haar,
    () => { ctx.strokeStyle = M.haarL; ctx.lineWidth = 2; for (const [a, b, c2, d] of [[175, 150, 168, 112], [205, 140, 186, 104], [236, 148, 214, 104], [258, 172, 240, 114]]) { ctx.beginPath(); ctx.moveTo(a, b); ctx.quadraticCurveTo((a + c2) / 2 - 8, (b + d) / 2, c2, d); ctx.stroke(); } });
  // gezicht: wenkbrauwen, ogen (knipperen), neus, mond (praten)
  const knip = (o.knipper != null ? o.knipper : ((t % 4.2) < 0.13 ? 1 : 0));
  const verbaasd = o.uit === 'verbaasd' ? 1 : 0;
  ctx.strokeStyle = M.haar; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(207 + s * 16, 180 - verbaasd * 6); ctx.quadraticCurveTo(207 + s * 30, 172 - verbaasd * 8, 207 + s * 44, 179 - verbaasd * 5); ctx.stroke(); }

document.getElementById('pauze').onclick = (e) => { pauze = !pauze; if (pauze) tPauze = (performance.now() - t0) / 1000; else t0 = performance.now() - tPauze * 1000; e.target.textContent = pauze ? 'Verder' : 'Pauze'; };
