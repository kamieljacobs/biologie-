<title>Uitspraak beluisteren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: één beoordeelkaart bovenaan (het woord dat nu aan de beurt is), daaronder de doorzoekbare woordenlijst. Huisstijl van de site: navy, goud, Fraunces/Source Sans 3/Plex Mono. */
:root{
  --bg:#f3f1ea; --surface:#fffdf7; --raised:#ece8dc; --line:#d9d3c2; --text:#1d2433; --text2:#5b6273;
  --goud:#9a6a12; --goed:#2f7a4d; --fout:#b43c2e; --twijfel:#8a6d14; --sel:#e8dcc0;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Source Sans 3','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1626; --surface:#162036; --raised:#1d2943; --line:#2b3a5a; --text:#e9e5da; --text2:#a3abbd;
  --goud:#e2b357; --goed:#6cc28e; --fout:#ef7e6e; --twijfel:#e2c76a; --sel:#2a3654; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1626; --surface:#162036; --raised:#1d2943; --line:#2b3a5a; --text:#e9e5da; --text2:#a3abbd;
  --goud:#e2b357; --goed:#6cc28e; --fout:#ef7e6e; --twijfel:#e2c76a; --sel:#2a3654; color-scheme:dark}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
h1{font:650 clamp(26px,4vw,36px)/1.1 var(--display);margin:0;text-wrap:balance}
.kop{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.kop p{margin:4px 0 0;color:var(--text2);max-width:62ch}
.tel{font:500 13px/1.4 var(--mono);color:var(--text2);display:flex;gap:14px;flex-wrap:wrap}
.tel b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.balk{height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.balk i{display:block;height:100%;background:var(--goud);width:0}
.kaart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:16px}
.lab{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text2)}
.woord{font:650 clamp(34px,7vw,56px)/1.05 var(--display);margin:0;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--text2);font-size:15px}
.meta span b{color:var(--text);font-weight:600}
.clips{display:grid;gap:10px}
.clip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--raised)}
.clip .zin{min-width:0}
.clip .zin q{quotes:none;font-size:17px}
.clip .zin mark{background:none;color:var(--goud);font-weight:600}
.clip small{display:block;font:12px/1.4 var(--mono);color:var(--text2);margin-top:2px}
button{font:600 15px/1 var(--body);color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--goud)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--goud);outline-offset:2px}
.speel{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:16px}
.speel.aan{background:var(--goud);color:var(--bg);border-color:var(--goud)}
.per{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.per button{font-size:13px;padding:6px 10px}
.per button[data-po="goed"].gekozen{background:var(--goed);border-color:var(--goed);color:var(--bg)}
.per button[data-po="fout"].gekozen{background:var(--fout);border-color:var(--fout);color:var(--bg)}
.per button[data-best].gekozen{background:var(--goud);border-color:var(--goud);color:var(--bg)}
.keuze{display:flex;flex-wrap:wrap;gap:10px}
.keuze button{min-width:120px;display:flex;gap:8px;align-items:center;justify-content:center}
.keuze kbd{font:500 11px/1 var(--mono);color:var(--text2);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.keuze button[data-o="goed"].gekozen{background:var(--goed);border-color:var(--goed);color:var(--bg)}
.keuze button[data-o="fout"].gekozen{background:var(--fout);border-color:var(--fout);color:var(--bg)}
.keuze button[data-o="twijfel"].gekozen{background:var(--twijfel);border-color:var(--twijfel);color:var(--bg)}
.keuze button.gekozen kbd{color:inherit;border-color:currentColor}
.notitie{display:grid;gap:6px}
input,select{font:16px/1.3 var(--body);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.hint{font:12px/1.5 var(--mono);color:var(--text2)}
.melding{font-size:14px;color:var(--text2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters input{flex:1 1 220px}
.lijst{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rij{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.rij:first-child{border-top:0}
.rij:hover{background:var(--raised)}
.rij.nu{background:var(--sel)}
.rij .w{min-width:0;overflow-wrap:anywhere}
.rij .w small{color:var(--text2);margin-left:8px;font-size:13px}
.chip{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.chip.goed{color:var(--goed);border-color:var(--goed)}
.chip.fout{color:var(--fout);border-color:var(--fout)}
.chip.twijfel{color:var(--twijfel);border-color:var(--twijfel)}
.meer{padding:12px 14px;border-top:1px solid var(--line);text-align:center}
@media (max-width:560px){.kaart{padding:16px}.keuze button{min-width:0;flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
