// ---- lettuce v2: naturalistic leaves along a curved spine, ruffled edge, veins ----
function leafPath(pts){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); }
function slaBlad(x,y,len,wid,a0,curl,seed,col,vit){
  // spine: start at base (x,y), direction a0 (rad, 0=up), curvature curl (rad over length)
  const N=40, spine=[]; let px=x, py=y;
  for(let i=0;i<=N;i++){ const t=i/N, a=a0+curl*t*t; spine.push([px,py,a,t]); px+=Math.sin(a)*len/N; py-=Math.cos(a)*len/N; }
  const L=[],R=[];
  spine.forEach(([sx,sy,a,t],i)=>{ const prof=Math.sqrt(Math.max(0,1-Math.pow((t-0.58)/0.58,2)));
    const base=prof*wid*(0.45+0.55*t);
    const ruf=wid*0.07*prof*(0.4+t)*(Math.sin(t*24+seed)+0.45*Math.sin(t*47+seed*2));
    const nx=Math.cos(a), ny=Math.sin(a);
    L.push([sx-nx*(base+ruf), sy-ny*(base+ruf)]); R.push([sx+nx*(base-ruf*0.8), sy+ny*(base-ruf*0.8)]); });
  const outline=L.concat(R.reverse());
  leafPath(outline); ctx.fillStyle=col.blad; ctx.fill(); ctx.strokeStyle=col.rand; ctx.lineWidth=1.4; ctx.stroke();
  // lighter inner zone near the midrib (flat, no gradient)
  const inner=[]; spine.forEach(([sx,sy,a,t])=>{ const w=Math.sqrt(Math.max(0,1-Math.pow((t-0.58)/0.58,2)))*wid*(0.45+0.55*t)*0.42; inner.push([sx-Math.cos(a)*w, sy-Math.sin(a)*w]); });
  const inner2=[]; spine.slice().reverse().forEach(([sx,sy,a,t])=>{ const w=Math.sqrt(Math.max(0,1-Math.pow((t-0.58)/0.58,2)))*wid*(0.45+0.55*t)*0.42; inner2.push([sx+Math.cos(a)*w, sy+Math.sin(a)*w]); });
  leafPath(inner.concat(inner2)); ctx.fillStyle=col.licht; ctx.fill();
  // midrib
  ctx.beginPath(); spine.forEach(([sx,sy],i)=>i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy)); ctx.strokeStyle=col.nerf; ctx.lineWidth=3.2*vit; ctx.stroke();
  // side veins
  ctx.lineWidth=1.1; ctx.strokeStyle=col.nerf;
  for(let i=4;i<N-2;i+=4){ const [sx,sy,a,t]=spine[i]; const w=Math.sqrt(Math.max(0,1-Math.pow((t-0.58)/0.58,2)))*wid*(0.45+0.55*t)*0.8;
    for(const d of [-1,1]){ const va=a+d*0.9; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(sx+Math.sin(a)*w*0.25+d*Math.cos(a)*w*0.5, sy-Math.cos(a)*w*0.25+d*Math.sin(a)*w*0.5, sx+Math.sin(va)*w*0.55*1+d*Math.cos(a)*w*0.35, sy-Math.cos(va)*w*0.55+d*Math.sin(a)*w*0.35); ctx.stroke(); } }
}
function pillLabel(name,meta,ax,ay,lx,ly,boxRight){
  ctx.save(); ctx.font=fTekst(36,600); const w1=ctx.measureText(name).width; ctx.font=fMeta(24); const w2=meta?ctx.measureText(meta.toUpperCase()).width+meta.length*3:0;

  ctx.strokeStyle='#1A2740'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.fillStyle='#1A2740'; ctx.beginPath(); ctx.arc(ax,ay,4,0,6.283); ctx.fill();
  roundRect(ctx,x,y,w,h,6); ctx.fillStyle='rgba(18,26,38,0.88)'; ctx.fill();
  text(ctx,name,x+18,y+40,fTekst(36,600),C.text,'left'); if(meta) metaText(ctx,meta,x+18,y+76,C.grain,'left',24); ctx.restore(); }
const FRIS={blad:'#5E9E4F',licht:'#8DC46F',rand:'#A9D88A',nerf:'#CDE8B0'};
const FRIS2={blad:'#4F8C44',licht:'#79B562',rand:'#97CB7C',nerf:'#C2E0A6'};
const SLAP={blad:'#7E9A57',licht:'#A2B874',rand:'#B5C68C',nerf:'#D3DDB4'};
function blad2(x,y,len,wid,a0,curl,seed,col,crinkle){
  // broad, rounded lettuce leaf: obovate outline with a fine crinkled edge
  const N=60, sp=[]; let px=x,py=y;
  for(let i=0;i<=N;i++){ const t=i/N, a=a0+curl*t*t; sp.push([px,py,a,t]); px+=Math.sin(a)*len/N; py-=Math.cos(a)*len/N; }
  const W=t=>wid*Math.pow(Math.sin(Math.PI*Math.min(t,0.999)),0.55)*(0.35+0.65*Math.pow(t,0.6));
  const L=[],R=[];
  sp.forEach(([sx,sy,a,t])=>{ const w=W(t), c=wid*crinkle*Math.pow(t,0.8)*(Math.sin(t*90+seed)*0.6+Math.sin(t*37+seed*1.7)*0.4);
    const nx=Math.cos(a), ny=Math.sin(a); L.push([sx-nx*(w+c),sy-ny*(w+c)]); R.push([sx+nx*(w-c*0.9),sy+ny*(w-c*0.9)]); });
  leafPath(L.concat(R.slice().reverse())); ctx.fillStyle=col.blad; ctx.fill(); ctx.strokeStyle=col.rand; ctx.lineWidth=1.6; ctx.stroke();
  // light band along the midrib (flat second tone)
  const I=[],J=[]; sp.forEach(([sx,sy,a,t])=>{ const w=W(t)*0.38*(1-t*0.4); I.push([sx-Math.cos(a)*w,sy-Math.sin(a)*w]); J.push([sx+Math.cos(a)*w,sy+Math.sin(a)*w]); });
  leafPath(I.concat(J.reverse())); ctx.fillStyle=col.licht; ctx.fill();
  ctx.beginPath(); sp.slice(0,N-6).forEach(([sx,sy],i)=>i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy)); ctx.strokeStyle=col.nerf; ctx.lineWidth=4; ctx.stroke();
  ctx.lineWidth=1.2; ctx.globalAlpha=0.7;
  for(let i=8;i<N-8;i+=7){ const [sx,sy,a,t]=sp[i], w=W(t)*0.85; for(const d of [-1,1]){ const ex=sx+d*Math.cos(a)*w+Math.sin(a)*w*0.45, ey=sy+d*Math.sin(a)*w-Math.cos(a)*w*0.45;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(sx+d*Math.cos(a)*w*0.5, sy+d*Math.sin(a)*w*0.5, ex, ey); ctx.stroke(); } }
  ctx.globalAlpha=1;
}
const KROP_F=[{blad:'#3F7F3A',licht:'#5E9C4C',rand:'#77B060',nerf:'#B9DB9C'},{blad:'#4E9443',licht:'#71B058',rand:'#8CC470',nerf:'#C8E6AA'},{blad:'#73B356',licht:'#9CCD75',rand:'#B5DD8E',nerf:'#E0F2C8'},{blad:'#A2D27A',licht:'#C3E59C',rand:'#D4EDB4',nerf:'#EEF8DC'}];
const KROP_S=[{blad:'#6F8A4A',licht:'#8CA35F',rand:'#A0B577',nerf:'#CBD6A8'},{blad:'#7E9A55',licht:'#9BB06C',rand:'#AEC083',nerf:'#D4DDB2'},{blad:'#97AE68',licht:'#B2C483',rand:'#C2D097',nerf:'#E1E8C6'},{blad:'#B4C682',licht:'#CAD89E',rand:'#D6E1B0',nerf:'#ECF1D8'}];
function krop(x,y,s,slap){
  const P=slap?KROP_S:KROP_F;

  const rings = slap
    ? [{n:7,spread:1.45,curl:0.5,len:230,wid:118,dx:70},{n:6,spread:1.15,curl:0.45,len:190,wid:104,dx:50},{n:5,spread:0.8,curl:0.4,len:140,wid:84,dx:30},{n:3,spread:0.4,curl:0.35,len:90,wid:60,dx:12}]
    : [{n:7,spread:0.95,curl:-0.25,len:215,wid:112,dx:62},{n:6,spread:0.72,curl:-0.35,len:200,wid:104,dx:44},{n:5,spread:0.5,curl:-0.45,len:175,wid:92,dx:26},{n:3,spread:0.22,curl:-0.4,len:140,wid:78,dx:10}];
  rings.forEach((r,k)=>{ const order=[]; for(let i=0;i<r.n;i++) order.push(i);
    order.sort((a,b)=>Math.abs(b-(r.n-1)/2)-Math.abs(a-(r.n-1)/2)); // sides first, centre leaf last
    order.forEach(i=>{ const u=r.n>1? i/(r.n-1)*2-1 : 0, h=hash(i*7+k*13);
      const a0=u*r.spread, curl=u*r.curl ;
      blad2(x+u*r.dx*s, y-4*s, r.len*s*(0.9+0.2*h), r.wid*s*(0.9+0.15*h), a0, curl, i*2.3+k*5, P[k], slap?0.035:0.05); }); });
}
// ---------- realistic leaf ----------
function blad3(x,y,len,wid,a0,curl,seed,pal,opt){
  opt=opt||{};
  const N=80, sp=[]; let px=x,py=y;
  for(let i=0;i<=N;i++){ const t=i/N, a=a0+curl*t*t*(opt.droopLate?t:1); sp.push([px,py,a,t]); px+=Math.sin(a)*len/N; py-=Math.cos(a)*len/N; }
  const Wf=t=>wid*Math.pow(Math.sin(Math.PI*Math.min(t,0.995)),0.5)*(0.28+0.72*Math.pow(t,0.55));
  const edge=(t,side)=>{ const k=opt.crinkle||0.06, ph=seed*3.1+side*1.7;
    return wid*k*Math.pow(t,0.6)*(0.5*Math.abs(Math.sin(t*52+ph))+0.35*Math.sin(t*13+ph*0.7)+0.25*Math.abs(Math.sin(t*131+ph*1.3))); };
  const L=[],R=[];
  sp.forEach(([sx,sy,a,t])=>{ const nx=Math.cos(a), ny=Math.sin(a), wl=Wf(t)*(1+(opt.asym||0))+edge(t,0), wr=Wf(t)*(1-(opt.asym||0))+edge(t,1);
    L.push([sx-nx*wl,sy-ny*wl]); R.push([sx+nx*wr,sy+ny*wr]); });
  const out=L.concat(R.slice().reverse());
  const tip=sp[N];
  // drop shadow for depth between overlapping leaves
  ctx.save(); ctx.shadowColor='rgba(20,35,15,0.35)'; ctx.shadowBlur=18; ctx.shadowOffsetY=6;
  leafPath(out); const g=ctx.createLinearGradient(x,y,tip[0],tip[1]);
  g.addColorStop(0,pal[0]); g.addColorStop(0.35,pal[1]); g.addColorStop(1,pal[2]); ctx.fillStyle=g; ctx.fill(); ctx.restore();
  // darker, cupped rim + soft highlight band (clipped inside the leaf)
  ctx.save(); leafPath(out); ctx.clip();
  ctx.strokeStyle=pal[3]; ctx.globalAlpha=0.55; ctx.lineWidth=wid*0.32; ctx.filter='blur(6px)'; leafPath(out); ctx.stroke(); ctx.filter='none';
  ctx.globalAlpha=0.35; ctx.strokeStyle='#FFFFF0'; ctx.lineWidth=wid*0.22; ctx.filter='blur(10px)';
  ctx.beginPath(); sp.slice(6,N-10).forEach(([sx,sy,a],i)=>{ const o=Wf(0.5)*0.35; const X=sx-Math.cos(a)*o, Y=sy-Math.sin(a)*o; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke(); ctx.filter='none';
  if(opt.wilt){ ctx.globalAlpha=0.6; ctx.strokeStyle=opt.wilt; ctx.lineWidth=wid*0.09; ctx.filter='blur(2px)'; leafPath(out); ctx.stroke(); ctx.filter='none'; }
  // veins: tapered pale midrib + branching side veins
  ctx.globalAlpha=0.9; ctx.strokeStyle=pal[4]; ctx.lineCap='round';
  for(let i=0;i<N-8;i+=2){ const [x1,y1]=sp[i], [x2,y2]=sp[i+2], t=i/N; ctx.lineWidth=wid*0.11*(1-t)+1.2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  ctx.globalAlpha=0.45; ctx.lineWidth=1.6;
  for(let i=10;i<N-6;i+=6){ const [sx,sy,a,t]=sp[i], w=Wf(t); for(const d of [-1,1]){
      const ex=sx+d*Math.cos(a)*w*0.92+Math.sin(a)*w*0.55, ey=sy+d*Math.sin(a)*w*0.92-Math.cos(a)*w*0.55;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(sx+d*Math.cos(a)*w*0.45+Math.sin(a)*w*0.05, sy+d*Math.sin(a)*w*0.45-Math.cos(a)*w*0.05, ex, ey); ctx.stroke(); } }
  ctx.restore();
}
// palettes: [base, middle, tip, rim, vein]
const SF=[['#C9DCA0','#4E8A3A','#2F6A2A','#1E4A1C','#E4F0CF'],['#D3E3A8','#5E9C44','#3C7A30','#24561F','#E8F3D4'],['#E2EDBA','#86BD5E','#5C9C3F','#3A7428','#F0F7DF'],['#EEF4C9','#B5DA86','#8CC060','#5C9440','#F7FBEA']];
const SS=[['#D6D4A2','#8EA05A','#7C8A48','#5A6634','#E6E4C4'],['#DCDAA8','#9AAC64','#86944E','#606C38','#ECEACC'],['#E4E0B2','#ADBC74','#98A45C','#6C7840','#F0EED4'],['#EAE6BE','#C2CC88','#AEB66E','#7E884C','#F4F2DE']];
function krop2(x,y,s,slap){
  const P=slap?SS:SF;
  const rings= slap
   ? [{n:8,spread:1.5,curl:0.55,len:270,wid:96,dx:85},{n:6,spread:1.15,curl:0.6,len:215,wid:86,dx:55},{n:5,spread:0.8,curl:0.7,len:160,wid:72,dx:30},{n:4,spread:0.45,curl:0.6,len:110,wid:54,dx:14}]
   : [{n:8,spread:1.05,curl:-0.15,len:225,wid:118,dx:70},{n:7,spread:0.8,curl:-0.32,len:205,wid:108,dx:48},{n:5,spread:0.52,curl:-0.42,len:178,wid:96,dx:28},{n:3,spread:0.22,curl:-0.38,len:142,wid:80,dx:10}];
  rings.forEach((r,k)=>{ const order=[...Array(r.n).keys()].sort((a,b)=>Math.abs(b-(r.n-1)/2)-Math.abs(a-(r.n-1)/2));
    order.forEach(i=>{ const u=r.n>1? i/(r.n-1)*2-1:0, h=hash(i*7.3+k*13.1);
      blad3(x+u*r.dx*s, y-4*s, r.len*s*(0.88+0.24*h), r.wid*s*(0.88+0.2*h), u*r.spread+(h-0.5)*0.3, u*r.curl+(slap?(hash(i+k*3)-0.5)*0.5:0), i*2.3+k*5.1, P[k],
        {crinkle: slap?0.1:0.13, asym:(h-0.5)*0.2, wilt: slap&&k<2?'#9A8448':null, droopLate:slap}); }); });
}
// ---------- window view: mountains + pine forest ----------
function pine(x,y,h,col){
  ctx.fillStyle=col; ctx.beginPath(); const tiers=7; ctx.moveTo(x,y-h);
  for(let i=1;i<=tiers;i++){ const t=i/tiers, w=h*0.24*t+2; ctx.lineTo(x+w,y-h+h*t*0.92); ctx.lineTo(x+w*0.45,y-h+h*t*0.92-h*0.03); }
  ctx.lineTo(x+2,y); ctx.lineTo(x-2,y);
  for(let i=tiers;i>=1;i--){ const t=i/tiers, w=h*0.24*t+2; ctx.lineTo(x-w*0.45,y-h+h*t*0.92-h*0.03); ctx.lineTo(x-w,y-h+h*t*0.92); }
  ctx.closePath(); ctx.fill();
}
function ridge(x0,x1,base,amp,seed,step){ const pts=[]; for(let x=x0;x<=x1+step;x+=step){ const u=x*0.004+seed; pts.push([x, base-amp*(0.55*Math.abs(Math.sin(u))+0.3*Math.sin(u*2.3+1)+0.15*Math.sin(u*5.1))]); } return pts; }
function landscape(X,Y,Wd,Hd){
  ctx.save(); ctx.beginPath(); ctx.rect(X,Y,Wd,Hd); ctx.clip();
  let g=ctx.createLinearGradient(0,Y,0,Y+Hd); g.addColorStop(0,'#6FA6D6'); g.addColorStop(0.55,'#BCD8EA'); g.addColorStop(1,'#E9EFE6'); ctx.fillStyle=g; ctx.fillRect(X,Y,Wd,Hd);
  const sun=ctx.createRadialGradient(X+Wd*0.78,Y+70,5,X+Wd*0.78,Y+70,220); sun.addColorStop(0,'rgba(255,248,220,0.95)'); sun.addColorStop(0.15,'rgba(255,244,210,0.5)'); sun.addColorStop(1,'rgba(255,244,210,0)'); ctx.fillStyle=sun; ctx.fillRect(X,Y,Wd,Hd);
  // far mountains with snow
  const m1=[[X,Y+260],[X+90,Y+150],[X+170,Y+205],[X+290,Y+95],[X+380,Y+175],[X+470,Y+120],[X+560,Y+190],[X+Wd,Y+150],[X+Wd,Y+Hd],[X,Y+Hd]];

  // shaded side of far mountains
  ctx.fillStyle='rgba(70,90,120,0.25)'; [[290,95,380,175,300,230],[90,150,170,205,110,240],[470,120,560,190,480,230]].forEach(q=>{ ctx.beginPath(); ctx.moveTo(X+q[0],Y+q[1]); ctx.lineTo(X+q[2],Y+q[3]); ctx.lineTo(X+q[4],Y+q[5]); ctx.closePath(); ctx.fill(); });
  // haze
  g=ctx.createLinearGradient(0,Y+170,0,Y+270); g.addColorStop(0,'rgba(225,235,240,0)'); g.addColorStop(1,'rgba(225,235,240,0.75)'); ctx.fillStyle=g; ctx.fillRect(X,Y+170,Wd,100);
  // nearer mountain ridge

  [['#5E7F70',Y+300,26,40,7],['#3F6450',Y+340,36,58,9],['#284A36',Y+392,52,86,13]].forEach(([c,base,sp,h,seed],li)=>{

    for(let x=X-20;x<X+Wd+20;x+=sp*(0.7+0.5*hash(x*0.37+seed))) pine(x, base+4, h*(0.7+0.6*hash(x*0.91+seed)), c); });
  // meadow in front + two big pines framing the view
  ctx.fillStyle='#5F8F42'; ctx.beginPath(); ctx.moveTo(X,Y+Hd-34); ctx.quadraticCurveTo(X+Wd*0.5,Y+Hd-58,X+Wd,Y+Hd-30); ctx.lineTo(X+Wd,Y+Hd); ctx.lineTo(X,Y+Hd); ctx.fill();

function frameKeuken(){

  ctx.strokeStyle='rgba(160,150,135,0.55)'; ctx.lineWidth=2; for(let r=0;r<4;r++){ ctx.beginPath(); ctx.moveTo(0,430+r*44); ctx.lineTo(W,430+r*44); ctx.stroke(); for(let c=0;c<26;c++){ const tx=c*88+(r%2)*44; ctx.beginPath(); ctx.moveTo(tx,430+r*44); ctx.lineTo(tx,474+r*44); ctx.stroke(); } }

  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.moveTo(1240,60); ctx.lineTo(1330,60); ctx.lineTo(1230,250); ctx.lineTo(1215,250); ctx.closePath(); ctx.fill();
