<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Peroxisoom met katalase">
<style>text{font-family:"Source Sans 3",system-ui,sans-serif;font-size:24px;fill:#F2F2EE;font-weight:600}.s{font-size:19px;fill:#C9B896}.f{font-family:"IBM Plex Mono",monospace;font-size:21px;fill:#F2F2EE}.l{stroke:#9AA3B2;stroke-width:1.5;fill:none}</style>
<rect width="900" height="560" fill="#121A26"/>
<circle cx="250" cy="280" r="160" fill="#2E3A5A" stroke="#7A8BA8" stroke-width="5"/>
<rect x="200" y="235" width="100" height="90" rx="10" fill="#5A6FA0" stroke="#AFC0D0" stroke-width="2"/>
<g stroke="#AFC0D0" stroke-width="1.5" opacity=".7"><path d="M210 250 H290 M210 265 H290 M210 280 H290 M210 295 H290 M210 310 H290"/></g>
<path class="l" d="M250 120 L250 70"/><text x="250" y="58" text-anchor="middle">één membraan</text>
<path class="l" d="M300 280 L450 200"/><text x="460" y="198">kern van katalase</text>
<g transform="translate(470,260)"><text class="f" x="0" y="20">stof + O₂ → … + H₂O₂</text><text class="s" x="0" y="48">oxidasen breken stoffen af;</text><text class="s" x="0" y="70">er ontstaat waterstofperoxide</text>
<text class="f" x="0" y="110">2 H₂O₂ → 2 H₂O + O₂</text><text class="s" x="0" y="138">katalase ruimt het giftige</text><text class="s" x="0" y="160">H₂O₂ meteen op</text></g>
<text x="40" y="490" class="s">Taken: lange vetzuren afbreken · ontgiften</text><text x="40" y="512" class="s">(in levercellen o.a. een deel van de alcohol)</text>
<text x="40" y="540" class="s">Niet uit het golgisysteem: groeit en deelt zelf</text>
</svg>
