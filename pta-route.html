<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTA-route biologie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Zelfde stijl als de jaarplanner. Eén kaart per PTA-onderdeel; leerlingen vinken af wat ze gedaan hebben. */
:root{
  --bg:#fbfaf7; --fg:#1f2a25; --muted:#6b7570; --line:#dcdfd9; --row:#ffffff; --row2:#f4f3ee;
  --accent:#2d6a4f; --accent-soft:#e3efe8; --amber:#9a6b00; --amber-soft:#fff3c4;
  --display:"Source Serif 4",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191a; --fg:#e6e9e6; --muted:#9aa39e; --line:#30383a; --row:#1c2224; --row2:#202a2d;
  --accent:#7fc8a4; --accent-soft:#1f3328; --amber:#f2c46b; --amber-soft:#4a3d10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191a; --fg:#e6e9e6; --muted:#9aa39e; --line:#30383a; --row:#1c2224; --row2:#202a2d;
  --accent:#7fc8a4; --accent-soft:#1f3328; --amber:#f2c46b; --amber-soft:#4a3d10; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:0 16px;padding-block:28px 56px}
.wrap{max-width:1100px;margin:0 auto}
h1{font:700 30px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;max-width:70ch}
.tabs{display:flex;gap:4px;margin:10px 0 18px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 18px;font:600 14px var(--body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.06em}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted);margin:0 0 20px}
.meta b{color:var(--fg);font-weight:600}
.ond{background:var(--row);border:1px solid var(--line);border-radius:8px;margin:0 0 20px;overflow:hidden}
.ond header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--row2)}
.ond header h2{font:600 20px/1.2 var(--display);margin:0}
.ond header .w{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:999px;font-weight:600}
.ond header .prog{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub-onderdeel{display:grid;grid-template-columns:minmax(180px,.9fr) minmax(220px,1.2fr) minmax(220px,1.4fr);gap:10px 18px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start}
.sub-onderdeel:last-child{border-bottom:0}
.sub-onderdeel h3{font:600 15.5px/1.3 var(--body);margin:0 0 4px;display:flex;align-items:flex-start;gap:8px}
.chk{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none;cursor:pointer}
.sub-onderdeel.done h3 span{color:var(--muted);text-decoration:line-through}
.af{margin:0 0 0 26px;font-size:12.5px;color:var(--muted)}
.af b{color:var(--amber);font-weight:600}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.hs{margin:0;padding:0;list-style:none}
.hs li{margin:0 0 3px}
.hs small{color:var(--muted)}
.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);margin:0 4px 5px 0;text-decoration:none;white-space:nowrap}
a.chip{background:var(--accent-soft)}
a.chip:hover{background:var(--accent);color:var(--row)}
.chip.vid::before{content:"▶ ";font-size:10px}
.chip.tool::before{content:"⚙ ";font-size:10px}
.chip.soon{border-style:dashed;color:var(--muted);border-color:var(--line)}
.chip.ext{border-color:var(--line);color:var(--fg);background:transparent}
.leeg{color:var(--muted);font-style:italic;font-size:13px}
.notes{margin-top:26px;max-width:72ch;color:var(--muted);font-size:13px}
.notes h3{font:600 15px var(--display);color:var(--fg);margin:0 0 6px}
.notes ul{padding-left:18px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);margin:0 0 18px}
@media (max-width:720px){.sub-onderdeel{grid-template-columns:1fr}}

/* PTA-route als blokken */
.ond{background:transparent;border:0;border-radius:0;margin:0 0 28px;overflow:visible}
.ond header{background:transparent;border:0;border-bottom:2px solid var(--line);padding:0 0 8px;margin:0 0 12px}
.ond-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ond-grid .sub-onderdeel{display:flex;flex-direction:column;gap:10px;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-items:stretch}
.ond-grid .sub-onderdeel:last-child{border-bottom:1px solid var(--line)}
.ond-grid .sub-onderdeel.done{border-color:var(--accent);background:var(--accent-soft)}
.ond-grid .sub-onderdeel h3{font-size:17px}
.ond-grid .sub-onderdeel .af{margin-left:26px}


.coach-report{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px;max-height:520px;overflow:auto}
.cr-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding:0 0 10px;margin:0 0 12px}
.cr-titel{font:600 17px var(--display)}
.cr-wie{font-size:13px;color:var(--muted)}
.cr-tot{font-size:13px;color:var(--muted)}.cr-tot b{font-size:20px;color:var(--accent)}
.cr-groep{margin:0 0 14px}
.cr-kop{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.cr-rij{background:var(--row);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;break-inside:avoid}
.cr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cr-sub{display:block;font-size:12.5px;color:var(--muted)}
.cr-prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cr-bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cr-bar i{display:block;height:100%;background:var(--accent)}
.cr-items{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.cr-items li{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.cr-ico{flex:none;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transform:translateY(3px)}
.ok .cr-ico{background:var(--accent);color:var(--row)}
.nee .cr-ico{border:1.5px solid var(--line)}
.nee .cr-lbl{color:var(--muted)}
.cr-soort{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.cr-leeg{color:var(--muted);margin:0}
@media print{body.print-mentor .coach-report{max-height:none;overflow:visible;border:0;padding:0;background:#fff}body.print-mentor .cr-rij{background:#fff}}

// ---------- Overzicht voor de coach (gedeeld door weekplanning en PTA-route) ----------
// rep = {titel, naam, datum, groepen:[{kop, rijen:[{titel, sub, items:[{ok, soort, label}]}]}]}
const COACH=(function(){
  const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const sorted=items=>items.filter(i=>i.ok).concat(items.filter(i=>!i.ok&&!i.extra));
  const req=items=>items.filter(i=>!i.extra);   // verplicht: huiswerk en films; tools zijn extra
  const telling=rep=>{let d=0,t=0;for(const g of rep.groepen)for(const r of g.rijen)for(const i of req(r.items)){t++;if(i.ok)d++}return {d,t}};
  const col=(kop,its,cls)=>`<div class="cr-col ${cls}"><div class="cr-colkop">${kop} <span>${its.length}</span></div>${its.length?`<ul>${its.map(i=>`<li><span class="cr-ico" aria-hidden="true">${cls==="ok"?"✓":""}</span><span class="cr-lbl">${e(i.label)}</span><span class="cr-soort">${e(i.soort)}${i.extra?" · extra":""}</span></li>`).join("")}</ul>`:`<p class="cr-niets">${cls==="ok"?"nog niets":"alles gedaan"}</p>`}</div>`;
  function html(rep){
    if(!rep.groepen.length) return `<p class="cr-leeg">Je hebt nog niets afgevinkt.</p>`;
    const {d,t}=telling(rep);
    let out=`<div class="cr-top"><div><div class="cr-titel">${e(rep.titel)}</div><div class="cr-wie">${rep.naam?e(rep.naam)+" · ":""}${e(rep.datum)}</div></div><div class="cr-tot"><b>${d}</b> van ${t} gedaan</div></div>`;
    for(const g of rep.groepen){
      out+=`<div class="cr-groep"><div class="cr-kop">${e(g.kop)}</div>`;
      for(const r of g.rijen){
        const R=req(r.items), n=R.filter(i=>i.ok).length, pct=R.length?Math.round(100*n/R.length):100;
        out+=`<div class="cr-rij"><div class="cr-head"><div><b>${e(r.titel)}</b>${r.sub?`<span class="cr-sub">${e(r.sub)}</span>`:""}</div><div class="cr-prog"><span>${n} van ${R.length}</span><i class="cr-bar"><i style="width:${pct}%"></i></i></div></div><div class="cr-cols">`
          +col("Gedaan",r.items.filter(i=>i.ok),"ok")+col("Nog niet gedaan",r.items.filter(i=>!i.ok&&!i.extra),"nee")+`</div></div>`;
      }
      out+=`</div>`;
    }
    return out;
  }
  // Platte tekst (voor als plakken als tabel niet lukt)
  function text(rep){
    if(!rep.groepen.length) return `${rep.titel}\n${rep.naam?rep.naam+" · ":""}${rep.datum}\n\nNog niets afgevinkt.`;
    const {d,t}=telling(rep);
    const L=[rep.titel,`${rep.naam?rep.naam+" · ":""}${rep.datum} · ${d} van ${t} gedaan`,""];
    for(const g of rep.groepen){
      L.push(g.kop.toUpperCase());
      for(const r of g.rijen){
        const R=req(r.items), n=R.filter(i=>i.ok).length;
        L.push(`${r.titel}${r.sub?" · "+r.sub:""} (${n} van ${R.length})`);
        for(const i of sorted(r.items)) L.push(`  ${i.ok?"✓":"○"} ${i.label} (${i.soort.toLowerCase()}${i.extra?", extra":""}${i.ok?"":", nog niet"})`);
        L.push("");
      }
    }
    return L.join("\n").trim();
  }
  // Tabel met inline opmaak, zodat hij netjes in Teams of Word plakt
  function pasteHtml(rep){
    if(!rep.groepen.length) return `<p>${e(rep.titel)}<br>Nog niets afgevinkt.</p>`;
    const {d,t}=telling(rep), td='style="padding:4px 10px;border-bottom:1px solid #e3e3e3;vertical-align:top"';
    let h=`<p><b>${e(rep.titel)}</b><br>${rep.naam?e(rep.naam)+" · ":""}${e(rep.datum)} · ${d} van ${t} gedaan</p>`;
    for(const g of rep.groepen){
      h+=`<p style="margin:12px 0 4px"><b>${e(g.kop)}</b></p><table style="border-collapse:collapse;font-size:13px">`;
      for(const r of g.rijen){
        const R=req(r.items), n=R.filter(i=>i.ok).length;
        h+=`<tr><td colspan="3" style="padding:8px 10px 4px;background:#eef4f0"><b>${e(r.titel)}</b>${r.sub?" · "+e(r.sub):""} — ${n} van ${R.length}</td></tr>`;
        for(const i of sorted(r.items)) h+=`<tr><td ${td}><span style="color:${i.ok?"#2d6a4f":"#9aa39e"}">${i.ok?"✓":"○"}</span></td><td ${td}>${e(i.label)}</td><td ${td}><span style="color:#6b7570">${e(i.soort.toLowerCase())}${i.extra?", extra":""}${i.ok?"":", nog niet"}</span></td></tr>`;
      }
      h+=`</table>`;
    }
    return h;
  }
  function panel(rep,tip){
    return `<section class="mentor" id="mentor"><div class="mentor-h"><h2>Overzicht voor je coach</h2><button type="button" class="btn ghost" data-coach="close">Sluiten</button></div>
      <p class="mentor-tip">${e(tip)}</p>
      <label class="mentor-naam">Je naam <input type="text" id="coach-naam" value="${e(rep.naam)}" autocomplete="name"></label>
      <div class="coach-report" id="coach-report">${html(rep)}</div>
      <div class="mentor-btns"><button type="button" class="btn" data-coach="copy">Kopieer voor Teams</button><button type="button" class="btn ghost" data-coach="print">Afdrukken of pdf</button><span class="copied" id="copied" hidden>Gekopieerd, plak het in Teams</span></div></section>`;
  }
  // Knoppen en naamveld koppelen; getRep() bouwt het overzicht opnieuw, onClose sluit het paneel
  function wire(el,getRep,onClose){
    const naam=el.querySelector("#coach-naam");
    if(naam) naam.addEventListener("input",()=>{try{localStorage.setItem("pta-naam",naam.value)}catch(x){}const box=el.querySelector("#coach-report");if(box)box.innerHTML=html(getRep())});
    el.querySelectorAll("[data-coach]").forEach(b=>b.addEventListener("click",()=>{
      const a=b.dataset.coach;
      if(a==="close") onClose();
      else if(a==="print"){document.body.classList.add("print-mentor");window.print();setTimeout(()=>document.body.classList.remove("print-mentor"),500)}
      else if(a==="copy"){
        const rep=getRep(), txt=text(rep), ok=()=>{const c=el.querySelector("#copied");if(c){c.hidden=false;setTimeout(()=>{c.hidden=true},2500)}};
        const plain=()=>{try{navigator.clipboard.writeText(txt).then(ok,fallback)}catch(x){fallback()}};
        const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(x){}ta.remove()};
        try{navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([pasteHtml(rep)],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]).then(ok,plain)}catch(x){plain()}
      }
    }));
  }
  const naam=()=>{try{return localStorage.getItem("pta-naam")||""}catch(x){return ""}};
  const datum=()=>new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
  // Knop "Alles uitvinken": eerste klik vraagt om bevestiging, tweede klik wist alle sleutels met dit voorvoegsel
  function resetKnop(btn,prefix,klaar){
    let armed=false,timer=null;
    btn.addEventListener("click",()=>{
      if(!armed){armed=true;btn.textContent="Zeker weten? Klik nog een keer";btn.classList.add("warn");timer=setTimeout(()=>{armed=false;btn.textContent="Alles uitvinken";btn.classList.remove("warn")},4000);return}
      clearTimeout(timer);
      try{const weg=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(prefix)===0)weg.push(k)}weg.forEach(k=>localStorage.removeItem(k))}catch(x){}
      klaar();
    });
  }
  return {html,text,panel,wire,naam,datum,resetKnop};
})();
(function(){
  // ---- PTA-route: weergave, afvinken per onderdeel en mentoroverzicht ----

  // Het coachoverzicht maakt daarvan een tekst die de leerling kan kopiëren (Teams) of afdrukken.
  const KEY=(...p)=>"pta:"+p.join(":");
  const getB=k=>{try{return localStorage.getItem(k)==="1"}catch(e){return false}};
  const setB=(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(e){}};
  const getS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
  const setS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const escH=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rank=m=>(m[0]==="tool"?2:0)+(m[3]==="ext"?1:0);   // eigen films, dan GU-films, dan tools (extra)
  const sortM=m=>m.slice().sort((a,b)=>rank(a)-rank(b));
  // Alle afvinkbare dingen van één subonderdeel: hoofdstukken (lezen en opdrachten) en films/tools.
  function items(lvl,o,x){

    for(const [t,n] of sortM(x.m)) out.push({k:KEY(lvl,o.code,x.n,t,n),label:n,kind:t==="tool"?"Tool":"Film",what:t==="tool"?"gedaan":"gekeken",extra:t==="tool"});

  let mentorOpen=false;

  function cards(){

    for(const o of P.ond){
      const total=o.subs.length, done=o.subs.filter(x=>getB(KEY(lvl,o.code,x.n))).length;
      out+=`<section class="ond"><header><h2>${o.code}</h2><span class="prog">${done} van ${total} onderwerpen af</span></header><div class="ond-grid">`;
      for(const x of o.subs){
        const k=KEY(lvl,o.code,x.n), d=getB(k), its=items(lvl,o,x), req=its.filter(i=>!i.extra), nd=req.filter(i=>getB(i.k)).length;
        const hs=x.h.map(([h,b])=>{const ik=KEY(lvl,o.code,x.n,"h",h);return `<li><label class="tick"><input type="checkbox" class="it" data-key="${escH(ik)}" ${getB(ik)?"checked":""}><span>${escH(h)}${b?` <small>· ${escH(b)}</small>`:""}</span></label></li>`}).join("");
        const ms=sortM(x.m).map(([t,n,u,fl])=>{
          const ik=KEY(lvl,o.code,x.n,t,n), cls=`chip ${t}${fl?" "+fl:""}`;
          const chip=u?`<a class="${cls}" href="${escH(u)}" target="_blank" rel="noopener">${escH(n)}</a>`:`<span class="${cls}">${escH(n)}</span>`;
          return `<li><input type="checkbox" class="it" data-key="${escH(ik)}" ${getB(ik)?"checked":""} aria-label="${t==="tool"?"Gedaan":"Gekeken"}: ${escH(n)}">${chip}${t==="tool"?'<span class="extra-tag">extra</span>':""}</li>`;
        }).join("");
        out+=`<div class="sub-onderdeel${d?" done":""}"><div><h3><input class="chk" type="checkbox" data-key="${escH(k)}" ${d?"checked":""} aria-label="Onderwerp af: ${escH(x.n)}"><span>${escH(x.n)}</span><span class="cnt">${nd}/${req.length}</span></h3>${x.af?`<p class="af"><b>${escH(x.af[0])}</b> · af vóór ${escH(x.af[1])}</p>`:""}</div>`
          +`<div><p class="k">Hoofdstukken · lezen en opdrachten maken</p><ul class="hs">${hs}</ul></div>`
          +`<div><p class="k">Films en tools</p>${ms?`<ul class="ms">${ms}</ul>`:`<span class="leeg">nog geen materiaal</span>`}</div></div>`;
      }
      out+=`</div></section>`;
    }
    return out;
  }

  // Overzicht voor de coach: alleen onderwerpen waarin iets is afgevinkt, met ook wat nog open staat
  function coachRep(){
    const P=DATA[lvl], groepen=[];
    for(const o of P.ond){
      const rijen=[];
      for(const x of o.subs){
        const its=items(lvl,o,x), subDone=getB(KEY(lvl,o.code,x.n));
        if(!its.some(i=>getB(i.k))&&!subDone) continue;
        rijen.push({titel:x.n+(subDone?" ✓":""),sub:x.h.map(h=>h[0]).join(", "),items:its.map(i=>({ok:getB(i.k),soort:i.kind,label:i.label,extra:i.extra}))});
      }
      if(rijen.length) groepen.push({kop:o.code,rijen});
    }
    return {titel:`PTA-route biologie · ${lvl}`,naam:COACH.naam(),datum:COACH.datum(),groepen};
  }

  function html(){
    const P=DATA[lvl];
    return `<p class="rt-intro">Per PTA-onderdeel zie je welke hoofdstukken, films en tools erbij horen. Lees elk hoofdstuk en maak de opdrachten; de films en tools helpen je daarbij. Werk in je eigen tempo en vink af wat je hebt gedaan. Begrip vergeten? De <a href="https://gewoonuitgelegd.nl/begrippen/" target="_blank" rel="noopener">begrippenindex van Gewoon Uitgelegd</a> springt naar de minuut in de film waar het wordt uitgelegd.</p>`
      +`<div class="rt-bar"><div class="rt-switch" role="group" aria-label="Niveau">${["havo","vwo"].map(l=>`<button type="button" data-rt="${l}" aria-pressed="${l===lvl}">${l}</button>`).join("")}</div>`
      +`<div class="rt-acts"><button type="button" class="btn ghost" data-reset>Alles uitvinken</button><button type="button" class="btn" data-act="mentor" aria-expanded="${mentorOpen}">Overzicht voor je coach</button></div></div>`
      +(mentorOpen?COACH.panel(coachRep(),"Hier staan de onderwerpen waarin je iets hebt afgevinkt: wat je hebt gedaan en welke hoofdstukken of films nog open staan. Tools zijn extra en staan er alleen in als je ze hebt gedaan. Je vinkjes worden alleen in deze browser bewaard; kopieer het overzicht naar je coach in Teams, of druk het af of sla het op als pdf."):"")
      +`<div class="meta"><span><b>${escH(P.methode)}</b></span><span>${escH(P.pta)}</span></div>`
      +`<div class="rt-legend"><span><i class="chip vid">film</i> eigen film</span><span><i class="chip tool">tool</i><span class="extra-tag">extra</span> extra stof, als je tijd over hebt</span><span><i class="chip ext vid">GU · film</i> van Gewoon Uitgelegd</span><span>☐ vink af wat je hebt gedaan</span></div>`
      +cards();
  }

  function mount(el,notesEl){
    const y=window.scrollY;
    el.innerHTML=html();
    if(notesEl) notesEl.innerHTML=DATA[lvl].notes.map(n=>`<li>${escH(n)}</li>`).join("");
    window.scrollTo(0,y);
    el.querySelectorAll("[data-rt]").forEach(b=>b.addEventListener("click",()=>{lvl=b.dataset.rt;setS("pta-tab",lvl);mount(el,notesEl)}));
    el.querySelectorAll(".chk,.it").forEach(c=>c.addEventListener("change",()=>{setB(c.dataset.key,c.checked);mount(el,notesEl)}));
    el.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.act==="mentor"){mentorOpen=!mentorOpen;mount(el,notesEl);if(mentorOpen){const m=el.querySelector("#mentor");if(m&&m.scrollIntoView)m.scrollIntoView({block:"start"})}}
    }));
    const rb=el.querySelector("[data-reset]"); if(rb) COACH.resetKnop(rb,`pta:${lvl}:`,()=>mount(el,notesEl));
    if(mentorOpen) COACH.wire(el,coachRep,()=>{mentorOpen=false;mount(el,notesEl)});
  }

  mount(document.getElementById("route"),document.getElementById("notes"));
})();
</script>

</body>
</html>
