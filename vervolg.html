<style>
/* Zelfde huisstijl als index.html (navy, goud, Fraunces, lijntekeningen als platen in een biologieboek). */
:root{
  --bg:#0F1726; --bg2:#0B1220; --surface:#141E33; --line:rgba(143,160,181,.16); --line2:rgba(143,160,181,.30);
  --text:#F2F2EE; --text2:#A3ACBA; --text3:#7D8899;
  --goud:#E0B64A; --goud-ink:#1A1405; --goud-text:#E8C266; --goud-soft:rgba(224,182,74,.13);
  --groen:#7FC48F; --koraal:#E8876C; --paars:#A897DB; --teal:#6DB3D6; --oker:#D2AE66;
  --titel:"Fraunces",Georgia,"Times New Roman",serif;
  --tekst:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --meta:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --bg2:#ECEFF3; --surface:#FFFFFF; --line:rgba(20,32,52,.10); --line2:rgba(20,32,52,.22);
  --text:#121C2E; --text2:#4E5A6C; --text3:#6B7687;
  --goud:#D9AC3C; --goud-ink:#1A1405; --goud-text:#8A650C; --goud-soft:rgba(217,172,60,.16);
  --groen:#2F8A47; --koraal:#B9502F; --paars:#6550AD; --teal:#25729C; --oker:#8C6A1C;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--tekst);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--goud);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--titel);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--meta);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
[hidden]{display:none!important}
.kunst{color:var(--c,var(--goud))}
.kunst .acc{color:var(--goud)}

/* Kopbalk (zoals index.html) */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px 28px;min-height:66px;flex-wrap:wrap;padding-block:8px}
.merk{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--titel);white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:8px;color:var(--text2);font-weight:600;font-size:15px}
.nav a:hover{color:var(--text)}
.nav a[aria-current]{color:var(--text);box-shadow:inset 0 -2px 0 var(--goud);border-radius:0}
.rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.icoon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.icoon:hover{color:var(--text)}

/* Paginakop */
.kop{border-bottom:1px solid var(--line)}
.kop .wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;align-items:center;padding-block:44px 40px}
.terug{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-weight:600;font-size:15px}
.terug:hover{color:var(--text)}
.kop .lbl{color:var(--goud-text);margin:26px 0 8px}
.kop h1{font-size:clamp(40px,5vw,60px);line-height:1.02}
.kop p{margin:12px 0 0;color:var(--text2);max-width:60ch}
.kop .groot{justify-self:end;width:220px;height:220px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center}
.kop .groot svg{width:150px;height:150px}

/* Uitleg en filters */
.hoe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:32px;border:1px solid var(--line2);border-radius:4px;background:var(--surface)}
.hoe div{padding:16px 18px;border-right:1px solid var(--line)}
.hoe div:last-child{border-right:0}
.hoe b{display:block;font-family:var(--titel);font-size:18px;margin:6px 0 2px}
.hoe span:not(.mono){color:var(--text2);font-size:15px;line-height:1.45;display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:34px 0 8px}
.filters .mono{color:var(--text3);margin-right:6px}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:600;font-size:14px;color:var(--text2)}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--goud);border-color:var(--goud);color:var(--goud-ink)}
.teller{color:var(--text3);font-size:14px;margin-left:auto}

/* Kern en gebieden */
.kern{margin-top:32px;border:1px solid var(--line2);border-radius:18px;background:var(--surface);padding:22px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start}
.kern .embleem{width:96px;height:96px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.kern .embleem svg{width:74px;height:74px}
.kern h2{font-size:25px;margin:4px 0 6px}
.kern p{margin:0 0 12px;color:var(--text2)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags a,.tags span{font-size:14px;font-weight:600;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.tags a:hover{color:var(--text);border-color:var(--line2)}
.opbouw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px;border:1px solid var(--line2);border-radius:4px;background:var(--surface)}
.opbouw div{padding:16px 18px;border-right:1px solid var(--line)}
.opbouw div:last-child{border-right:0}
.opbouw b{display:block;font-family:var(--titel);font-size:18px;margin:6px 0 2px}
.opbouw span:not(.mono){color:var(--text2);font-size:15px;line-height:1.45;display:block}
.opbouw .mono{color:var(--goud-text)}
.opbouw .later .mono{color:var(--text3)}
.cluster{margin-top:44px}
.cluster>h2{font-size:30px;display:flex;align-items:center;gap:12px}
.cluster>h2 .stip{width:12px;height:12px;border-radius:999px;background:var(--c)}
.cluster>p{margin:6px 0 0;color:var(--text2);max-width:70ch}
.raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-top:16px}
.gb{scroll-margin-top:110px;border:1px solid var(--line2);border-radius:18px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gb header{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;padding:20px 22px 12px;background:radial-gradient(280px 130px at 100% 0,color-mix(in srgb,var(--c) 14%,transparent),transparent)}
.gb .embleem{width:72px;height:72px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.gb .embleem svg{width:54px;height:54px}
.gb .niv{color:var(--c)}
.gb h3{font-size:23px;line-height:1.1;margin:4px 0 0}
.gb .intro{margin:0;padding:0 22px 12px;color:var(--text2);font-size:16px}
.gb .basis{border-top:1px solid var(--line);padding:12px 22px 4px}
.gb .basis .mono{color:var(--text3);display:flex;justify-content:space-between;gap:8px}
.gb ol{list-style:none;margin:8px 0 0;padding:0}
.gb li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);color:var(--text2)}
.gb li:last-child{border-bottom:0}
.gb li .nr{font:600 12px/1.9 var(--meta);color:var(--text3)}
.komt{font:600 10.5px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border:1px dashed var(--line2);border-radius:999px;padding:4px 8px;white-space:nowrap}
.gb .pta{border-top:1px dashed var(--line2);padding:12px 22px 8px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.gb .pta .mono{color:var(--text3);display:flex;justify-content:space-between;gap:8px}
.gb .pta ul{list-style:none;margin:8px 0 0;padding:0}
.gb .pta li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);grid-template-columns:none}
.gb .pta li:last-child{border-bottom:0}
.gb .pta li a{color:var(--text2);min-width:0}
.gb .pta li a:hover{color:var(--text)}
.gb .pta .play{font-size:10px;color:var(--c);margin-right:8px;vertical-align:1px}
.gb .pta .hf{font:600 10.5px/1 var(--meta);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap;flex:none}
.gb footer{margin-top:auto;padding:12px 22px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
.gb footer .mono{color:var(--text3);margin-right:4px}
.gb footer a{font-size:14px;font-weight:600;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.gb footer a:hover{color:var(--text);border-color:var(--line2)}
.leeg{padding:40px 0;color:var(--text3)}
footer.site{margin-top:56px;border-top:1px solid var(--line);color:var(--text3);font-size:14px}
footer.site .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;padding-block:26px 44px}
footer.site a:hover{color:var(--text)}

@media (max-width:900px){
  .kop .wrap{grid-template-columns:1fr;gap:20px;padding-block:28px}
  .kop .groot{justify-self:start;width:120px;height:120px;order:-1}
  .kop .groot svg{width:84px;height:84px}
  .kop .lbl{margin-top:4px}
  .raster{grid-template-columns:1fr}
  .opbouw{grid-template-columns:1fr 1fr}
  .opbouw div:nth-child(2){border-right:0}
  .opbouw div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .hoe{grid-template-columns:1fr 1fr}
  .hoe div:nth-child(2){border-right:0}
  .hoe div:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:600px){
  .wrap{padding-inline:16px}
  .gb header{padding:16px 16px 10px}
  .gb .intro{padding:0 16px 10px}.gb .basis{padding:10px 16px 4px}.gb .pta{padding:10px 16px 6px}.gb footer{padding:10px 16px 16px}
  .kern{grid-template-columns:1fr;padding:18px 16px}
  .opbouw{grid-template-columns:1fr}.opbouw div{border-right:0;border-bottom:1px solid var(--line)}
  .teller{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* levende lijntekeningen: af en toe beweegt er één (uit bij 'beweging verminderen') */
@media (prefers-reduced-motion: no-preference){
svg.kunst.leeft-klop{animation:bk-klop 1.6s ease-in-out}
svg.kunst.leeft-wieg{animation:bk-wieg 2.4s ease-in-out}
svg.kunst.leeft-drijf{animation:bk-drijf 2.6s ease-in-out}
svg.kunst.leeft-adem{animation:bk-adem 2.8s ease-in-out}
svg.kunst.leeft-draai{animation:bk-draai 3s ease-in-out}
}
@keyframes bk-klop{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}45%{transform:scale(1.05)}60%{transform:scale(1)}}
@keyframes bk-wieg{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes bk-drijf{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bk-adem{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.97)}}
@keyframes bk-draai{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
svg.kunst{transform-origin:50% 50%;transform-box:fill-box}

.frs{margin:6px 0 8px}
.fr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:var(--text)}
.fr:last-child{border-bottom:0}
.fr .fb{position:relative;width:44px;height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center}
.fr .fb svg{width:28px;height:28px}
.fr .fb .n{position:absolute;left:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--bg);border:1px solid var(--line2);font:600 10px/16px var(--meta);color:var(--text2);text-align:center}
.fr .fb-leeg{font-size:11px;color:var(--c)}
.fr .ft{display:flex;flex-direction:column;min-width:0}
.fr .ft b{font:700 16px/1.2 var(--titel);color:var(--text)}
.fr .fv{font-size:13.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .fm{font:500 10.5px/1.4 var(--meta);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:3px}
.fr .fgo{width:30px;height:30px;border-radius:999px;background:var(--goud);color:var(--goud-ink,#1a1a1a);display:flex;align-items:center;justify-content:center;font-size:11px}
a.fr:hover b{color:var(--goud-text,var(--goud))}
a.fr:hover .fb{border-color:var(--goud)}
.fr.fr-komt{opacity:.65}
.fr.fr-komt .fb{border-style:dashed;background:none}
.fr.fr-komt .fm{border:1px dashed var(--line2);border-radius:999px;padding:1px 8px;align-self:flex-start}
</style>
</head>

<script>
/* ===== INHOUD — vervolgopleidingen per gebied.
   Eerst komt per gebied de theoretische basis (onderwerpen in 'basis'); 'Een dag uit het werk',
   'praktijkopdracht' en 'opleidingen' volgen later. Een onderwerp dat af is: zet het als
   [titel, href] in plaats van een losse tekst, dan verdwijnt 'komt nog' en wordt het een link.
   bouwt: hoofdstukken op deze site waar het gebied op voortbouwt [label, hoofdstuk-id] ===== */
const CLUSTERS = [
 {id:'gedrag',naam:'Gedrag en hersenen',kleur:'paars',tekst:'Opleidingen over denken, voelen en gedrag, en de biologie die daaronder ligt.'},
 {id:'zorg',naam:'Zorg en geneeskunde',kleur:'koraal',tekst:'Opleidingen waarin je met het menselijk (of dierlijk) lichaam werkt: diagnose stellen, behandelen, verzorgen.'},
 {id:'lab',naam:'Lab en onderzoek',kleur:'teal',tekst:'Opleidingen waarin je in het laboratorium of achter de computer uitzoekt hoe leven werkt.'},

 {id:'groen',naam:'Groen en ecologie',kleur:'groen',tekst:'Opleidingen over natuur, landbouw en het milieu, van een moestuin tot een heel ecosysteem.'},
 {id:'onderwijs',naam:'Onderwijs',kleur:'goud',tekst:'Biologie zelf uitleggen aan anderen.'},
];

(function(){

const CL=Object.fromEntries(CLUSTERS.map(c=>[c.id,c]));

function themaKnop(){
  const d=root.getAttribute('data-theme')!=='light', b=document.getElementById('thema');
  b.innerHTML=d?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
  b.setAttribute('aria-label',d?'Zet licht thema aan':'Zet donker thema aan');
}
document.getElementById('thema').addEventListener('click',()=>{const n=root.getAttribute('data-theme')==='light'?'dark':'light';root.setAttribute('data-theme',n);schrijf('thema',n);themaKnop()});

function filmRij(href,nr,titel){
  const f=FILMS[href]||[titel||href,'','','',0,'','paars'];
  const svg=f[5]?`<svg class="kunst" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="--c:var(--${f[6]||'goud'})">${f[5]}</svg>`:`<span class="fb-leeg" aria-hidden="true">▶</span>`;
  const meta=[f[4]?f[4]+' min':'', f[2]&&f[2]!=='vervolg'?f[1]:''].filter(Boolean).join(' · ');
  return `<a class="fr" href="${esc(href)}"><span class="fb">${svg}${nr?`<span class="n">${nr}</span>`:''}</span><span class="ft"><b>${esc(titel||f[0])}</b>${f[3]?`<span class="fv">${esc(f[3])}</span>`:''}${meta?`<span class="fm">${esc(meta)}</span>`:''}</span><span class="fgo" aria-hidden="true">▶</span></a>`;
}
function kaart(g){
  const c=CL[g.cluster], klaar=g.basis.filter(b=>Array.isArray(b)).length;

}

      <div><a class="terug" href="index.html#home">← Alle hoofdstukken</a><div class="lbl mono">Studie en beroep na je examen</div><h1>Wat word jij?</h1>

        <div class="raster">${GEBIEDEN.filter(g=>g.cluster===c.id).map(kaart).join('')}</div></section>`).join('')}
    </div>`;
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;history.replaceState(null,'',filter?'#'+filter:location.pathname);render()});

const doel=document.getElementById((location.hash||'').slice(1)); if(doel&&!CL[doel.id]) doel.scrollIntoView();

/* levende lijntekeningen: om de paar seconden doet één zichtbare tekening iets kleins */
(function(){ if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const SOORT=['klop','wieg','drijf','adem','klop','wieg','drijf','draai'];
  function zichtbaar(el){ const r=el.getBoundingClientRect(); return r.width>20&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth; }
  function stap(){ if(document.hidden) return; const svgs=[...document.querySelectorAll('svg.kunst:not(.fries)')].filter(zichtbaar); if(!svgs.length) return;
    const el=svgs[Math.floor(Math.random()*svgs.length)]; if([...el.classList].some(c=>c.startsWith('leeft-'))) return;
    let s=SOORT[Math.floor(Math.random()*SOORT.length)]; if(s==='draai'&&(el.classList.contains('plaatje')||Math.random()<.5)) s='drijf';
    el.classList.add('leeft-'+s); el.addEventListener('animationend',()=>el.classList.remove('leeft-'+s),{once:true}); }
  setInterval(stap,3200); })();
</script>
