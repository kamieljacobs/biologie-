*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 var(--tekst);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}

.wrap{max-width:1080px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--titel);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--meta);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
[hidden]{display:none!important}
.kunst{color:var(--c,var(--goud))}
.kunst .acc{color:var(--goud)}

/* Kopbalk (zoals index.html) */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px 28px;min-height:66px;flex-wrap:wrap;padding-block:8px}
.merk{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--titel);white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:8px;color:var(--text2);font-weight:600;font-size:15px}
.nav a:hover{color:var(--text)}
.nav a[aria-current]{color:var(--text);box-shadow:inset 0 -2px 0 var(--goud);border-radius:0}
.rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.icoon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.icoon:hover{color:var(--text)}

/* Paginakop */
.kop{border-bottom:1px solid var(--line)}
.kop .wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;align-items:center;padding-block:44px 40px}
.terug{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-weight:600;font-size:15px}
.terug:hover{color:var(--text)}
.kop .lbl{color:var(--goud-text);margin:26px 0 8px}
.kop h1{font-size:clamp(40px,5vw,60px);line-height:1.02}
.kop p{margin:12px 0 0;color:var(--text2);max-width:60ch}
.kop .groot{justify-self:end;width:220px;height:220px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center}
.kop .groot svg{width:150px;height:150px}

/* Uitleg en filters */
.hoe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:32px;border:1px solid var(--line2);border-radius:4px;background:var(--surface)}
.hoe div{padding:16px 18px;border-right:1px solid var(--line)}
.hoe div:last-child{border-right:0}
.hoe b{display:block;font-family:var(--titel);font-size:18px;margin:6px 0 2px}
.hoe span:not(.mono){color:var(--text2);font-size:15px;line-height:1.45;display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:34px 0 8px}
.filters .mono{color:var(--text3);margin-right:6px}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:600;font-size:14px;color:var(--text2)}

.teller{color:var(--text3);font-size:14px;margin-left:auto}

.kern h2{font-size:25px;margin:4px 0 6px}
.kern p{margin:0 0 12px;color:var(--text2)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags a,.tags span{font-size:14px;font-weight:600;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.tags a:hover{color:var(--text);border-color:var(--line2)}
.opbouw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px;border:1px solid var(--line2);border-radius:4px;background:var(--surface)}
.opbouw div{padding:16px 18px;border-right:1px solid var(--line)}
.opbouw div:last-child{border-right:0}
.opbouw b{display:block;font-family:var(--titel);font-size:18px;margin:6px 0 2px}
.opbouw span:not(.mono){color:var(--text2);font-size:15px;line-height:1.45;display:block}
.opbouw .mono{color:var(--goud-text)}

.cluster{margin-top:44px}
.cluster>h2{font-size:30px;display:flex;align-items:center;gap:12px}
.cluster>h2 .stip{width:12px;height:12px;border-radius:999px;background:var(--c)}
.cluster>p{margin:6px 0 0;color:var(--text2);max-width:70ch}
.raster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-top:16px}
.gb{scroll-margin-top:110px;border:1px solid var(--line2);border-radius:18px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gb header{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;padding:20px 22px 12px;background:radial-gradient(280px 130px at 100% 0,color-mix(in srgb,var(--c) 14%,transparent),transparent)}
.gb .embleem{width:72px;height:72px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.gb .embleem svg{width:54px;height:54px}
.gb .niv{color:var(--c)}
.gb h3{font-size:23px;line-height:1.1;margin:4px 0 0}
.gb .intro{margin:0;padding:0 22px 12px;color:var(--text2);font-size:16px}
.gb .basis{border-top:1px solid var(--line);padding:12px 22px 4px}
.gb .basis .mono{color:var(--text3);display:flex;justify-content:space-between;gap:8px}
.gb ol{list-style:none;margin:8px 0 0;padding:0}
.gb li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);color:var(--text2)}
.gb li:last-child{border-bottom:0}
.gb li .nr{font:600 12px/1.9 var(--meta);color:var(--text3)}
.komt{font:600 10.5px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);border:1px dashed var(--line2);border-radius:999px;padding:4px 8px;white-space:nowrap}
.gb .pta{border-top:1px dashed var(--line2);padding:12px 22px 8px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.gb .pta .mono{color:var(--text3);display:flex;justify-content:space-between;gap:8px}
.gb .pta ul{list-style:none;margin:8px 0 0;padding:0}

.gb .pta li:last-child{border-bottom:0}
.gb .pta li a{color:var(--text2);min-width:0}
.gb .pta li a:hover{color:var(--text)}
.gb .pta .play{font-size:10px;color:var(--c);margin-right:8px;vertical-align:1px}
.gb .pta .hf{font:600 10.5px/1 var(--meta);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap;flex:none}

.gb footer a{font-size:14px;font-weight:600;color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.gb footer a:hover{color:var(--text);border-color:var(--line2)}

footer.site{margin-top:56px;border-top:1px solid var(--line);color:var(--text3);font-size:14px}
footer.site .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;padding-block:26px 44px}
footer.site a:hover{color:var(--text)}

@media (max-width:900px){
  .kop .wrap{grid-template-columns:1fr;gap:20px;padding-block:28px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media (prefers-reduced-motion: no-preference){
svg.kunst.leeft-klop{animation:bk-klop 1.6s ease-in-out}

@keyframes bk-klop{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}45%{transform:scale(1.05)}60%{transform:scale(1)}}
@keyframes bk-wieg{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

function themaKnop(){
  const d=root.getAttribute('data-theme')!=='light', b=document.getElementById('thema');

function kaart(g){

}

}

(function(){ if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const SOORT=['klop','wieg','drijf','adem','klop','wieg','drijf','draai'];
  function zichtbaar(el){ const r=el.getBoundingClientRect(); return r.width>20&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth; }
  function stap(){ if(document.hidden) return; const svgs=[...document.querySelectorAll('svg.kunst:not(.fries)')].filter(zichtbaar); if(!svgs.length) return;
    const el=svgs[Math.floor(Math.random()*svgs.length)]; if([...el.classList].some(c=>c.startsWith('leeft-'))) return;
    let s=SOORT[Math.floor(Math.random()*SOORT.length)]; if(s==='draai'&&(el.classList.contains('plaatje')||Math.random()<.5)) s='drijf';
    el.classList.add('leeft-'+s); el.addEventListener('animationend',()=>el.classList.remove('leeft-'+s),{once:true}); }
  setInterval(stap,3200); })();
</script>
