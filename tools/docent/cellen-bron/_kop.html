<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<link rel="icon" href="../../../img/icoon/favicon.svg" type="image/svg+xml">

<title>Les 3 · Veranderen, regelen, lezen · DNA · Biologie bij Kamiel</title>
<meta name="description" content="Uitlegtool voor de docent, les 3 DNA: mutaties (UV-schade en herstel, substitutie, insertie, deletie, erfelijk of niet, kanker), genen aan en uit (transcriptiefactor, lac-operon, epigenetica), DNA-technieken (PCR, gelelektroforese, sequencen, genetische modificatie, CRISPR) en wat je aan DNA hebt. Korte animaties, stap voor stap. Havo en vwo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../../huisstijl.css">
<script src="../../huisstijl.js"></script>
<style>
<style>
/* Uitleg in stappen · DNA · les 3 · versie 1.0 · 28 oktober 2026
   Docententool: per scherm korte animaties die de docent stap voor stap afspeelt (klik, → of de presenter).
   Tekenruimte 1920x1080 op canvas; kleuren volgen licht/donker van de site. Inhoud en volgorde: zie SCHERMEN in het script. */
.tool-kop{padding-bottom:10px}
.tool-kop p a{color:var(--goud-text)}
.bediening{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:4px 0 14px}
.bediening .niv-label{font:600 12px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-right:6px}
.bediening .sp{flex:1}
.knop.stil[aria-pressed="true"]{background:var(--goud-soft);box-shadow:inset 0 0 0 1px var(--goud)}
#speler{display:flex;flex-direction:column;gap:10px}
.breed{width:min(100%, calc((100vh - 220px) * 16 / 9));min-width:min(100%,320px);margin-inline:auto}
#stage{position:relative;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;cursor:pointer}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px 16px;min-height:66px}
.cap .txt{font-size:21px;line-height:1.4;min-width:0}
.cap .txt b{color:var(--goud-text)}
.cap .vwo-tag{display:inline-block;font:600 11px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--paars);border:1px solid var(--paars);border-radius:999px;padding:4px 8px;margin-right:8px;vertical-align:3px}
.cap .notitie{grid-column:1/-1;font-size:15px;color:var(--text2);border-top:1px dashed var(--line2);padding-top:6px}
.cap .notitie:empty{display:none}
.cap .notitie::before{content:"Docent · ";font:600 11px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:180px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line2);display:block}
.dots i.done{background:var(--text3)}
.dots i.cur{background:var(--goud)}
.dots i.vwo{box-shadow:0 0 0 2px var(--paars)}
.knoppen{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.knoppen .teller{font:600 13px/1 var(--meta);letter-spacing:.06em;color:var(--text2);margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{background:none;color:var(--text2);border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:14px;min-height:34px}
.chip:hover{color:var(--text)}
.chip.cur{background:var(--goud);color:var(--goud-ink);border-color:var(--goud)}
.chip .n{font:600 12px var(--meta);margin-right:5px}
.chip.deel{border:0;padding-left:0;font:600 12px/1 var(--meta);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);cursor:default}
.hint{color:var(--text3);font-size:14px;margin-top:2px}
kbd{font:600 12px var(--meta);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.draai{display:none}
@media (max-width:640px){
  .draai{display:block;margin:0 0 10px;color:var(--text2)}
  .cap .txt{font-size:17px}
  .cap{grid-template-columns:1fr}
  .dots{justify-content:flex-start;max-width:none}
  .hint{display:none}
}
body.presenteer{overflow:hidden}
body.presenteer .wrap{max-width:none;padding:10px 16px}
body.presenteer .sitenav,body.presenteer .tool-kop,body.presenteer .bediening,body.presenteer .chips,body.presenteer .hint,body.presenteer .cap .notitie,body.presenteer details.docent,body.presenteer .tool-voet,body.presenteer .draai,body.presenteer footer{display:none!important}
body.presenteer .cap .txt{font-size:24px}
#stopPres{display:none}
body.presenteer #stopPres{display:inline-flex}
details.briefing{margin-top:18px}
details.briefing>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px}
details.briefing>summary::-webkit-details-marker{display:none}
details.briefing>summary h2{font-size:24px}
details.briefing>summary::after{content:"+";margin-left:auto;font:600 22px/1 var(--meta);color:var(--goud-text)}
details.briefing[open]>summary::after{content:"–"}
.briefing .intro{color:var(--text2);max-width:72ch}
.briefing details.onderwerp{border-top:1px solid var(--line2);padding:4px 0}
.briefing details.onderwerp>summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:18px}
.briefing details.onderwerp>div{max-width:76ch;padding-bottom:10px}
.briefing details.onderwerp p{margin:8px 0;line-height:1.55}
.briefing details.onderwerp ul,.briefing details.onderwerp ol{margin:6px 0 8px;padding-left:22px;line-height:1.5}
.briefing details.onderwerp p:last-child{font-size:14px;color:var(--text2)}
.briefing details.onderwerp a{color:var(--goud-text)}
.briefing details.onderwerp em{color:var(--text2)}
body.presenteer details.briefing{display:none!important}
details.docent{margin-top:28px}
details.docent>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px}
details.docent>summary::-webkit-details-marker{display:none}
details.docent>summary h2{font-size:24px}
details.docent>summary::after{content:"+";margin-left:auto;font:600 22px/1 var(--meta);color:var(--goud-text)}
details.docent[open]>summary::after{content:"–"}
.docent .kolommen{display:grid;gap:8px 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.docent .kolommen{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.docent h3{margin:16px 0 6px}
.docent p,.docent li{color:var(--text2)}
.docent ul,.docent ol{margin:4px 0;padding-left:20px}
.docent li{margin:3px 0}
.docent li b{color:var(--text)}
.tool-voet{margin:28px 0 40px;color:var(--text3);font-size:14px}
/* Groot scherm (Kamiel 26 okt 2026): het beeld vult het scherm; één regel tekst eronder (T = tekst uit, dan alleen beeld);
   knoppen zweven onderaan en verschijnen alleen als je de muis beweegt. Werkt ook zonder echte volledig-scherm-API (iPad). */
body.presenteer{--capH:72px}
body.presenteer.zondertekst{--capH:0px}
body.presenteer .wrap{max-width:none;padding:0}
body.presenteer #speler{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
body.presenteer .breed{width:min(100vw, calc((100vh - var(--capH)) * 16 / 9))}
body.presenteer #stage{border:0;border-radius:0}
body.presenteer .cap{border:0;border-radius:0;background:transparent;min-height:0;height:var(--capH);padding:6px 18px;overflow:hidden}
body.presenteer .cap .txt{font-size:clamp(18px, 2.4vh, 28px)}
body.presenteer.zondertekst .cap{display:none}
body.presenteer .knoppen{position:fixed;right:14px;top:14px;max-width:calc(100vw - 28px);width:auto;z-index:60;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:6px 10px;box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
body.presenteer.muis .knoppen{opacity:1;pointer-events:auto}
body.presenteer.muisweg,body.presenteer.muisweg #stage{cursor:none}
body.presenteer .knoppen .teller{margin-left:6px}
#tekstBtn{display:none}
body.presenteer #tekstBtn{display:inline-flex}
body.presenteer .bkfb-zweef,body.presenteer .bkfb-kop{display:none!important}
.grootknop{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--text2);font:600 13px/1 var(--meta);letter-spacing:.04em;opacity:.55;cursor:pointer;transition:opacity .15s}
.grootknop:hover,.grootknop:focus-visible{opacity:1;color:var(--text);border-color:var(--goud)}
.grootknop svg{width:16px;height:16px}
body.presenteer .grootknop{display:none}
</style>
</style>
