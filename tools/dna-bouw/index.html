<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: één vast "stage" (16:9 tekening) met daaronder een stapbalk; docent klikt door, elke klik legt een laag bij. */
:root{
  --bg:#0d1829; --panel:#132236; --panel2:#1a2d46; --line:#2b4262;
  --fg:#e9eff8; --muted:#93a6c2; --accent:#3fd0b6; --warm:#f2b84b;
  --fos:#f08a3c; --suiker:#8fb8e8; --A:#ee6f8d; --T:#f3cf5c; --G:#6fd39a; --C:#a78bfa; --U:#f6a35c;
  --font-display:"Fraunces",Georgia,serif; --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px;gap:10px;min-height:100%}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.01em}
header .scr{color:var(--muted);font-size:.95rem}
header .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#06211c}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--warm);color:#2a1d03;border-color:var(--warm)}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
#stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;aspect-ratio:16/9;max-height:calc(100vh - 215px);margin-inline:auto;width:100%;max-width:calc((100vh - 215px) * 16 / 9)}
#stage svg,#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#stage svg{font-family:var(--font-body)}
#stage .badge{position:absolute;top:12px;right:14px;background:var(--warm);color:#2a1d03;font-weight:700;font-size:.8rem;padding:3px 9px;border-radius:6px;letter-spacing:.04em}
#stage .trap{display:none}
#stage.nolabels .lbl{opacity:0 !important}
.cap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:78px}
.cap .txt{font-size:1.12rem;min-width:0}
.cap .txt b{color:var(--accent)}
.cap .vraag{display:block;margin-top:4px;color:var(--warm);font-size:.95rem}
.cap .vraag::before{content:"Wat denk je? ";font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--accent)}
.dots i.cur{background:var(--warm)}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav .chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.cur{background:var(--panel2);color:var(--fg);border-color:var(--accent)}
.chip.vwo{border-style:dashed}
.chip[disabled]{opacity:.35;cursor:default}
nav .hint{color:var(--muted);font-size:.8rem;width:100%}
kbd{font-family:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.78rem}
/* svg helpers */
.fs{font-size:17px;fill:var(--fg)}
.fm{font-size:14px;fill:var(--muted)}
.fb{font-weight:700}
.step{transition:opacity .45s ease}
.step.off{opacity:0}
@media (prefers-reduced-motion:reduce){.step{transition:none}}
@media (max-width:640px){
  header h1{font-size:1.1rem}
  .cap{grid-template-columns:1fr}
  .cap .txt{font-size:1rem}
  #stage{max-height:none;max-width:none}
}
.sitenav{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.sitenav a{color:var(--muted);text-decoration:none}.sitenav a:hover{color:var(--accent)}
</style>

<nav class="sitenav"><a href="../../index.html#home">Biologie bij Kamiel</a><span style="opacity:.4">·</span><a href="../../index.html#dna">← Terug naar DNA</a></nav>
<header>
  <h1>De bouw van DNA</h1>
  <span class="scr" id="scrname"></span>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="Niveau">
    <button id="lvHavo" aria-pressed="false">havo</button>
    <button id="lvVwo" aria-pressed="true">vwo</button>

<main>
  <div id="stage">
    <div class="trap" id="trap"></div>
    <div class="badge" id="badge" hidden>vwo</div>
  </div>
  <div class="cap">
    <div class="txt" id="captxt"></div>
    <div class="dots" id="dots"></div>
  </div>
</main>

<nav>
  <button class="btn" id="prevScr" title="Vorig scherm (↑)">◀◀</button>
  <button class="btn" id="prevStep" title="Vorige stap (←)">◀</button>
  <button class="btn" id="nextStep" title="Volgende stap (→ of spatie)">Volgende ▶</button>
  <button class="btn" id="nextScr" title="Volgend scherm (↓)">▶▶</button>
  <div class="chips" id="chips"></div>
  <div class="hint"><kbd>→</kbd> / <kbd>spatie</kbd> volgende stap · <kbd>←</kbd> terug · <kbd>↑</kbd><kbd>↓</kbd> scherm · <kbd>L</kbd> labels · <kbd>1</kbd>–<kbd>9</kbd> scherm</div>
</nav>

<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage');
const W=960,H=540;
const esc=s=>s;

/* ---------- kleuren/vormen ---------- */
const COL={fos:'#f08a3c',suiker:'#8fb8e8',A:'#ee6f8d',T:'#f3cf5c',G:'#6fd39a',C:'#a78bfa',U:'#f6a35c',fg:'#e9eff8',mu:'#93a6c2',acc:'#3fd0b6',warm:'#f2b84b',line:'#2b4262',dim:'#4b6383'};
const BASENAAM={A:'adenine',T:'thymine',G:'guanine',C:'cytosine',U:'uracil'};
const PAIR={A:'T',T:'A',G:'C',C:'G'};

function pent(cx,cy,r,sx,sy){ // hoekpunten: O(top), C1'(rechts), C2', C3', C4'
  const ang=[-90,-18,54,126,198];
  return ang.map(a=>{const t=a*Math.PI/180;return [cx+sx*r*Math.cos(t),cy+sy*r*Math.sin(t)];});
}
/* Een nucleotide, verticaal, 5' boven (sy=1) of gespiegeld (sx=-1, sy=-1 voor antiparallel). step = data-step index */
function nuc(cx,cy,base,o={}){
  const sx=o.sx||1, sy=o.sy||1, r=o.r||22, step=o.step!=null?` data-step="${o.step}"`:'';
  if(sy<0) cy-=2*0.309*r; // base-rij op dezelfde hoogte als een niet-gespiegelde nucleotide
  const P=pent(cx,cy,r,sx,sy);
  const [O,C1,C2,C3,C4]=P;
  const C5=[C4[0]-sx*18,C4[1]-sy*22];
  const F=[C5[0]-sx*8,C5[1]-sy*22];
  const bx=C1[0]+sx*8, by=C1[1];
  const bw=o.bw||66, bh=22;
  const rectx=sx>0?bx:bx-bw;
  const fill=o.basefill||COL[base]||COL.dim;
  const lab=o.labels!==false;
  const num=o.num;
  let s=`<g class="nuc"${step}>`;
  s+=`<polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="${COL.suiker}" fill-opacity=".18" stroke="${COL.suiker}" stroke-width="2.2"/>`;
  if(o.stub!==false) s+=`<line x1="${C4[0]}" y1="${C4[1]}" x2="${C5[0]}" y2="${C5[1]}" stroke="${COL.suiker}" stroke-width="2.2"/>`;
  if(o.fos!==false){
    s+=`<line x1="${C5[0]}" y1="${C5[1]}" x2="${F[0]}" y2="${F[1]}" stroke="${COL.fos}" stroke-width="2.2"/>`;
    s+=`<circle cx="${F[0]}" cy="${F[1]}" r="11" fill="${COL.fos}"/>`;
    s+=`<text x="${F[0]}" y="${F[1]+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#2a1403">P</text>`;
  }
  if(o.base!==false){
    s+=`<line x1="${C1[0]}" y1="${C1[1]}" x2="${bx}" y2="${by}" stroke="${fill}" stroke-width="2.2"/>`;
    s+=`<rect x="${rectx}" y="${by-bh/2}" width="${bw}" height="${bh}" rx="5" fill="${fill}"/>`;
    s+=`<text x="${rectx+bw/2}" y="${by+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#101827">${base}</text>`;
  }
  if(o.oh){
    const ox=C3[0]-sx*6, oy=C3[1]+sy*20;
    s+=`<line x1="${C3[0]}" y1="${C3[1]}" x2="${ox}" y2="${oy}" stroke="${COL.acc}" stroke-width="2.2"/>`;
    s+=`<text class="lbl" x="${ox}" y="${oy+(sy>0?16:-8)}" text-anchor="middle" font-size="13" font-weight="700" fill="${COL.acc}">OH</text>`;
  }
  if(o.link){ // brug 3'-O-P naar de buurnucleotide
    const Pn=[cx-sx*47+sx*9, cy+sy*((o.d||80)-50.8)-sy*5], mx=(C3[0]+Pn[0])/2+sx*3, my=(C3[1]+Pn[1])/2+sy*2;
    s+=`<g${o.linkStep!=null?` data-step="${o.linkStep}"`:''}><line x1="${C3[0]}" y1="${C3[1]}" x2="${Pn[0]}" y2="${Pn[1]}" stroke="${COL.acc}" stroke-width="2.2"/><circle cx="${mx}" cy="${my}" r="7" fill="${COL.acc}"/><text x="${mx}" y="${my+3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="#06211c">O</text></g>`;
  }
  if(num){ // nummering C-atomen
    const fs=r>40?16:11, k=r>40?1.6:1;
    const lab2=(p,t,dx,dy)=>`<text class="lbl" x="${p[0]+dx*k}" y="${p[1]+dy*k}" font-size="${fs}" fill="${COL.fg}" text-anchor="middle">${t}</text>`;
    s+=`<g${num.step!=null?` data-step="${num.step}"`:''}>`;
    s+=lab2(O,'O',0,sy>0?-6:12);
    s+=lab2(C1,"1'",sx*12,sy>0?4:4);
    s+=lab2(C2,"2'",sx*8,sy>0?14:-6);
    s+=lab2(C3,"3'",-sx*8,sy>0?14:-6);
    s+=lab2(C4,"4'",-sx*12,sy>0?2:6);
    s+=lab2(C5,"5'",-sx*12,sy>0?-2:10);
    s+='</g>';
  }
  s+='</g>';
  return s;
}
const T=(x,y,t,cls='fs',extra='')=>{const m=extra.match(/fill="([^"]+)"/);return `<text class="lbl ${cls}" x="${x}" y="${y}" ${extra}${m?` style="fill:${m[1]}"`:''}>${t}</text>`;};
const arrow=(x1,y1,x2,y2,c=COL.acc,w=2.5)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" marker-end="url(#ah)"/>`;
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
<marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${COL.warm}"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${COL.acc}"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${COL.A}"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${COL.mu}"/></marker></defs>`;
const svgWrap=inner=>`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${DEFS}${inner}</svg>`;

/* ---------- schermen ---------- */
const TRAP=['cel','celkern','chromosoom','DNA','nucleotide'];
const screens=[];

/* 0 Titel */
screens.push({
  naam:'Start', trap:null,
  svg:()=>svgWrap(`
    <text x="480" y="225" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="58" font-weight="600" fill="${COL.fg}">De bouw van DNA</text>
    <text x="480" y="270" text-anchor="middle" font-size="22" fill="${COL.mu}">van nucleotide tot gen</text>
    <g data-step="1">
      ${nuc(330,380,'A',{num:{}, oh:true})}
      ${nuc(630,380,'T',{sx:-1,sy:-1,oh:true})}
      <line x1="404" y1="380" x2="556" y2="380" stroke="${COL.fg}" stroke-dasharray="4 5" stroke-width="2"/>
    </g>
    <text data-step="0" x="480" y="490" text-anchor="middle" font-size="16" fill="${COL.mu}">Klik of druk op → om door te gaan</text>
  `),
  steps:[
    {t:'Eerste les DNA. Klik op <b>Volgende</b> (of druk op →) om telkens een laag toe te voegen.'},
    {t:'Aan het eind van deze les kun je dit plaatje uitleggen: twee bouwstenen, aan elkaar gekoppeld, tegenover elkaar. Nu nog niet, dat is de bedoeling.'}
  ]
});

/* 1 Inzoomen */
screens.push({
  naam:'Inzoomen', trap:0,
  svg:()=>{
    const cx=[110,300,490,680,870], y=250;
    let s='';
    // cel
    s+=`<g data-step="0"><ellipse cx="${cx[0]}" cy="${y}" rx="78" ry="62" fill="#1d3a5a" stroke="${COL.suiker}" stroke-width="2"/><circle cx="${cx[0]+10}" cy="${y-5}" r="26" fill="#2a4f78" stroke="${COL.suiker}"/><circle cx="${cx[0]-35}" cy="${y+25}" r="7" fill="#2a4f78"/><circle cx="${cx[0]+45}" cy="${y+30}" r="5" fill="#2a4f78"/>${T(cx[0],y+95,'cel','fs fb','text-anchor="middle"')}${T(cx[0],y+116,'± 20 µm','fm','text-anchor="middle"')}</g>`;
    // kern
    s+=`<g data-step="1">${arrow(cx[0]+85,y,cx[1]-75,y,COL.mu)}<circle cx="${cx[1]}" cy="${y}" r="62" fill="#2a4f78" stroke="${COL.suiker}" stroke-width="2"/>`;
    for(let i=0;i<7;i++){const a=i*0.9,r=25+ (i%3)*9;s+=`<path d="M${cx[1]+r*Math.cos(a)} ${y+r*Math.sin(a)} q 12 -10 22 4 t 18 8" fill="none" stroke="${COL.acc}" stroke-width="3" stroke-linecap="round"/>`;}
    s+=`${T(cx[1],y+95,'celkern','fs fb','text-anchor="middle"')}${T(cx[1],y+116,'46 chromosomen','fm','text-anchor="middle"')}</g>`;
    // chromosoom
    s+=`<g data-step="2">${arrow(cx[1]+70,y,cx[2]-60,y,COL.mu)}<path d="M${cx[2]-28} ${y-62} q ${28} 40 ${28} 62 q 0 22 -28 62 M${cx[2]+28} ${y-62} q -28 40 -28 62 q 0 22 28 62" fill="none" stroke="${COL.acc}" stroke-width="18" stroke-linecap="round"/><circle cx="${cx[2]}" cy="${y}" r="9" fill="${COL.warm}"/>${T(cx[2],y+95,'chromosoom','fs fb','text-anchor="middle"')}${T(cx[2],y+116,'één lang DNA-molecuul','fm','text-anchor="middle"')}</g>`;
    // DNA
    s+=`<g data-step="3">${arrow(cx[2]+45,y,cx[3]-60,y,COL.mu)}`;
    for(let i=0;i<9;i++){const yy=y-60+i*15;const ph=i*0.7;const x1=cx[3]+30*Math.sin(ph),x2=cx[3]+30*Math.sin(ph+Math.PI);s+=`<line x1="${x1}" y1="${yy}" x2="${x2}" y2="${yy}" stroke="${COL.fg}" stroke-width="3" stroke-opacity=".8"/>`;}
    s+=`<path d="M${cx[3]} ${y-70} ${Array.from({length:19},(_,i)=>`L${cx[3]+30*Math.sin(i*0.35)} ${y-70+i*7.8}`).join(' ')}" fill="none" stroke="${COL.fos}" stroke-width="5"/><path d="M${cx[3]} ${y-70} ${Array.from({length:19},(_,i)=>`L${cx[3]+30*Math.sin(i*0.35+Math.PI)} ${y-70+i*7.8}`).join(' ')}" fill="none" stroke="${COL.suiker}" stroke-width="5"/>`;
    s+=`${T(cx[3],y+95,'DNA','fs fb','text-anchor="middle"')}${T(cx[3],y+116,'2 nm breed','fm','text-anchor="middle"')}</g>`;
    // nucleotide
    s+=`<g data-step="4">${arrow(cx[3]+45,y,cx[4]-80,y,COL.mu)}${nuc(cx[4],y+5,'A',{oh:true})}${T(cx[4],y+95,'nucleotide','fs fb','text-anchor="middle"')}${T(cx[4],y+116,'de bouwsteen','fm','text-anchor="middle"')}</g>`;
    s+=`<g data-step="5"><rect x="60" y="400" width="840" height="56" rx="10" fill="${COL.line}" fill-opacity=".35"/>${T(480,435,'chromosoom = opgerold DNA · DNA = keten van nucleotiden · gen = een stúk DNA (komt zo)','fs','text-anchor="middle"')}</g>`;
    return svgWrap(s);
  },
  steps:[
    {t:'We beginnen groot. Een <b>cel</b>: ongeveer 20 micrometer, net niet met het blote oog te zien.', v:'waar in de cel zit het DNA?'},
    {t:'In de <b>celkern</b>. Daar liggen bij de mens 46 chromosomen.', v:'wat is eigenlijk een chromosoom?'},
    {t:'Een <b>chromosoom</b> is één heel lang DNA-molecuul, strak opgerold rond eiwitten. Zo ziet hij er alleen uit vlak voor een celdeling.'},
    {t:'Rol je hem uit, dan heb je het <b>DNA</b>: een gedraaide ladder van 2 nanometer breed. Al het DNA van één cel achter elkaar is ongeveer 2 meter lang.', v:'waar is zo\'n ladder van gemaakt?'},
    {t:'Van <b>nucleotiden</b>. Dat is de bouwsteen waar het de rest van deze les om draait.'},
    {t:'Onthoud de trap: cel → kern → chromosoom → DNA → nucleotide. Linksboven zie je steeds op welke trede we staan.'}
  ]
});

/* 2 Nucleotide */
screens.push({
  naam:'De nucleotide', trap:4,
  svg:()=>{
    const cx=330,cy=270;
    let s='';
    s+=`<g data-step="0">${nuc(cx,cy,'',{fos:false,base:false,stub:false,r:60,num:{step:1}})}</g>`;
    s+=`<g data-step="0">${T(cx,cy+14,'suiker','fs fb','text-anchor="middle"')}${T(cx+60,cy+95,'(desoxyribose)','fm','text-anchor="middle"')}</g>`;
    // fosfaat groot
    const P=pent(cx,cy,60,1,1); const C4=P[4]; const C5=[C4[0]-18,C4[1]-40]; const F=[C5[0]-14,C5[1]-50];
    s+=`<g data-step="0"><line x1="${C4[0]}" y1="${C4[1]}" x2="${C5[0]}" y2="${C5[1]}" stroke="${COL.suiker}" stroke-width="2.2"/></g>`;
    s+=`<g data-step="2"><line x1="${C5[0]}" y1="${C5[1]}" x2="${F[0]}" y2="${F[1]}" stroke="${COL.fos}" stroke-width="2.5"/><circle cx="${F[0]}" cy="${F[1]}" r="26" fill="${COL.fos}"/><text x="${F[0]}" y="${F[1]+7}" text-anchor="middle" font-size="22" font-weight="700" fill="#2a1403">P</text>${T(F[0]-40,F[1]+8,'fosfaatgroep','fs fb','text-anchor="end"')}${T(F[0]-40,F[1]+28,"zit aan koolstof 5'",'fm','text-anchor="end"')}</g>`;
    // base
    const C1=P[1];
    s+=`<g data-step="3"><line x1="${C1[0]}" y1="${C1[1]}" x2="${C1[0]+30}" y2="${C1[1]}" stroke="${COL.A}" stroke-width="2.5"/><rect x="${C1[0]+30}" y="${C1[1]-30}" width="150" height="60" rx="10" fill="${COL.A}"/><text x="${C1[0]+105}" y="${C1[1]+8}" text-anchor="middle" font-size="22" font-weight="700" fill="#101827">base</text>${T(C1[0]+105,C1[1]+58,"zit aan koolstof 1'",'fm','text-anchor="middle"')}</g>`;
    // OH
    const C3=P[3];
    s+=`<g data-step="4"><line x1="${C3[0]}" y1="${C3[1]}" x2="${C3[0]-16}" y2="${C3[1]+42}" stroke="${COL.acc}" stroke-width="2.5"/><text x="${C3[0]-16}" y="${C3[1]+68}" text-anchor="middle" font-size="22" font-weight="700" fill="${COL.acc}">OH</text>${T(C3[0]-40,C3[1]+95,"vrije OH-groep aan koolstof 3'",'fm','text-anchor="middle"')}</g>`;
    // vier basen rechts
    const bx=620, by=120;
    s+=`<g data-step="3">${T(bx,by-30,'vier mogelijke basen','fs fb')}`;

/* ---------- helix canvas ---------- */
let helixRAF=null, helixState={twist:0,target:0,t:0};
function helixStart(step){
  const old=stage.querySelector('canvas'); if(old) old.remove();
  const c=document.createElement('canvas'); stage.insertBefore(c,stage.querySelector('svg'));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  helixState.target=step>=1?1:0; if(reduce) helixState.twist=helixState.target;
  function draw(){
    const r=stage.getBoundingClientRect(); c.width=r.width*devicePixelRatio; c.height=r.height*devicePixelRatio;
    const ctx=c.getContext('2d'); ctx.setTransform(c.width/W,0,0,c.height/H,0,0); ctx.clearRect(0,0,W,H);
    helixState.twist+= (helixState.target-helixState.twist)*0.04;
    if(!reduce) helixState.t+=0.015;
    const tw=helixState.twist, cx=330, top=85, bot=500, amp=70, n=28;
    const pts1=[],pts2=[];
    for(let i=0;i<=n;i++){const y=top+(bot-top)*i/n; const ph=i/n*Math.PI*4+helixState.t; const off=Math.sin(ph)*amp*tw; const z1=Math.cos(ph)*tw; pts1.push([cx+(tw<0.01?-amp*0.6:0)-amp*0.6*(1-tw)+off*1, y, z1]); pts2.push([cx+amp*0.6*(1-tw)-off, y, -z1]);}
    // rungs
    for(let i=0;i<=n;i+=2){const a=pts1[i],b=pts2[i];const depth=(a[2]+1)/2;ctx.strokeStyle=`rgba(233,239,248,${0.35+0.45*(tw<0.5?0.8:depth)})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
      // basenpaar kleur midden
      const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const cols=[[COL.A,COL.T],[COL.G,COL.C],[COL.T,COL.A],[COL.C,COL.G]][(i/2)%4];
      ctx.strokeStyle=cols[0];ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(m[0],m[1]);ctx.stroke();
      ctx.strokeStyle=cols[1];ctx.beginPath();ctx.moveTo(m[0],m[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    const strand=(pts,col)=>{ctx.lineWidth=9;for(let i=0;i<pts.length-1;i++){const depth=(pts[i][2]+1)/2;ctx.strokeStyle=col;ctx.globalAlpha=0.45+0.55*(tw<0.5?1:depth);ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[i+1][0],pts[i+1][1]);ctx.stroke();}ctx.globalAlpha=1;};
    strand(pts1,COL.fos); strand(pts2,COL.suiker);
    if(!reduce || Math.abs(helixState.target-helixState.twist)>0.01) helixRAF=requestAnimationFrame(draw);
  }
  if(helixRAF) cancelAnimationFrame(helixRAF);
  draw();
}
function helixStop(){ if(helixRAF) cancelAnimationFrame(helixRAF); helixRAF=null; const c=stage.querySelector('canvas'); if(c) c.remove(); }

function visibleScreens(){ return screens.map((s,i)=>i).filter(i=>vwo||!screens[i].vwo); }
function stepsOf(i){ return screens[i].steps.filter(s=>vwo||!s.vwo); }

  const S=screens[scr];
  helixStop();
  const old=stage.querySelector('svg'); if(old) old.remove();
  stage.insertAdjacentHTML('beforeend',S.svg());
  $('#badge').hidden=!S.vwo;
  $('#scrname').textContent=`${visibleScreens().indexOf(scr)+1} / ${visibleScreens().length} · ${S.naam}`;
  if(S.trap!=null){ let x=28, g='<g class="trapg">'; TRAP.forEach((t,i)=>{const w=t.length*7.6+14; const on=S.trap===i;
      if(on) g+=`<rect x="${x-7}" y="16" width="${w}" height="24" rx="5" fill="none" stroke="${COL.acc}" stroke-width="1.5"/>`;
      g+=`<text x="${x}" y="33" font-size="14" fill="${on?COL.acc:COL.mu}" letter-spacing=".3">${t}</text>`; x+=w+6;
      if(i<TRAP.length-1){g+=`<text x="${x}" y="33" font-size="14" fill="${COL.mu}">›</text>`; x+=16;} });
    stage.querySelector('svg').insertAdjacentHTML('beforeend',g+'</g>'); }
  // chips
  $('#chips').innerHTML=screens.map((s,i)=>`<button class="chip ${i===scr?'cur':''} ${s.vwo?'vwo':''}" data-i="${i}" ${(!vwo&&s.vwo)?'disabled':''}>${i}. ${s.naam}</button>`).join('');
  renderStep();
}
function renderStep(){
  const S=screens[scr]; const st=stepsOf(scr);
  // map visible step index -> raw step index (data-step values refer to raw indices)
  const raw=S.steps.indexOf(st[step]);
  stage.querySelectorAll('[data-step],[data-vwo]').forEach(el=>{
    if(el.dataset.step==null){el.classList.add('step');el.classList.toggle('off',!vwo);return;}
    const from=+el.dataset.step, until=el.dataset.until!=null?+el.dataset.until:Infinity;
    const on=raw>=from && raw<until && (vwo||el.dataset.vwo==null);
    el.classList.add('step'); el.classList.toggle('off',!on);
  });
  const cur=st[step];
  const next=st[step+1];
  $('#captxt').innerHTML=cur.t+(next&&next.v?`<span class="vraag">${next.v}</span>`:'');
  $('#dots').innerHTML=st.map((s,i)=>`<i class="${i<step?'done':i===step?'cur':''}"></i>`).join('');
  if(S.canvas) helixStart(raw);
  if(S.onStep) S.onStep(raw);
  $('#nextStep').textContent= step<st.length-1?'Volgende ▶':(visibleScreens().indexOf(scr)<visibleScreens().length-1?'Volgend scherm ▶':'Einde');
}
function go(i,s=0){ scr=i; step=s; renderScreen(); }
function nextStep(){ const st=stepsOf(scr); if(step<st.length-1){step++;renderStep();} else nextScr(); }
function prevStep(){ if(step>0){step--;renderStep();} else { const vs=visibleScreens(); const k=vs.indexOf(scr); if(k>0){ go(vs[k-1], stepsOf(vs[k-1]).length-1); } } }
function nextScr(){ const vs=visibleScreens(); const k=vs.indexOf(scr); if(k<vs.length-1) go(vs[k+1]); }
function prevScr(){ const vs=visibleScreens(); const k=vs.indexOf(scr); if(k>0) go(vs[k-1]); }

$('#nextStep').onclick=nextStep; $('#prevStep').onclick=prevStep; $('#nextScr').onclick=nextScr; $('#prevScr').onclick=prevScr;
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(b&&!b.disabled) go(+b.dataset.i);});
stage.addEventListener('click',nextStep);
function setLevel(v){ vwo=v; $('#lvVwo').setAttribute('aria-pressed',v); $('#lvHavo').setAttribute('aria-pressed',!v); try{localStorage.setItem('dna-niveau',v?'vwo':'havo');}catch(e){} if(!vwo&&screens[scr].vwo) scr=visibleScreens()[0]; step=Math.min(step,stepsOf(scr).length-1); renderScreen(); }
$('#lvHavo').onclick=()=>setLevel(false); $('#lvVwo').onclick=()=>setLevel(true);
function toggleLabels(){ nolabels=!nolabels; stage.classList.toggle('nolabels',nolabels); $('#lblBtn').setAttribute('aria-pressed',nolabels); $('#lblBtn').textContent=nolabels?'Labels tonen':'Labels verbergen'; }
$('#lblBtn').onclick=toggleLabels;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();nextStep();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prevStep();}
  else if(e.key==='ArrowDown'){e.preventDefault();nextScr();}
  else if(e.key==='ArrowUp'){e.preventDefault();prevScr();}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(screens.length-1);}
  else if(e.key.toLowerCase()==='l'){toggleLabels();}
  else if(/^[0-9]$/.test(e.key)){const i=+e.key; if(i<screens.length&&(vwo||!screens[i].vwo)) go(i);}
});
setLevel(vwo);
addEventListener('resize',()=>{ if(screens[scr].canvas) helixStart(screens[scr].steps.indexOf(stepsOf(scr)[step])); });
})();
</script>
