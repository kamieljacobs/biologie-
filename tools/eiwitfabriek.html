<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Eiwitfabriek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1; --panel:#F8FAFB; --panel-2:#EEF2F6; --ink:#14243A; --muted:#55667A; --line:#C8D2DC;
  --accent:#3346B5; --accent-ink:#FFFFFF; --me:#DCE3F8;
  --hint:#8A5200; --hint-bg:#FFF3D9; --hint-line:#E3B04B;
  --ok:#1D7148; --ok-bg:#E1F2E8; --ok-line:#5FB487;
  --exp-bg:#EAEDFB; --exp-line:#8E9BE0;
  --A:#E6A700; --A-ink:#23190A; --T:#D23F55; --U:#8757EE; --C:#1B9A64; --G:#2D69D2; --tile-ink:#FFFFFF;
  --mark:#14243A;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --tw:1.6rem; --th:1.9rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --panel:#16202E; --panel-2:#1C2838; --ink:#E6ECF3; --muted:#9AAABB; --line:#2E3B4D;
    --accent:#8E9DFF; --accent-ink:#0E1622; --me:#27335A;
    --hint:#F3C56B; --hint-bg:#3A2D12; --hint-line:#8A6A24;
    --ok:#7FD6A5; --ok-bg:#15352A; --ok-line:#2F7A55;
    --exp-bg:#1F2748; --exp-line:#4A58A8;
    --A:#E9B31C; --T:#E5586C; --U:#9C74F5; --C:#2BB077; --G:#4D86E6;
    --mark:#E6ECF3;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --panel:#16202E; --panel-2:#1C2838; --ink:#E6ECF3; --muted:#9AAABB; --line:#2E3B4D;
  --accent:#8E9DFF; --accent-ink:#0E1622; --me:#27335A;
  --hint:#F3C56B; --hint-bg:#3A2D12; --hint-line:#8A6A24;
  --ok:#7FD6A5; --ok-bg:#15352A; --ok-line:#2F7A55;
  --exp-bg:#1F2748; --exp-line:#4A58A8;
  --A:#E9B31C; --T:#E5586C; --U:#9C74F5; --C:#2BB077; --G:#4D86E6;
  --mark:#E6ECF3;
}
*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:1.0625rem; line-height:1.5}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ---------- header ---------- */
.top{max-width:1320px; margin:0 auto; padding:1.1rem 1.25rem .6rem; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1.5rem}
.brand{display:flex; align-items:baseline; gap:.75rem; flex-wrap:wrap}
.brand h1{margin:0; font-size:1.55rem; line-height:1.1; letter-spacing:-.01em}
.role{font-size:.95rem; color:var(--muted)}
.role b{color:var(--ink)}
.phases{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:.3rem; margin-left:auto}
.phases li{font-size:.85rem; border-radius:999px; color:var(--muted)}
.phases li .n{font-family:var(--mono); margin-right:.25rem}
.phases li.done{color:var(--ink)}
.phases li[aria-current="step"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
.restart{background:none; border:1px solid var(--line); border-radius:8px; padding:.25rem .7rem; font-size:.85rem; color:var(--muted); cursor:pointer}
.restart:hover{color:var(--ink); border-color:var(--muted)}

/* ---------- layout ---------- */
.layout{max-width:1320px; margin:0 auto; padding:0 1.25rem 2rem; display:grid; gap:1.25rem}
.bench{order:-1}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,.92fr) minmax(0,1.12fr); align-items:start}
  .bench{order:0; position:sticky; top:calc(env(safe-area-inset-top,0px) + 1rem); max-height:calc(100vh - 2rem); overflow:auto}
}

/* ---------- dialogue ---------- */
.dialog{display:flex; flex-direction:column; min-width:0}
#log{display:flex; flex-direction:column; gap:.7rem; padding-bottom:1rem}
.msg{max-width:62ch; padding:.75rem 1rem; border-radius:12px; background:var(--panel); border:1px solid var(--line)}
.msg p{margin:0 0 .45rem} .msg p:last-child{margin-bottom:0}
.msg ul{margin:.3rem 0 0; padding-left:1.2rem}
.msg.me{align-self:flex-end; background:var(--me); border-color:transparent; font-family:var(--sans); white-space:pre-wrap; word-break:break-word}
.msg.hint{background:var(--hint-bg); border-color:var(--hint-line)}
.msg.ok{background:var(--ok-bg); border-color:var(--ok-line)}
.msg.explain{background:var(--exp-bg); border-color:var(--exp-line)}
.msg .who{display:block; font-size:.8rem; color:var(--muted); margin-bottom:.15rem}
.msg.hint .who{color:var(--hint)} .msg.ok .who{color:var(--ok)}
@media (prefers-reduced-motion: no-preference){ .msg{animation:pop .22s ease-out} @keyframes pop{from{opacity:0; transform:translateY(4px)}} }
.model{margin-top:.55rem; padding:.55rem .75rem; border-left:3px solid var(--accent); background:var(--panel-2); border-radius:0 8px 8px 0}
.model-h{display:block; font-weight:700; font-size:.9rem; margin-bottom:.15rem}
.seq{font-family:var(--mono); font-weight:600; white-space:nowrap; letter-spacing:.02em}
.seq.wrap{white-space:normal; word-break:break-all}
.c-A{color:var(--A)} .c-T{color:var(--T)} .c-U{color:var(--U)} .c-C{color:var(--C)} .c-G{color:var(--G)}
:root:not([data-theme="dark"]) .c-A{color:#A67700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .c-A{color:var(--A)} }

/* ---------- input area ---------- */
#input{position:sticky; bottom:0; padding:.8rem 0 calc(.8rem + env(safe-area-inset-bottom,0px)); background:linear-gradient(to bottom, transparent, var(--bg) .8rem)}
.w{background:var(--panel); border:2px solid var(--accent); border-radius:14px; padding:.8rem .9rem; display:flex; flex-direction:column; gap:.55rem}
.wl{font-size:.9rem; color:var(--muted); font-weight:700}
.seqrow{display:flex; align-items:center; gap:.4rem}
.seqrow .endl{font-family:var(--mono); color:var(--muted); font-weight:600}
.seqin, .protin, .w textarea, .numin{flex:1; min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:.5rem .65rem}
.seqin{font-family:var(--mono); font-weight:600; text-transform:uppercase; letter-spacing:.06em}
.w textarea{resize:vertical; min-height:4.2rem; width:100%}
.numin{max-width:6rem; flex:none}
.btnrow{display:flex; gap:.5rem; flex-wrap:wrap; justify-content:flex-end}
.btn{border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; border-radius:8px; padding:.5rem 1rem; cursor:pointer; white-space:nowrap}
.btn:disabled,.opt:disabled{opacity:.5; cursor:default}
.opts{display:flex; flex-direction:column; gap:.45rem}
.opt{text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:.55rem .8rem; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.pairs{display:flex; flex-wrap:wrap; gap:.6rem 1.2rem}
.pair{display:flex; align-items:center; gap:.4rem; font-family:var(--mono); font-weight:600}
.pair input{width:2.6rem; text-align:center; font-family:var(--mono); font-weight:600; text-transform:uppercase; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:.4rem 0}
.pair .arrow{color:var(--muted)}
.lbl{display:flex; flex-direction:column; gap:.3rem; font-size:.9rem; font-weight:700; color:var(--muted)}
.lbl.inline{flex-direction:row; align-items:center; gap:.6rem}
.jump{align-self:flex-start; background:none; border:none; color:var(--accent); text-decoration:underline; padding:0; cursor:pointer}
@media (min-width:1000px){ .jump{display:none} }

.nav{display:flex; justify-content:flex-end; margin-top:.4rem}
.skip{background:none; border:1px solid var(--line); border-radius:8px; padding:.3rem .8rem; font-size:.88rem; color:var(--muted); cursor:pointer}
.skip:hover{color:var(--ink); border-color:var(--muted)}
.phases li{padding:0; border:none}
.phases button{font:inherit; font-size:.85rem; padding:.2rem .6rem; border-radius:999px; color:inherit; background:none; border:1px solid transparent; cursor:pointer}
.phases button:hover{border-color:var(--line)}
.phases li[aria-current="step"] button{cursor:default}
.msg.divider{align-self:center; background:none; border:none; border-top:1px dashed var(--line); border-radius:0; color:var(--muted); font-size:.88rem; padding:.4rem 1rem 0; text-align:center; max-width:none; width:100%}

/* ---------- bench ---------- */
.bench{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:1rem 1.1rem 1.1rem}
.bench-h{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:.6rem}
.bench-h h2{margin:0; font-size:1.1rem}
.bench-h .sub{color:var(--muted); font-size:.9rem}
.strand-wrap{overflow-x:auto; padding-bottom:.4rem}
.empty-note{color:var(--muted); margin:.4rem 0 .2rem}
.strand{display:flex; align-items:flex-start; width:max-content}
.strand .col{display:flex; flex-direction:column; gap:.55rem}
.strand .cell{height:var(--th); display:flex; align-items:center}
.strand .legend{padding-right:.6rem}
.strand .rname{font-size:.85rem; color:var(--muted); white-space:nowrap; justify-content:flex-end}
.strand .ends .endl, .strand .ends2 .endl{font-family:var(--mono); color:var(--muted); font-weight:600; font-size:.9rem}
.strand .ends{padding-right:.35rem} .strand .ends2{padding-left:.35rem}
.strand .tiles{gap:2px}
.strand.grouped .grp + .grp{margin-left:.45rem}
.strand:not(.grouped) .grp + .grp{margin-left:2px}
.strand .aa{justify-content:center; font-family:var(--mono); font-weight:600; font-size:.9rem}
.strand .aa span{border-top:2px solid var(--ink); padding-top:.1rem; min-width:calc(var(--tw) * 3); text-align:center}
.strand .aa span.stop{border-color:var(--T); color:var(--T)}
.b{width:var(--tw); height:var(--th); display:inline-flex; align-items:center; justify-content:center; border-radius:5px; font-family:var(--mono); font-weight:600; color:var(--tile-ink); border:none; padding:0; flex:none}
.b-A{background:var(--A); color:var(--A-ink)} .b-T{background:var(--T)} .b-U{background:var(--U)} .b-C{background:var(--C)} .b-G{background:var(--G)}
.b-x{background:var(--panel-2); color:var(--T); outline:2px dashed var(--T); outline-offset:-2px}
.tiles.bond .b{position:relative}
.tiles.bond .b:not(.empty)::after{content:''; position:absolute; left:50%; top:100%; height:.55rem; border-left:2px dotted var(--muted); opacity:.7}
.b-hid{background:var(--panel-2); outline:1.5px solid var(--line); outline-offset:-1.5px}
.caption{margin:.55rem 0 0; font-size:.92rem; color:var(--muted); max-width:60ch}
.caption b{color:var(--ink)}
.b.empty{background:transparent; outline:1.5px dashed var(--line); outline-offset:-2px}
.b.mark{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--mark)}
.b.del{opacity:.35; text-decoration:line-through; outline:2px dashed var(--mark); outline-offset:-2px}
button.b{cursor:pointer}
button.b:hover{transform:translateY(-2px)}
button.b.chosen{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--mark)}
.key{display:flex; flex-wrap:wrap; gap:.4rem .9rem; margin-top:.7rem; font-size:.85rem; color:var(--muted)}
.key span{display:inline-flex; align-items:center; gap:.3rem}
.key i{width:.85rem; height:.85rem; border-radius:3px; display:inline-block}

/* codon table */
#tableBox{margin-top:1rem; border-top:1px solid var(--line); padding-top:.7rem}
#tableBox summary{cursor:pointer; font-weight:700}
.ct-wrap{overflow-x:auto; margin-top:.6rem}
.ct{border-collapse:collapse; font-size:.85rem; width:100%; min-width:30rem}
.ct th,.ct td{border:1px solid var(--line); padding:.3rem .4rem; vertical-align:top}
.ct th{background:var(--panel-2); font-family:var(--mono)}
.ct td div{font-family:var(--mono); white-space:nowrap; line-height:1.45}
.ct .st{color:var(--T); font-weight:600}
.ct .start{font-weight:700; text-decoration:underline; text-underline-offset:3px}
.ct-note{font-size:.82rem; color:var(--muted); margin:.5rem 0 0}
.abbr{font-size:.82rem; color:var(--muted); margin:.4rem 0 0; line-height:1.45}
</style>

<nav class="sitenav" style="display:flex;gap:18px;align-items:center;padding:14px 16px 0;font:600 15px/1.3 'Source Sans 3',system-ui,sans-serif"><a href="../index.html#home" style="color:#9AA3B2;text-decoration:none">Biologie bij Kamiel</a><span style="color:#4A5E82">·</span><a href="../index.html#dna" style="color:#E0B64A;text-decoration:none">← Terug naar DNA</a></nav>

<header class="top">
  <div class="brand">
    <h1>De Eiwitfabriek</h1>
    <span class="role" id="role">Jij bent: <b>RNA-polymerase</b></span>
  </div>
  <ol class="phases" id="phases" aria-label="Voortgang"></ol>
  <button class="restart" id="restart" type="button">Opnieuw beginnen</button>
</header>

<main class="layout">
  <section class="dialog" aria-label="Opdrachten">
    <div id="log" aria-live="polite"></div>
    <div id="input"><div id="slot"></div><div class="nav"><button type="button" id="skip" class="skip">Volgende opdracht</button></div></div>
  </section>
  <aside class="bench" id="bench" aria-label="Werkbank">
    <div class="bench-h"><h2>Werkbank</h2><span class="sub" id="benchSub"></span></div>
    <div class="strand-wrap" id="strand"></div>
    <div class="key" aria-hidden="true">
      <span><i style="background:var(--A)"></i>A adenine</span>
      <span><i style="background:var(--T)"></i>T thymine</span>
      <span><i style="background:var(--U)"></i>U uracil</span>
      <span><i style="background:var(--C)"></i>C cytosine</span>
      <span><i style="background:var(--G)"></i>G guanine</span>
    </div>
    <details id="tableBox" hidden>
      <summary>Codontabel (mRNA-codons, 5'→3')</summary>
      <div class="ct-wrap" id="ct"></div>
      <p class="ct-note">Rij = 1e base, kolom = 2e base, in het vakje zoek je de 3e base.</p>
      <p class="abbr" id="abbr"></p>
    </details>
  </aside>
</main>

<script id="logic">
/* ================= LOGIC (sequences, codon table, checking) ================= */
const P5 = "5'", P3 = "3'";
const ORDER = 'UCAG';
const AA1 = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const THREE = {F:'Phe',L:'Leu',S:'Ser',Y:'Tyr','*':'STOP',C:'Cys',W:'Trp',P:'Pro',H:'His',Q:'Gln',R:'Arg',I:'Ile',M:'Met',T:'Thr',N:'Asn',K:'Lys',V:'Val',A:'Ala',D:'Asp',E:'Glu',G:'Gly'};
const CODON = {};
{ let k = 0; for (const a of ORDER) for (const b of ORDER) for (const c of ORDER) CODON[a+b+c] = THREE[AA1[k++]]; }
const AA_CODONS = {};
for (const [c,a] of Object.entries(CODON)) (AA_CODONS[a] = AA_CODONS[a] || []).push(c);
const NAMES = {Ala:'alanine',Arg:'arginine',Asn:'asparagine',Asp:'asparaginezuur',Cys:'cysteïne',Gln:'glutamine',Glu:'glutaminezuur',Gly:'glycine',His:'histidine',Ile:'isoleucine',Leu:'leucine',Lys:'lysine',Met:'methionine',Phe:'fenylalanine',Pro:'proline',Ser:'serine',Thr:'threonine',Trp:'tryptofaan',Tyr:'tyrosine',Val:'valine'};
const CANON = {}; for (const k of Object.keys(NAMES)) CANON[k.toLowerCase()] = k;
const DNA2RNA = {A:'U',T:'A',C:'G',G:'C'};
const DNACOMP = {A:'T',T:'A',C:'G',G:'C'};
const RNACOMP = {A:'U',U:'A',C:'G',G:'C'};

const mrnaFromTemplate = t => [...t].map(b => DNA2RNA[b]).join('');
const templateFromMrna = m => [...m.replace(/U/g,'T')].map(b => DNACOMP[b]).join('');
const codingFromTemplate = t => [...t].map(b => DNACOMP[b]).join('');
const rand = n => Math.floor(Math.random() * n);
const pickOne = a => a[rand(a.length)];
const rb = () => pickOne([...'ACGU']);

function translate(m, s){
  const aas = [];
  for (let i = s; i + 3 <= m.length; i += 3){
    const a = CODON[m.substr(i,3)];
    if (a === 'STOP') return {aas, stop:true};
    aas.push(a);
  }
  return {aas, stop:false};
}
function normSeq(s){ return s.toUpperCase().replace(/[35]\s*['’′`]/g,'').replace(/[^A-Z]/g,''); }
function g3(s, off=0){
  let out = '';
  for (let i = 0; i < s.length; i++){ if (i > 0 && i >= off && (i - off) % 3 === 0) out += ' '; else if (off > 0 && i === off) out += ' '; out += s[i]; }
  return out;
}
const firstN = (n, one, many) => n === 1 ? `Het eerste ${one} klopt.` : `De eerste ${n} ${many} kloppen.`;
const eq = (a,b) => a.length === b.length && a.every((x,i) => x === b[i]);

const AA_POOL = Object.keys(NAMES).filter(a => a !== 'Met');
function genProtein(n){
  const aas = ['Met']; for (let i = 1; i < n; i++) aas.push(pickOne(AA_POOL));
  const codons = aas.map(a => a === 'Met' ? 'AUG' : pickOne(AA_CODONS[a]));
  return {aas, mrna: codons.join('') + pickOne(['UAA','UAG','UGA'])};
}
function genFlanked(){
  for (;;){
    const p = genProtein(4 + rand(2));
    const m = rb() + rb() + p.mrna + rb();
    if (m.indexOf('AUG') === 2) return {mrna:m, start:2, aas:p.aas};
  }
}
const templTriplet = cod => templateFromMrna(cod);

function checkSeq(raw, correct, kind, template){
  const s = normSeq(raw);
  if (!s) return {ok:false, msg:'Je hebt nog geen basen ingevuld.'};
  const bad = [...new Set(s.replace(/[ACGTU]/g,''))];
  if (bad.length) return {ok:false, msg:`${bad.join(', ')} ${bad.length>1?'zijn geen basen':'is geen base'}. Gebruik alleen A, C, G, T of U.`};
  if (s === correct) return {ok:true};
  if (kind === 'RNA' && s.includes('T')){
    if (s.replace(/T/g,'U') === correct) return {ok:false, mis:'T', msg:'Je basenparing klopt helemaal! Alleen: je bouwt RNA, en RNA bevat geen thymine (T). Welke base komt ervoor in de plaats?'};
    return {ok:false, mis:'T', msg:'Er staat een T in je mRNA. RNA bevat geen thymine. Welke base komt ervoor in de plaats? Kijk daarna ook de andere basen nog eens na.'};
  }
  if (kind === 'DNA' && s.includes('U')){
    if (s.replace(/U/g,'T') === correct) return {ok:false, mis:'T', msg:'De volgorde klopt, maar je schrijft nu een DNA-streng. DNA bevat geen uracil (U). Welke base staat er in DNA?'};
    return {ok:false, mis:'T', msg:'Er staat een U in je DNA-streng. DNA bevat geen uracil. Kijk ook de andere basen nog eens na.'};
  }
  if (s.length > 1 && [...s].reverse().join('') === correct)
    return {ok:false, mis:'richting', msg:`Alle basen kloppen, maar ze staan in omgekeerde volgorde. Je schrijft van ${P5} naar ${P3}: begin tegenover het ${P3}-uiteinde van de matrijsstreng.`};
  if (kind === 'DNA' && template && s === template)
    return {ok:false, mis:'streng', msg:'Dit is de matrijsstreng zelf. De coderende streng ligt er tegenover. Welke basen horen daar?'};
  const n = Math.min(s.length, correct.length);
  let i = 0; while (i < n && s[i] === correct[i]) i++;
  if (i === n){
    if (s.length < correct.length) return {ok:false, msg:`${firstN(i,'nucleotide','nucleotiden').slice(0,-1)}, maar je bent te vroeg gestopt. De matrijsstreng heeft ${correct.length} nucleotiden, en elk nucleotide krijgt precies één partner.`};
    return {ok:false, msg:`${firstN(i,'nucleotide','nucleotiden').slice(0,-1)}, maar je hebt er ${s.length} en de matrijsstreng heeft er ${correct.length}. Elk nucleotide krijgt precies één partner.`};
  }
  let good = 0; for (let j = 0; j < n; j++) if (s[j] === correct[j]) good++;
  const lead = i > 0 ? firstN(i,'nucleotide','nucleotiden') : `Van de ${correct.length} nucleotiden staan er ${good} goed.`;
  const extra = s.length !== correct.length ? ` Tel ook even: jij hebt ${s.length} nucleotiden, de matrijsstreng ${correct.length}.` : '';
  return {ok:false, msg:`${lead} Kijk nog eens naar het ${i+1}e nucleotide: welke base hoort tegenover de ${template[i]} op de matrijsstreng?${extra}`};
}

function parseProtein(raw){
  const toks = raw.split(/[^A-Za-zÀ-ÿ]+/).filter(Boolean);
  const norm = [];
  for (const t of toks){
    const lc = t.toLowerCase();
    if (lc === 'stop') { norm.push('STOP'); continue; }
    if (!CANON[lc]) return {error:t};
    norm.push(CANON[lc]);
  }
  return {norm};
}
function checkProtein(raw, mrna, start, {frame=false} = {}){
  const p = parseProtein(raw);
  if (p.error) return {ok:false, msg:`"${p.error}" herken ik niet als drielettercode van een aminozuur. Gebruik de afkortingen uit de codontabel, zoals Leu of Ser, gescheiden door streepjes.`};
  const norm = p.norm;
  if (!norm.length) return {ok:false, msg:'Je hebt nog geen aminozuren ingevuld.'};
  const tr = translate(mrna, start), correct = tr.aas;
  if (eq(norm, correct)) return {ok:true};
  const codons = Math.floor((mrna.length - start) / 3);
  if (norm.includes('STOP')){
    const w = norm.filter(x => x !== 'STOP');
    if (eq(w, correct)) return {ok:false, mis:'stop', msg:'Alle aminozuren kloppen! Alleen: levert een stopcodon een aminozuur op? Laat het stopcodon weg uit je eiwit.'};
    return {ok:false, mis:'stop', msg:'Je hebt "stop" als aminozuur opgeschreven. Een stopcodon levert geen aminozuur op: daar laat het ribosoom het mRNA los. Kijk ook de andere aminozuren nog eens na.'};
  }
  if (frame && start > 0){
    const f0 = translate(mrna, 0).aas;
    if (norm[0] !== 'Met' && f0.length && norm[0] === f0[0])
      return {ok:false, mis:'frame', msg:'Je bent bij het allereerste nucleotide begonnen met vertalen. Het ribosoom begint pas bij het startcodon. Waar zit dat?'};
  }
  if (norm.length > codons + 1) return {ok:false, mis:'een', msg:'Je hebt meer aminozuren dan er codons zijn. Hoeveel nucleotiden vormen samen één codon?'};
  if (norm[0] !== 'Met') return {ok:false, msg:'Het eerste aminozuur klopt niet. Met welk codon begint de translatie altijd, en welk aminozuur hoort daarbij?'};
  const n = Math.min(norm.length, correct.length);
  let i = 0; while (i < n && norm[i] === correct[i]) i++;
  if (i === n){
    if (norm.length < correct.length) return {ok:false, msg:`${firstN(i,'aminozuur','aminozuren').slice(0,-1)}, maar het eiwit is nog niet af. ${tr.stop ? 'Lees verder tot je bij een stopcodon komt.' : 'Lees verder tot het einde van het mRNA.'}`};
    return {ok:false, msg:`${firstN(i,'aminozuur','aminozuren').slice(0,-1)}, maar daarna ga je te ver door. Waar laat het ribosoom het mRNA los?`};
  }
  const cod = mrna.substr(start + 3*i, 3);
  const anti = [...cod].map(b => RNACOMP[b]).join('');
  const antiRev = [...anti].reverse().join('');
  if ((norm[i] === CODON[anti] || norm[i] === CODON[antiRev]) && norm[i] !== correct[i])
    return {ok:false, mis:'anticodon', msg:`${firstN(i,'aminozuur','aminozuren')} Bij codon ${i+1} lijkt het alsof je het anticodon hebt opgezocht. In de codontabel zoek je het codon van het mRNA op.`};
  return {ok:false, msg:`${firstN(i,'aminozuur','aminozuren')} Kijk nog eens naar codon ${i+1}: zoek de 1e base in de rij, de 2e in de kolom en de 3e in het vakje.`};
}

function mutPractice(kind){
  const fam = ['Ala','Gly','Val','Pro','Thr'];
  for (let t = 0; t < 500; t++){
    const aas = ['Met']; for (let i = 0; i < 3; i++) aas.push(pickOne(fam));
    const codons = aas.map(a => a === 'Met' ? 'AUG' : pickOne(AA_CODONS[a]));
    if (kind === 'nonsense'){ const k = 1 + rand(3); aas[k] = 'Lys'; codons[k] = pickOne(['AAA','AAG']); }
    const stop = pickOne(['UAA','UAG','UGA']);
    const mrna = codons.join('') + stop;
    if (translate(mrna,0).aas.length !== 4) continue;
    if (kind === 'frameshift'){
      const mm = mrna.slice(0,3) + mrna.slice(4);
      return {kind, mrna, mut:mrna, mm, delIndex:3,
        desc:`In het mRNA valt het eerste nucleotide van het 2e codon (${codons[1]}) weg.`};
    }
    let k = 1 + rand(3), cod = codons[k], nc;
    if (kind === 'stil'){ nc = cod.slice(0,2) + pickOne([...'UCAG'].filter(b => b !== cod[2])); if (CODON[nc] !== aas[k]) continue; }
    else if (kind === 'missense'){ nc = pickOne([...'UCAG'].filter(b => b !== cod[0])) + cod.slice(1); if (CODON[nc] === 'STOP' || CODON[nc] === aas[k]) continue; }
    else { k = aas.indexOf('Lys'); cod = codons[k]; nc = 'U' + cod.slice(1); }
    const mc = codons.slice(); mc[k] = nc;
    const mm = mc.join('') + stop;
    const tOld = templTriplet(cod), tNew = templTriplet(nc);
    let pos = 0; while (tOld[pos] === tNew[pos]) pos++;
    return {kind, mrna, mm, k, tOld, tNew, markIndex:3*k+pos, templMut: templateFromMrna(mm),
      desc:`In het ${k+1}e triplet van de matrijsstreng verandert ${tOld} in ${tNew}.`};
  }
}
</script>

<script>
/* ================= UI / FLOW ================= */
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = reduceMotion ? 0 : 380;
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = s => [...s].map(ch => /[ACGTU]/.test(ch) ? `<span class="c-${ch}">${ch}</span>` : ch).join('');
const fmt = (s, l, r, grouped=true, off=0) => `<span class="seq${s.length > 14 && !grouped ? ' wrap' : ''}">${l}-${color(grouped ? g3(s, off) : s)}-${r}</span>`;
const OKS = ['Klopt!', 'Precies goed.', 'Helemaal goed.', 'Juist.'];

/* ---- constants from the lesson plan ---- */
const T1A = 'TACCGA';
const T1B = 'TACCGAACCTTTCTGATT';
const M1B = mrnaFromTemplate(T1B);           // AUGGCUUGGAAAGACUAA
const T3  = 'CGTACAAACCGACGGTAATCG';
const M3  = mrnaFromTemplate(T3);            // GCAUGUUUGGCUGCCAUUAGC

/* ---- phases ---- */
const PHASES = ['Start','Transcriptie','Translatie','Zelf doen','Mutaties','Afsluiting'];
const ROLES = ['RNA-polymerase','RNA-polymerase','een ribosoom','RNA-polymerase én ribosoom','RNA-polymerase én ribosoom', null];
function setPhase(p){
  $('#phases').innerHTML = PHASES.map((l,i) => `<li class="${i < p ? 'done' : ''}" ${i === p ? 'aria-current="step"' : ''}><button type="button" data-p="${i}" title="Ga naar ${i < 5 ? 'fase ' + i : 'de afsluiting'}"><span class="n">${i < 5 ? i : '✓'}</span>${l}</button></li>`).join('');
  const r = ROLES[p];
  $('#role').innerHTML = r ? `Jij bent: <b>${r}</b>` : 'Klaar met de productie';
}

/* ---- log ---- */
const log = $('#log');
function bot(html, cls=''){
  const d = document.createElement('div');
  d.className = 'msg bot ' + cls;
  const who = cls === 'hint' ? 'Hint' : cls === 'ok' ? 'Goed' : cls === 'explain' ? 'Uitleg' : '';
  d.innerHTML = (who ? `<span class="who">${who}</span>` : '') + html;
  log.appendChild(d);
  scrollDown();
}
function me(text){
  const d = document.createElement('div');
  d.className = 'msg me';
  d.textContent = text;
  log.appendChild(d);
  scrollDown();
}
function scrollDown(){ requestAnimationFrame(() => window.scrollTo({top: document.documentElement.scrollHeight, behavior: reduceMotion ? 'auto' : 'smooth'})); }

/* ---- bench ---- */
let bench = null;
function setBench(cfg){ bench = cfg; renderStrand(); }
function renderStrand(){
  const cfg = bench, box = $('#strand');
  $('#benchSub').textContent = cfg?.sub || '';
  if (!cfg || !cfg.rows?.length){ box.innerHTML = `<p class="empty-note">${cfg?.note || 'Hier verschijnen de strengen waar je aan werkt.'}</p>`; return; }
  const n = Math.max(1, ...cfg.rows.map(r => r.seq.length));
  const off = cfg.offset || 0;
  const groups = [];
  const range = (a,b) => Array.from({length:b-a}, (_,i) => a+i);
  if (cfg.grouped){ if (off > 0) groups.push(range(0, Math.min(off,n))); for (let i = off; i < n; i += 3) groups.push(range(i, Math.min(i+3,n))); }
  else for (let i = 0; i < n; i++) groups.push([i]);
  const hasAA = !!cfg.aa;
  let h = `<div class="strand${cfg.grouped ? ' grouped' : ''}">`;
  h += '<div class="col legend">' + cfg.rows.map(r => `<div class="cell rname">${r.name}</div>`).join('') + (hasAA ? '<div class="cell rname">eiwit</div>' : '') + '</div>';
  h += '<div class="col ends">' + cfg.rows.map(r => `<div class="cell endl">${r.left || ''}</div>`).join('') + (hasAA ? '<div class="cell"></div>' : '') + '</div>';
  for (const g of groups){
    h += '<div class="col grp">';
    for (const r of cfg.rows) h += `<div class="cell tiles${r.bond ? ' bond' : ''}">` + g.map(i => tile(r,i)).join('') + '</div>';
    if (hasAA){
      let lab = '';
      if (cfg.grouped && g[0] >= off && g.length === 3) lab = cfg.aa.tokens[(g[0]-off)/3] || '';
      h += `<div class="cell aa">${lab ? `<span class="${lab === 'STOP' ? 'stop' : ''}">${esc(lab === 'STOP' ? 'stop' : lab)}</span>` : ''}</div>`;
    }
    h += '</div>';
  }
  h += '<div class="col ends2">' + cfg.rows.map(r => `<div class="cell endl">${r.right || ''}</div>`).join('') + (hasAA ? '<div class="cell"></div>' : '') + '</div>';
  box.innerHTML = h + '</div>' + (cfg.caption ? `<p class="caption">${cfg.caption}</p>` : '');
}
function tile(r, i){
  const b = r.seq[i];
  if (r.hidden && b) return `<span class="b b-hid" aria-label="verborgen base"></span>`;
  if (!b) return `<span class="b empty"></span>`;
  const cls = /[ACGTU]/.test(b) ? 'b-' + b : 'b-x';
  const mark = (Array.isArray(r.mark) ? r.mark.includes(i) : r.mark === i) ? ' mark' : '';
  const del = r.del === i ? ' del' : '';
  if (r.pick) return `<button type="button" class="b ${cls}${r.chosen === i ? ' chosen' : ''}" data-i="${i}" aria-label="nucleotide ${i+1}: ${b}">${b}</button>`;
  return `<span class="b ${cls}${mark}${del}">${esc(b)}</span>`;
}
$('#strand').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (b && cur && cur.onPick && !cur.locked) cur.onPick(+b.dataset.i);
});

function buildTable(){
  let h = '<table class="ct"><thead><tr><th>1e \\ 2e</th>' + [...ORDER].map(b => `<th>${b}</th>`).join('') + '</tr></thead><tbody>';
  for (const a of ORDER){
    h += `<tr><th>${a}</th>`;
    for (const b of ORDER){
      h += '<td>' + [...ORDER].map(c => { const cod = a+b+c, aa = CODON[cod];
        return `<div class="${cod === 'AUG' ? 'start' : ''}">${cod} ${aa === 'STOP' ? '<span class="st">stop</span>' : aa}${cod === 'AUG' ? ' (start)' : ''}</div>`; }).join('') + '</td>';
    }
    h += '</tr>';
  }
  $('#ct').innerHTML = h + '</tbody></table>';
  $('#abbr').textContent = Object.entries(NAMES).map(([k,v]) => `${k} = ${v}`).join(', ') + '.';
}
function showTable(open){ const t = $('#tableBox'); t.hidden = false; if (open) t.open = true; }

/* ---- input widgets ---- */
const inputBox = $('#slot');
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function setInput(node){
  inputBox.replaceChildren(node);
  const f = node.querySelector('input, textarea');
  if (f && matchMedia('(hover: hover)').matches) f.focus({preventScroll:true});
  scrollDown();
}
function lock(){ if (cur) cur.locked = true; inputBox.querySelectorAll('input,textarea,button').forEach(x => x.disabled = true); }
function unlock(){
  if (cur) cur.locked = false;
  inputBox.querySelectorAll('input,textarea,button').forEach(x => x.disabled = false);
  const f = inputBox.querySelector('input, textarea');
  if (f && matchMedia('(hover: hover)').matches){ f.focus({preventScroll:true}); if (f.select) f.select(); }
  scrollDown();
}
function jumpBtn(){ return '<button type="button" class="jump" onclick="document.getElementById(\'bench\').scrollIntoView({behavior:\'smooth\'})">Naar de werkbank</button>'; }

function seqWidget({label, left=P5, right=P3, onLive, onSubmit}){
  const f = el(`<form class="w"><label class="wl" for="seqIn">${label}</label><div class="seqrow"><span class="endl">${left}</span><input id="seqIn" class="seqin" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"><span class="endl">${right}</span><button class="btn">Controleer</button></div></form>`);
  const i = f.querySelector('input');
  i.addEventListener('input', () => onLive && onLive(normSeq(i.value)));
  f.addEventListener('submit', e => { e.preventDefault(); if (!i.value.trim()) return i.focus(); onSubmit(i.value.trim()); });
  setInput(f);
}
function proteinWidget({onLive, onSubmit}){
  const f = el(`<form class="w"><label class="wl" for="protIn">Eiwit (drielettercodes met streepjes)</label><div class="seqrow"><input id="protIn" class="protin" autocomplete="off" spellcheck="false" placeholder="bijv. Xxx-Xxx-Xxx"><button class="btn">Controleer</button></div></form>`);
  const i = f.querySelector('input');
  i.addEventListener('input', () => onLive && onLive(i.value));
  f.addEventListener('submit', e => { e.preventDefault(); if (!i.value.trim()) return i.focus(); onSubmit(i.value.trim()); });
  setInput(f);
}
function textWidget(onSubmit){
  const f = el(`<form class="w"><label class="wl" for="txtIn">Jouw antwoord</label><textarea id="txtIn" rows="3"></textarea><div class="btnrow"><button class="btn">Verstuur</button></div></form>`);
  const t = f.querySelector('textarea');
  t.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) f.requestSubmit(); });
  f.addEventListener('submit', e => { e.preventDefault(); if (!t.value.trim()) return t.focus(); onSubmit(t.value.trim()); });
  setInput(f);
}
function numWhyWidget(onSubmit){
  const f = el(`<form class="w"><label class="lbl inline">Aantal aminozuren <input class="numin" type="number" min="0" inputmode="numeric"></label><label class="lbl">Waarom is dat niet gelijk aan het aantal codons?<textarea rows="2"></textarea></label><div class="btnrow"><button class="btn">Controleer</button></div></form>`);
  const n = f.querySelector('input'), t = f.querySelector('textarea');
  f.addEventListener('submit', e => { e.preventDefault(); if (n.value === '') return n.focus(); onSubmit(parseInt(n.value,10), t.value.trim()); });
  setInput(f);
}
function pairsWidget(order, onLive, onSubmit){
  const f = el(`<form class="w"><span class="wl">DNA-base → RNA-base</span><div class="pairs">${order.map((b,i) => `<label class="pair"><span class="c-${b}">${b}</span><span class="arrow">→</span><input maxlength="1" data-i="${i}" aria-label="RNA-base tegenover ${b}" autocomplete="off" autocapitalize="characters"></label>`).join('')}</div><div class="btnrow"><button class="btn">Controleer</button></div></form>`);
  const ins = [...f.querySelectorAll('input')];
  const vals = () => ins.map(x => x.value.trim().toUpperCase());
  ins.forEach((x,i) => x.addEventListener('input', () => { onLive(vals()); if (x.value && ins[i+1]) ins[i+1].focus(); }));
  f.addEventListener('submit', e => { e.preventDefault(); const v = vals(); const k = v.findIndex(x => !x); if (k >= 0) return ins[k].focus(); onSubmit(v); });
  setInput(f);
}
function choiceWidget(options, onPick, label=''){
  const f = el(`<div class="w">${label ? `<span class="wl">${label}</span>` : ''}<div class="opts">${options.map((o,i) => `<button type="button" class="opt" data-i="${i}">${o}</button>`).join('')}</div></div>`);
  f.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => onPick(+b.dataset.i, options[+b.dataset.i].replace(/<[^>]+>/g,''))));
  setInput(f);
}

/* ---- engine ---- */
let queue = [], cur = null, stats;
function resetStats(){ stats = {first:0, total:0, mis:{}, ph:{}}; }
function S(o){ return Object.assign({attempts:0}, o); }
let gen = 0;
function guard(){ const g = gen; const go = () => { if (g === gen) next(); }; go.live = () => g === gen; return go; }
function next(){
  gen++;
  cur = queue.shift();
  $('#skip').hidden = !queue.length;
  if (!cur) return;
  setPhase(cur.phase);
  cur.enter();
}
async function handle(step, res, echo){
  const go = guard();
  lock();
  me(echo);
  await wait(D);
  if (!go.live()) return;
  const ph = stats.ph[step.phase] || (stats.ph[step.phase] = {first:0, total:0});
  if (res.ok){
    if (!step.isPractice){ stats.total++; ph.total++; if (step.attempts === 0){ stats.first++; ph.first++; } }
    bot(res.msg || pickOne(OKS), 'ok');
    if (step.after) step.after();
    await wait(D);
    return go();
  }
  step.attempts++;
  if (res.mis) stats.mis[res.mis] = (stats.mis[res.mis] || 0) + 1;
  if (step.attempts >= 2 && step.explain){
    if (!step.isPractice){ stats.total++; ph.total++; }
    bot(step.explain(), 'explain');
    if (step.after) step.after();
    if (step.practice && !step.isPractice){
      const p = step.practice(); p.forEach(x => x.isPractice = true);
      await wait(D);
      bot('Nu een vergelijkbare opdracht, zodat je het zelf kunt.');
      queue.unshift(...p);
    }
    await wait(D);
    return go();
  }
  bot(res.msg, 'hint');
  unlock();
}
function modelBlock(html){ return `<div class="model"><span class="model-h">Zo kun je het zeggen</span>${html}</div>`; }

/* ---- step factories ---- */
function stepFree({phase, q, model, react, onDone, continueLabel}){
  const st = S({phase, enter(){
    bot(q);
    textWidget(v => { const go = guard(); lock(); me(v); (async () => { await wait(D); if (!go.live()) return; bot((react ? `<p>${react(v)}</p>` : '') + modelBlock(model)); if (onDone) onDone(); await wait(D); if (!go.live()) return; if (continueLabel) choiceWidget([continueLabel], (i, label) => { lock(); me(label); setTimeout(go, D); }); else go(); })(); });
  }});
  return st;
}

function stepStrands(){
  const coding = 'ATGTCCGGA', template = codingFromTemplate(coding);
  const s = stepMCq({phase:1,
    intro:[
      '<p><strong>Fase 1: transcriptie.</strong> Kijk eerst naar je werkbank. DNA is <strong>dubbelstrengs</strong>: twee strengen waarvan de basen paren vormen (A met T, C met G). De strengen lopen in tegengestelde richting: de ene van 5\' naar 3\', de andere van 3\' naar 5\'.</p>',
      '<p>Jij gebruikt maar één van de twee als mal: de <strong>matrijsstreng</strong>. Tegen die streng bouw je het mRNA, base voor base.</p><p>De andere streng heet de <strong>coderende streng</strong>. Die lees je niet af, maar hij heeft wel bijna dezelfde volgorde als het mRNA dat je maakt. Daar kom je straks zelf achter.</p>'],
    q:'<p>Welke streng gebruik jij als RNA-polymerase als mal om het mRNA te bouwen?</p>',
    options:['De coderende streng','De matrijsstreng','Allebei tegelijk'], correct:1,
    hints:{0:{mis:'streng', msg:'De coderende streng heeft bijna dezelfde volgorde als het mRNA, maar je bouwt het mRNA er niet tegenaan. Tegen welke streng wel?'}, 2:{msg:'RNA-polymerase leest maar één van de twee strengen af. Welke is de mal?'}},
    explain:() => '<p>Je bouwt het mRNA tegen de <strong>matrijsstreng</strong> aan. De coderende streng doet niet mee, maar heeft wel bijna dezelfde volgorde als het mRNA.</p>'});
  s.bench = {sub:'DNA in de celkern', grouped:true, rows:[{name:'coderende streng', left:P5, right:P3, seq:coding, bond:true}, {name:'matrijsstreng', left:P3, right:P5, seq:template}],
    caption:'Twee strengen, verbonden via de basenparen A–T en C–G (stippellijnen). Boven loopt de streng van 5\' naar 3\', onder van 3\' naar 5\'.'};
  return s;
}

function stepPairs(order=['A','T','C','G']){
  const correct = {A:'U', T:'A', C:'G', G:'C'};
  const st = S({phase:1, enter(){
    bot(st.isPractice
      ? '<p>Vul de paren nog eens in, nu in een andere volgorde.</p>'
      : '<p>Nu ga je bouwen. Jij zet RNA-nucleotiden tegenover de basen van de matrijsstreng.</p><p>Welke RNA-base zet jij tegenover elke DNA-base? Vul de vier paren in.</p>');
    const cfg = {sub:'Basenparing', grouped:false, rows:[{name:'DNA', seq:order}, {name:'RNA', seq:['','','','']}]};
    setBench(cfg);
    pairsWidget(order, v => { cfg.rows[1].seq = v; renderStrand(); }, v => {
      const echo = order.map((b,i) => `${b} → ${v[i]}`).join(',  ');
      const wrong = order.filter((b,i) => v[i] !== correct[b]);
      if (!wrong.length) return handle(st, {ok:true, msg:'Alle vier goed. Tegenover A komt in RNA een U, omdat RNA geen thymine heeft.'}, echo);
      const typedT = v.includes('T');
      const okN = 4 - wrong.length;
      let msg = `${okN} van de 4 kloppen. Kijk nog eens naar ${wrong.join(' en ')}: welke bases vormen samen een paar?`;
      if (typedT) msg += ' Let op: jij bouwt RNA, en RNA bevat geen T.';
      handle(st, {ok:false, mis: typedT ? 'T' : null, msg}, echo);
    });
  },
  explain: () => 'In DNA vormen A en T een paar, en C en G. In RNA neemt uracil (U) de plaats in van thymine. Dus: DNA A → RNA U, T → A, C → G en G → C.',
  practice: () => [stepPairs(['G','A','C','T'])]});
  return st;
}

function stepTranscribe({phase, template, grouped, intro, showCoding=false}){
  const correct = mrnaFromTemplate(template);
  const st = S({phase, enter(){
    intro.forEach(m => bot(m));
    const live = {name:'jouw mRNA', left:P5, right:P3, seq:'', live:true};
    const rows = [{name:'matrijsstreng', left:P3, right:P5, seq:template, bond:true}, live];
    if (showCoding) rows.unshift({name:'coderende streng', left:P5, right:P3, seq:codingFromTemplate(template), hidden:true});
    const cfg = {sub:'Transcriptie', grouped, rows, caption: showCoding ? 'Jij hebt de twee DNA-strengen hier even uit elkaar gehaald. De coderende streng (grijs) doet niet mee: jij leest alleen de matrijsstreng af.' : ''};
    setBench(cfg);
    seqWidget({label:'mRNA', onLive: v => { live.seq = v; renderStrand(); }, onSubmit: raw => handle(st, checkSeq(raw, correct, 'RNA', template), raw)});
  },
  after(){ const r = bench.rows.find(x => x.live); if (r) r.seq = correct; renderStrand(); },
  explain(){
    const trip = []; for (let i = 0; i < template.length; i += 3) trip.push(`${color(template.substr(i,3))} → ${color(correct.substr(i,3))}`);
    return `<p>Stap voor stap: tegenover elke base van de matrijsstreng zet je de RNA-partner (A→U, T→A, C→G, G→C). Per drie:</p><p class="seq wrap">${trip.join(', ')}</p><p>Het mRNA is dus ${fmt(correct, P5, P3, grouped)}.</p>`;
  },
  practice(){
    const p = genProtein(3 + rand(2)), t = templateFromMrna(p.mrna);
    return [stepTranscribe({phase, template:t, grouped, showCoding, intro:[`<p>Matrijsstreng: ${fmt(t, P3, P5, grouped)}</p><p>Schrijf het mRNA, van ${P5} naar ${P3}.</p>`]})];
  }});
  return st;
}

function stepCoding(template=T1B){
  const correct = codingFromTemplate(template), mrna = mrnaFromTemplate(template);
  const st = S({phase:1, enter(){
    bot(st.isPractice
      ? `<p>Matrijsstreng: ${fmt(template, P3, P5)}</p><p>Schrijf de coderende streng op, van ${P5} naar ${P3}.</p>`
      : `<p>Tegenover de matrijsstreng ligt nog steeds de coderende streng. Op je werkbank is die leeg.</p><p>Schrijf de coderende streng op, van ${P5} naar ${P3}.</p>`);
    const cfg = {sub:'Twee DNA-strengen', grouped:true, rows:[{name:'coderende streng', left:P5, right:P3, seq:'', live:true, bond:true}, {name:'matrijsstreng', left:P3, right:P5, seq:template}, {name:'jouw mRNA', left:P5, right:P3, seq:mrna, hidden:true}]};
    setBench(cfg);
    seqWidget({label:'Coderende DNA-streng', onLive: v => { cfg.rows[0].seq = v; renderStrand(); }, onSubmit: raw => handle(st, checkSeq(raw, correct, 'DNA', template), raw)});
  },
  after(){ bench.rows[0].seq = correct; bench.rows[2].hidden = false; bench.caption = 'Vergelijk de bovenste en de onderste rij.'; renderStrand(); },
  explain: () => `<p>De coderende streng is complementair aan de matrijsstreng, met DNA-paren: A↔T en C↔G. Je krijgt ${fmt(correct, P5, P3)}.</p>`,
  practice(){ const p = genProtein(3 + rand(2)); return [stepCoding(templateFromMrna(p.mrna))]; }});
  return st;
}

function tokensForView(v){ return v.split(/[^A-Za-zÀ-ÿ]+/).filter(Boolean).map(t => t.toLowerCase() === 'stop' ? 'STOP' : (CANON[t.toLowerCase()] || t)); }

function stepTranslate({phase, mrna, start=0, intro, grouped=true, offset=0, frame=false, openTable=false, benchRows=null, sub='Translatie', aaRow=true}){
  const tr = translate(mrna, start);
  const st = S({phase, enter(){
    if (openTable) showTable(true);
    intro.forEach(m => bot(m));
    const cfg = {sub, grouped, offset, rows: benchRows || [{name:'mRNA', left:P5, right:P3, seq:mrna}]};
    if (grouped && aaRow) cfg.aa = {tokens:[]};
    setBench(cfg);
    proteinWidget({onLive: v => { if (cfg.aa){ cfg.aa.tokens = tokensForView(v); renderStrand(); } }, onSubmit: raw => handle(st, checkProtein(raw, mrna, start, {frame}), raw)});
  },
  after(){ if (bench.aa){ bench.aa.tokens = tr.aas.concat(tr.stop ? ['STOP'] : []); renderStrand(); } },
  explain(){
    const parts = [];
    for (let i = start; i + 3 <= mrna.length; i += 3){ const c = mrna.substr(i,3), a = CODON[c]; parts.push(`${color(c)} = ${a === 'STOP' ? 'stop (geen aminozuur)' : a}`); if (a === 'STOP') break; }
    return `<p>${start > 0 ? `Het ribosoom begint bij het startcodon AUG, op nucleotide ${start+1}. ` : ''}Codon voor codon, opgezocht in de codontabel:</p><p class="seq wrap">${parts.join(', ')}</p><p>Het eiwit is dus <strong>${tr.aas.join('-')}</strong>${tr.stop ? '' : ' (er komt geen stopcodon meer)'}.</p>`;
  },
  practice(){
    if (frame){ const g = genFlanked(); return [stepTranslate({phase, mrna:g.mrna, start:g.start, grouped:false, frame:true, intro:[`<p>Vertaal dit mRNA vanaf het startcodon tot het stopcodon:</p><p>${fmt(g.mrna, P5, P3, false)}</p>`]})]; }
    const p = genProtein(3 + rand(3));
    return [stepTranslate({phase, mrna:p.mrna, intro:[`<p>Vertaal dit mRNA codon voor codon:</p><p>${fmt(p.mrna, P5, P3)}</p>`]})];
  }});
  return st;
}

function stepCount(mrna=M1B){
  const tr = translate(mrna, 0), n = tr.aas.length, codons = n + 1;
  const st = S({phase:2, enter(){
    bot(st.isPractice
      ? `<p>Het mRNA ${fmt(mrna, P5, P3)} wordt vertaald. Hoeveel aminozuren krijgt het peptide, en waarom is dat niet gelijk aan het aantal codons?</p>`
      : '<p>Hoeveel aminozuren heeft dit peptide, en waarom is dat niet gelijk aan het aantal codons?</p>');
    if (st.isPractice) setBench({sub:'Translatie', grouped:true, rows:[{name:'mRNA', left:P5, right:P3, seq:mrna}]});
    numWhyWidget((k, why) => {
      const echo = `${k} aminozuren.${why ? ' ' + why : ''}`;
      let res;
      if (k === n) res = {ok:true, msg:`Klopt, ${n} aminozuren.` + modelBlock(`Het mRNA heeft ${codons} codons, maar het laatste (${mrna.slice(-3)}) is een stopcodon. Daar laat het ribosoom los en er komt geen aminozuur bij.`)};
      else if (k === codons) res = {ok:false, mis:'stop', msg:'Je telt alle codons mee. Levert elk codon een aminozuur op? Kijk naar het laatste codon.'};
      else if (k === mrna.length || k === mrna.length - 3) res = {ok:false, mis:'een', msg:'Je telt nucleotiden. Hoeveel nucleotiden vormen samen één codon, en dus één aminozuur?'};
      else res = {ok:false, msg:'Tel nog eens: hoeveel aminozuren staan er in het peptide dat je net hebt gemaakt?'};
      handle(st, res, echo);
    });
  },
  explain: () => `<p>Het mRNA heeft ${mrna.length} nucleotiden, dus ${codons} codons. Het laatste codon, ${color(mrna.slice(-3))}, is een stopcodon: daar laat het ribosoom los en er komt geen aminozuur bij. Het peptide heeft dus ${n} aminozuren.</p>`,
  practice(){ const p = genProtein(3 + rand(3)); return [stepCount(p.mrna)]; }});
  return st;
}

function stepPick(mrna=M3, start=2){
  const st = S({phase:3, enter(){
    bot(st.isPractice
      ? `<p>Hier is een nieuw mRNA: ${fmt(mrna, P5, P3, false)}</p><p>Klik op je werkbank op het eerste nucleotide van het startcodon.</p>`
      : '<p><strong>Stap 2:</strong> zoek het startcodon. Klik op je werkbank op het eerste nucleotide van het startcodon.</p>');
    const row = {name:'mRNA', left:P5, right:P3, seq:mrna, pick:true};
    setBench({sub:'Zoek het startcodon', grouped:false, rows:[row]});
    st.onPick = i => {
      row.chosen = i; renderStrand();
      const trip = mrna.substr(i,3);
      let res;
      if (i === start) res = {ok:true, msg:`Klopt: vanaf nucleotide ${start+1} staat AUG, het startcodon. Het leesraam begint hier.`};
      else if (i === 0) res = {ok:false, mis:'frame', msg:'Het ribosoom begint niet automatisch bij het eerste nucleotide. Het zoekt eerst een bepaald codon. Welk codon is het startcodon?'};
      else res = {ok:false, msg:`Vanaf nucleotide ${i+1} staat ${trip.length === 3 ? trip : trip + '…'}. Dat is geen startcodon. Welke drie basen vormen het startcodon?`};
      handle(st, res, `Nucleotide ${i+1} (${mrna[i]})`);
    };
    const f = el(`<div class="w"><span class="wl">Klik op een nucleotide op je werkbank.</span>${jumpBtn()}</div>`);
    setInput(f);
  },
  after(){ const r = bench.rows[0]; r.pick = false; renderStrand(); },
  explain: () => `<p>Het startcodon is altijd AUG. Loop het mRNA af tot je A-U-G achter elkaar ziet: dat begint bij nucleotide ${start+1}. Alles daarvoor wordt niet vertaald: ${fmt(mrna, P5, P3, true, start)}</p>`,
  practice(){ const g = genFlanked(); return [stepPick(g.mrna, g.start)]; }});
  return st;
}

function stepMCq({phase, q, options, correct, hints, explain, intro}){
  const st = S({phase, enter(){
    if (intro && !st.isPractice) [].concat(intro).forEach(m => bot(m));
    bot(q);
    if (st.bench) setBench(st.bench); else setBench({note: st.note || 'Hier verschijnen de strengen waar je aan werkt.'});
    const draw = () => choiceWidget(options, (i, label) => {
      if (i === correct) return handle(st, {ok:true}, label);
      handle(st, {ok:false, mis: hints[i]?.mis, msg: hints[i]?.msg || 'Dat klopt niet. Kijk nog eens goed.'}, label);
    });
    draw();
  }, explain});
  return st;
}

function stepMutType({answer, why, isPractice=false}){
  const opts = ['Stille mutatie','Missense-mutatie','Nonsense-mutatie','Frameshift'];
  const keys = ['stil','missense','nonsense','frameshift'];
  const HINT = {
    stil:'Bij een stille mutatie blijft het eiwit precies gelijk. Is dat hier zo? Vergelijk je nieuwe eiwit met het origineel.',
    missense:'Bij een missense-mutatie wordt één aminozuur vervangen door een ander, en de rest blijft gelijk. Is dat hier gebeurd?',
    nonsense:'Bij een nonsense-mutatie ontstaat te vroeg een stopcodon. Is dat hier het geval?',
    frameshift:'Bij een frameshift verschuift het leesraam, doordat er een nucleotide bij komt of verdwijnt. Is er hier een nucleotide verdwenen?'
  };
  const st = S({phase:4, isPractice, enter(){
    bot('Wat voor mutatie is dit?');
    choiceWidget(opts, (i, label) => {
      if (keys[i] === answer) return handle(st, {ok:true, msg:`Klopt. ${why}`}, label);
      handle(st, {ok:false, msg:HINT[keys[i]]}, label);
    });
  },
  explain: () => `<p>Een <strong>stille mutatie</strong> verandert het codon maar niet het aminozuur. Bij <strong>missense</strong> verandert één aminozuur. Bij <strong>nonsense</strong> ontstaat te vroeg een stopcodon. Bij een <strong>frameshift</strong> verschuift het leesraam door een deletie of insertie.</p><p>Hier is het een ${opts[keys.indexOf(answer)].toLowerCase()}: ${why}</p>`});
  return st;
}

const WHY = {
  stil:'Het codon verandert, maar codeert nog steeds voor hetzelfde aminozuur.',
  missense:'Eén aminozuur wordt vervangen door een ander.',
  nonsense:'Er ontstaat te vroeg een stopcodon, dus het eiwit wordt veel korter.',
  frameshift:'Door de deletie verschuift het leesraam, zodat alle codons daarna anders zijn.'
};

function mutPracticeSteps(kind){
  const m = mutPractice(kind);
  const orig = translate(m.mrna, 0).aas.join('-');
  const rows = kind === 'frameshift'
    ? [{name:'mRNA oud', left:P5, right:P3, seq:m.mrna, del:m.delIndex}]
    : [{name:'mRNA oud', left:P5, right:P3, seq:m.mrna}, {name:'matrijs nieuw', left:P3, right:P5, seq:m.templMut, mark:m.markIndex}];
  const s1 = stepTranslate({phase:4, mrna:m.mm, start:0, benchRows:rows, sub:'Mutatie', aaRow: kind !== 'frameshift',
    intro:[`<p>Oefenmutatie. Het mRNA is ${fmt(m.mrna, P5, P3)}, met als eiwit ${orig}.</p><p>${m.desc} Wat wordt het nieuwe eiwit?</p>`]});
  s1.practice = null;
  return [s1, stepMutType({answer:kind, why:WHY[kind], isPractice:true})];
}

function mutSteps(){
  const mk = (tIdx, from, to) => { const t = T1B.slice(0, tIdx*3) + to + T1B.slice(tIdx*3 + 3); let p = 0; while (from[p] === to[p]) p++; return {t, mark: tIdx*3 + p}; };
  const defs = [
    {letter:'a', kind:'stil',     ...mk(1,'CGA','CGG'), text:`In het 2e triplet van de matrijsstreng verandert CGA in CGG.`},
    {letter:'b', kind:'missense', ...mk(3,'TTT','CTT'), text:`In het 4e triplet van de matrijsstreng verandert TTT in CTT.`},
    {letter:'c', kind:'nonsense', ...mk(2,'ACC','ACT'), text:`In het 3e triplet van de matrijsstreng verandert ACC in ACT.`},
    {letter:'d', kind:'frameshift', text:`In het mRNA valt de G aan het begin van het 2e codon (GCU) weg.`}
  ];
  const out = [];
  defs.forEach((d, n) => {
    const frameshift = d.kind === 'frameshift';
    const mm = frameshift ? M1B.slice(0,3) + M1B.slice(4) : mrnaFromTemplate(d.t);
    const rows = frameshift
      ? [{name:'mRNA oud', left:P5, right:P3, seq:M1B, del:3}]
      : [{name:'mRNA oud', left:P5, right:P3, seq:M1B}, {name:'matrijs nieuw', left:P3, right:P5, seq:d.t, mark:d.mark}];
    const intro = [];
    if (n === 0) intro.push(`<p><strong>Fase 4: mutaties.</strong> We gaan terug naar het gen uit fase 1: mRNA ${fmt(M1B, P5, P3)}, eiwit Met-Ala-Trp-Lys-Asp.</p><p>Steeds verandert er iets kleins. Bepaal het nieuwe eiwit en benoem de mutatie.</p>`);
    intro.push(`<p><strong>Mutatie ${d.letter}.</strong> ${d.text} Wat wordt het nieuwe eiwit?${frameshift ? ' Vertaal tot een stopcodon, of tot het einde van het mRNA.' : ''}</p>`);
    const s = stepTranslate({phase:4, mrna:mm, start:0, benchRows:rows, sub:`Mutatie ${d.letter}`, aaRow:!frameshift, intro});
    s.practice = () => mutPracticeSteps(d.kind);
    out.push(s, stepMutType({answer:d.kind, why:WHY[d.kind]}));
  });
  out.push(stepFree({phase:4,
    q:'<p>Laatste vraag van de uitdaging: welke mutatie heeft waarschijnlijk het grootste effect op het eiwit, en waarom?</p>',
    model:'<p>De frameshift (d) en de nonsense-mutatie (c) hebben het grootste effect. Bij c stopt het eiwit al na twee aminozuren. Bij d verschuift het leesraam, zodat alle aminozuren na de deletie veranderen en het stopcodon verdwijnt. De stille mutatie (a) verandert niets aan het eiwit, en de missense-mutatie (b) verandert één aminozuur.</p>'}));
  return out;
}

function stepGate(){
  const st = S({phase:3, enter(){
    const p = stats.ph[3] || {first:0,total:0};
    const good = p.total > 0 && p.first === p.total;
    bot(good
      ? '<p>Sterk gedaan: je hebt het hele proces zelf uitgevoerd. Er is nog een uitdaging over mutaties. Doe je mee?</p>'
      : '<p>Je hebt fase 3 afgerond. Er is nog een uitdaging over mutaties. Wil je die proberen, of ga je naar de afsluiting?</p>');
    choiceWidget(['Start de uitdaging','Ga naar de afsluiting'], (i, label) => {
      const go = guard(); lock(); me(label);
      if (i === 0) queue.unshift(...mutSteps());
      setTimeout(go, D);
    });
  }});
  return st;
}

const ADVICE = {
  T:'schrijf in RNA altijd U waar DNA een T heeft',
  richting:`houd de leesrichting aan: mRNA wordt van ${P5} naar ${P3} gemaakt en gelezen`,
  streng:'haal de matrijsstreng en de coderende streng niet door elkaar',
  frame:'begin met vertalen bij het startcodon AUG, niet bij het eerste nucleotide',
  stop:'een stopcodon levert geen aminozuur op',
  anticodon:'zoek in de codontabel het codon van het mRNA op, niet het anticodon',
  een:'één aminozuur hoort bij drie nucleotiden, niet bij één'
};
function summary(){
  const s = [];
  if (stats.total) s.push(`Je hebt ${stats.first} van de ${stats.total} gemaakte opdrachten in één keer goed gedaan.`);
  else s.push('Je hebt de opdrachten overgeslagen, dus er valt nog niets samen te vatten.');
  const phn = {1:'transcriptie', 2:'translatie', 3:'het zelf vinden van het leesraam', 4:'mutaties'};
  const strong = Object.keys(phn).filter(k => stats.ph[k] && stats.ph[k].total && stats.ph[k].first === stats.ph[k].total).map(k => phn[k]);
  if (strong.length) s.push(`Sterk was je in ${strong.length > 1 ? strong.slice(0,-1).join(', ') + ' en ' + strong.slice(-1) : strong[0]}: daar ging alles in één keer goed.`);
  const mis = Object.entries(stats.mis).sort((a,b) => b[1]-a[1]).slice(0,2).map(([k]) => ADVICE[k]);
  if (mis.length) s.push(`Let nog op het volgende: ${mis.join(', en ')}.`);
  else if (stats.total) s.push('Je bent in geen van de bekende valkuilen getrapt, zoals een T in mRNA of een stopcodon als aminozuur.');
  s.push(`Onthoud de route: DNA-matrijsstreng → mRNA (transcriptie) → eiwit (translatie), steeds van ${P5} naar ${P3}.`);
  return s.join(' ');
}

function closingSteps(){
  const q1 = stepMCq({phase:5,
    intro:'<p><strong>Afsluiting.</strong> Nog drie korte controlevragen.</p>',
    q:`<p><strong>1.</strong> Welk mRNA hoort bij de matrijsstreng ${fmt('GAC', P3, P5)}?</p>`,
    options:[`${P5}-CUG-${P3}`, `${P5}-CTG-${P3}`, `${P5}-GAC-${P3}`, `${P5}-GUC-${P3}`], correct:0,
    hints:{1:{mis:'T', msg:'Bijna: je bouwt RNA. Welke base gebruikt RNA in plaats van T?'}, 2:{mis:'streng', msg:'Dat is dezelfde volgorde als de matrijsstreng. Het mRNA is complementair aan de matrijsstreng.'}, 3:{msg:'Kijk nog eens naar de middelste base: welke RNA-base hoort tegenover A?'}},
    explain:() => `<p>Tegenover G komt C, tegenover A komt U en tegenover C komt G. Het mRNA is dus ${fmt('CUG', P5, P3)}.</p>`});
  const q2 = stepMCq({phase:5,
    q:`<p><strong>2.</strong> Het mRNA is ${fmt('CCAUGGCUAAC', P5, P3, false)}. Bij welk nucleotide begint het ribosoom met vertalen?</p>`,
    options:['Bij het 1e nucleotide (C)', 'Bij het 3e nucleotide (A)', 'Bij het 5e nucleotide (G)', 'Bij het laatste nucleotide (C)'], correct:1,
    hints:{0:{mis:'frame', msg:'Het ribosoom begint niet automatisch vooraan. Waar staat het startcodon?'}, 2:{msg:'Het startcodon bestaat uit drie basen. Bij welk nucleotide begint het?'}, 3:{mis:'richting', msg:'Het ribosoom leest van 5\' naar 3\'. Aan welke kant begint het dan te zoeken?'}},
    explain:() => '<p>Het ribosoom zoekt vanaf het 5\'-uiteinde het startcodon AUG. Dat begint bij het 3e nucleotide: CC | AUG GCU AAC.</p>'});
  const q3 = stepMCq({phase:5,
    q:`<p><strong>3.</strong> Een tRNA heeft het anticodon ${fmt('ACC', P3, P5)}. Welk aminozuur brengt dit tRNA?</p>`,
    options:['Trp','Thr','Cys','Gly'], correct:0,
    hints:{1:{mis:'anticodon', msg:'Je hebt het anticodon opgezocht. Welk mRNA-codon past bij dit anticodon? Dat zoek je op in de tabel.'}, 2:{msg:'Bijna: kijk nog eens naar de 3e base van het codon.'}, 3:{msg:'Bepaal eerst welk mRNA-codon bij dit anticodon past, en zoek dat op.'}},
    explain:() => `<p>Het anticodon ${fmt('ACC', P3, P5)} past bij het mRNA-codon ${fmt('UGG', P5, P3)}. In de codontabel is UGG = Trp.</p>`});
  const end = S({phase:5, enter(){
    setBench({note:'Het eiwit is klaar en verlaat het ribosoom. De productie zit erop.'});
    bot(`<p><strong>Klaar!</strong> ${summary()}</p>`);
    choiceWidget(['Opnieuw beginnen'], () => start());
  }});
  return [q1, q2, q3, end];
}

function buildMain(){
  return [
    stepFree({phase:0,
      q:'<p>Je bent een RNA-polymerase-enzym in de kern van een levercel. De cel heeft een nieuw eiwit nodig, en jij gaat de code van het gen overschrijven.</p><p><strong>Wat weet je al over het verschil tussen DNA en RNA?</strong></p>',
      react: v => /uracil|\bU\b/i.test(v) ? 'Goed dat je uracil noemt, dat komt zo meteen van pas.' : 'Dank je. Hier bouwen we op verder.',
      model:'<ul><li>DNA is dubbelstrengs, RNA enkelstrengs.</li><li>DNA heeft de suiker deoxyribose, RNA ribose.</li><li>RNA heeft uracil (U) waar DNA thymine (T) heeft.</li><li>mRNA is een tijdelijke kopie van één gen.</li></ul>'}),
    stepStrands(),
    stepPairs(),
    stepTranscribe({phase:1, template:T1A, grouped:true, showCoding:true,
      intro:[`<p>Oefenopdracht. Hier is een stukje matrijsstreng:</p><p>${fmt(T1A, P3, P5)}</p><p>Schrijf het mRNA dat jij hierbij maakt, van ${P5} naar ${P3}.</p>`]}),
    stepFree({phase:1,
      q:'<p>Waarom klopt dit? Leg in één zin uit hoe je bij elke base kwam.</p>',
      model:'<p>Tegenover elke base van de matrijsstreng zet je de complementaire RNA-base: T→A, A→U, C→G en G→C. Omdat RNA geen thymine heeft, komt tegenover een A een U.</p>'}),
    stepTranscribe({phase:1, template:T1B, grouped:true, showCoding:true,
      intro:[`<p>Nu het hele gen. De matrijsstreng is:</p><p>${fmt(T1B, P3, P5)}</p><p>Schrijf het mRNA, van ${P5} naar ${P3}.</p>`]}),
    stepCoding(),
    stepFree({phase:1,
      q:'<p>Op je werkbank staan nu de coderende streng, de matrijsstreng en jouw mRNA onder elkaar. Vergelijk de coderende streng met je mRNA. Wat valt je op?</p>',
      onDone(){ if (!bench || bench.rows.length < 3) return; const c = bench.rows[0], m = bench.rows[2]; const idx = [...m.seq].map((b,i) => b === 'U' ? i : -1).filter(i => i >= 0); c.mark = idx; m.mark = idx; bench.caption = '<b>Zelfde volgorde.</b> Alleen waar de coderende streng een T heeft (omrand), staat in het mRNA een U.'; renderStrand(); },
      continueLabel:'Door naar de translatie',
      model:'<p>Ze hebben dezelfde volgorde, alleen staat in het DNA een T waar het mRNA een U heeft. Logisch: allebei zijn ze complementair aan de matrijsstreng. Op je werkbank zie je de T\'s en U\'s nu omrand.</p>'}),
    stepTranslate({phase:2, mrna:M1B, openTable:true,
      intro:[
        '<p><strong>Fase 2: translatie.</strong> Je mRNA is de kern uit gereisd. Jij bent nu een ribosoom in het cytoplasma.</p><p>Je leest het mRNA per drie nucleotiden, een codon, en begint bij AUG. Een tRNA met een passend anticodon brengt steeds het aminozuur. Let op: in de codontabel zoek je het <strong>codon</strong> van het mRNA op, niet het anticodon.</p>',
        `<p>De codontabel staat op je werkbank. Vertaal het mRNA ${fmt(M1B, P5, P3)} codon voor codon. Schrijf de aminozuren met de drielettercode, met streepjes ertussen.</p>`]}),
    stepCount(),
    stepTranscribe({phase:3, template:T3, grouped:false,
      intro:[`<p><strong>Fase 3: het hele proces zelf.</strong> Deze keer staat het startcodon niet vooraan, en er staan geen spaties in de volgorde.</p><p><strong>Stap 1:</strong> schrijf het mRNA bij deze matrijsstreng:</p><p>${fmt(T3, P3, P5, false)}</p>`]}),
    stepPick(),
    stepTranslate({phase:3, mrna:M3, start:2, grouped:true, offset:2, frame:true,
      intro:['<p><strong>Stap 3:</strong> vertaal vanaf het startcodon tot het stopcodon. Op je werkbank zie je nu het leesraam.</p>']}),
    stepGate(),
    ...closingSteps()
  ];
}

function start(){
  resetStats();
  log.innerHTML = '';
  $('#tableBox').hidden = true; $('#tableBox').open = false;
  setBench(null);
  queue = buildMain();
  next();
}
function stepsFrom(p){
  if (p >= 5) return closingSteps();
  if (p === 4) return [...mutSteps(), ...closingSteps()];
  const all = buildMain();
  return all.slice(all.findIndex(s => s.phase >= p));
}
function jumpTo(p){
  if (cur && cur.phase === p && queue.length) return;
  queue = stepsFrom(p);
  if (p >= 2) showTable(p === 2); else { $('#tableBox').hidden = true; }
  bot(`Doorgesprongen naar ${p < 5 ? 'fase ' + p + ': ' + PHASES[p].toLowerCase() : 'de afsluiting'}.`, 'divider');
  next();
}
$('#phases').addEventListener('click', e => { const b = e.target.closest('button[data-p]'); if (b) jumpTo(+b.dataset.p); });
$('#skip').addEventListener('click', () => {
  if (!queue.length) return;
  bot('Opdracht overgeslagen.', 'divider');
  next();
});
$('#restart').addEventListener('click', () => { if (!cur || confirm('Weet je zeker dat je opnieuw wilt beginnen? Je voortgang gaat verloren.')) start(); });
buildTable();
start();
</script>
</body>
</html>
