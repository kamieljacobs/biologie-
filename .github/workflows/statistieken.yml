name: Kijkcijfers ophalen

# Haalt elke nacht de kijkcijfers op bij GoatCounter en zet de totalen in statistieken/data.json
# (dashboard: statistieken/index.html). Handmatig starten kan via Actions → Kijkcijfers ophalen → Run workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # elke nacht rond 04:17 Nederlandse tijd (02:17 UTC)

permissions:
  contents: write

concurrency:
  group: statistieken
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cijfers ophalen bij GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then
            echo "::error::Geen API-sleutel. Zet hem in Settings → Secrets and variables → Actions als GOATCOUNTER_TOKEN."
            exit 1
          fi
          python3 -u scripts/statistieken_ophalen.py
      - name: Opslaan in de repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add statistieken/data.json
          if git diff --cached --quiet; then echo "Niets nieuws."; exit 0; fi
          git commit -m "Kijkcijfers bijgewerkt"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 20
          done
          exit 1
