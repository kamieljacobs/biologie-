<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biologie bij Kamiel</title>
<meta name="description" content="Uitlegfilms, tools en practica voor biologie in havo, vwo en onderbouw.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
/* Ontwerp: de stijlkaart van de films (navy, goud, Fraunces) als huisstijl van de site.
   Hoofdstuk = hoofdingang; de film-still is het beeld; mono-labels voor codes en tijden. */
:root{
  --bg:#0F1726; --bg2:#0B1220; --surface:#16213A; --surface2:#1C2944; --line:rgba(143,160,181,.18); --line2:rgba(143,160,181,.32);
  --text:#F2F2EE; --text2:#A3ACBA; --text3:#7D8899;
  --goud:#E0B64A; --goud-ink:#1A1405; --goud-text:#E8C266; --goud-soft:rgba(224,182,74,.14);
  --groen:#7FC48F; --koraal:#E07A5F; --paars:#9C8BD0; --teal:#5BA4C9; --oker:#C9A35C;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -18px rgba(0,0,0,.7);
  --titel:"Fraunces",Georgia,"Times New Roman",serif;
  --tekst:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --meta:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F5F8; --bg2:#E9EDF2; --surface:#FFFFFF; --surface2:#F6F8FB; --line:rgba(20,32,52,.10); --line2:rgba(20,32,52,.20);
  --text:#121C2E; --text2:#4E5A6C; --text3:#6B7687;
  --goud:#E0B64A; --goud-ink:#1A1405; --goud-text:#8F6A0E; --goud-soft:rgba(224,182,74,.18);
  --groen:#2F8A47; --koraal:#C0503A; --paars:#6A55B0; --teal:#2C7AA6; --oker:#94701F;
  --shadow:0 1px 2px rgba(18,28,46,.06), 0 10px 28px -16px rgba(18,28,46,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 var(--tekst);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--goud);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--titel);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--meta);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
[hidden]{display:none!important}

/* Kopbalk */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px 22px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.merk{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--titel);white-space:nowrap}
.merk svg{flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;color:var(--text2);font-weight:600;font-size:15px}
.nav a:hover{color:var(--text);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--text);background:var(--surface2)}
.rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--text2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--goud);color:var(--goud-ink)}
.icoon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}
.icoon:hover{color:var(--text)}

/* Homepage */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:56px 40px}
.hero .mono{color:var(--goud-text)}
.hero h1{font-size:clamp(40px,5.4vw,64px);line-height:1.02;margin:14px 0 18px}
.hero p.intro{margin:0;color:var(--text2);font-size:19px;max-width:52ch}
.telling{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;color:var(--text3)}
.telling b{display:block;font:700 30px/1 var(--titel);color:var(--text);letter-spacing:0;text-transform:none;margin-bottom:6px}
.uitgelicht{position:relative;display:block;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.uitgelicht .still{aspect-ratio:16/9;max-width:100%;position:relative;background:var(--bg2)}
.uitgelicht .still img{width:100%;height:100%;object-fit:cover}
.uitgelicht .still::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,13,23,.88))}
.uitgelicht .op{position:absolute;left:0;right:0;bottom:0;padding:22px 24px;z-index:1;color:#F2F2EE}
.uitgelicht .op .mono{color:#E8C266}
.uitgelicht .op h2{font-size:30px;margin:6px 0 4px;color:#F2F2EE}
.uitgelicht .op p{margin:0;color:#C9CFD8;font-size:16px}
.speel{position:absolute;right:20px;top:20px;z-index:1;width:56px;height:56px;border-radius:999px;background:var(--goud);color:var(--goud-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);transition:transform .2s}
.uitgelicht:hover .speel{transform:scale(1.06)}

.sec{padding-block:28px 12px}
.sec-kop{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-kop h2{font-size:30px}
.sec-kop p{margin:0;color:var(--text3);font-size:15px}

.ond{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding-block:26px;border-top:1px solid var(--line)}
.ond-kop .code{font:700 13px/1 var(--meta);letter-spacing:.1em;color:var(--goud-text)}
.ond-kop .weging{font:700 34px/1 var(--titel);margin-top:10px}
.ond-kop .weging small{font:600 13px var(--tekst);color:var(--text3);margin-left:4px}
.ond-kop .jaar{color:var(--text3);font-size:14px;margin-top:6px}
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.hk{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;min-width:0}
a.hk:hover{transform:translateY(-3px);border-color:var(--line2)}
.hk .mozaiek{aspect-ratio:16/9;max-width:100%;position:relative;background:var(--bg2);display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.hk .mozaiek img{width:100%;height:100%;object-fit:cover}
.hk .mozaiek img:first-child{grid-row:1/3}
.hk .mozaiek.een{grid-template-columns:1fr;grid-template-rows:1fr}
.hk .mozaiek.een img:first-child{grid-row:auto}
.hk .mozaiek.twee img:first-child{grid-row:1/3}
.hk .mozaiek.twee img:nth-child(2){grid-row:1/3}
.badge{position:absolute;left:10px;bottom:10px;padding:5px 9px;border-radius:7px;background:rgba(8,13,23,.78);color:#F2F2EE;font:600 11px/1 var(--meta);letter-spacing:.08em;text-transform:uppercase}
.hk .lijf{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.hk .lbl{display:flex;align-items:center;gap:8px;color:var(--text3)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--c,var(--goud));flex:none}
.hk h3{font-size:22px;line-height:1.15}
.hk .hfd{color:var(--text2);font-size:14px}
.hk .mat{color:var(--text3);font-size:14px;margin-top:auto;padding-top:6px}
.hk.leeg{background:transparent;border-style:dashed;box-shadow:none;align-self:start}
.hk.leeg .lijf{opacity:.78}
.volgt{align-self:flex-start;margin-top:auto;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--text3);font:600 11px/1.2 var(--meta);letter-spacing:.08em;text-transform:uppercase}

.binnenkort{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:56px}
.bk{padding:18px 20px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),transparent)}
.bk h3{font-size:19px;margin:8px 0 4px}
.bk p{margin:0;color:var(--text3);font-size:14px}
.bk .mono{color:var(--text3)}

/* Hoofdstukpagina */
.kop{padding-block:40px 30px;border-bottom:1px solid var(--line);background:radial-gradient(900px 300px at 10% -40%,color-mix(in srgb,var(--c,var(--goud)) 22%,transparent),transparent)}
.terug{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-weight:600;font-size:15px}
.terug:hover{color:var(--text)}
.kop .lbl{display:flex;align-items:center;gap:10px;margin:22px 0 10px;color:var(--text3)}
.kop h1{font-size:clamp(38px,5vw,58px);line-height:1.02}
.kop p{margin:12px 0 0;color:var(--text2);max-width:62ch}
.voortgang{display:flex;align-items:center;gap:12px;margin-top:22px;color:var(--text3);font-size:14px}
.voortgang .balk{width:180px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.voortgang .balk i{display:block;height:100%;background:var(--goud);border-radius:99px;transition:width .3s}

.films{display:flex;flex-direction:column;gap:14px;padding-block:28px 8px}
.film{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .18s}
.film:hover{border-color:var(--line2)}
.film .still{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--bg2)}
.film .still img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.film:hover .still img{transform:scale(1.03)}
.film .nr{position:absolute;left:10px;top:10px;width:30px;height:30px;border-radius:99px;background:rgba(8,13,23,.8);color:#F2F2EE;font:600 13px/30px var(--meta);text-align:center}
.film .tijd{position:absolute;right:10px;bottom:10px;padding:4px 8px;border-radius:6px;background:rgba(8,13,23,.8);color:#F2F2EE;font:600 12px/1 var(--meta)}
.film .gezien-balk{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--goud);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.film.is-gezien .gezien-balk{transform:scaleX(1)}
.film .info{display:flex;flex-direction:column;gap:6px;min-width:0;padding-right:10px}
.film .bij{color:var(--text3)}
.film h3{font-size:26px;line-height:1.12}
.film .vraag{margin:0;color:var(--text);font-size:18px}
.film .tekst{margin:0;color:var(--text2);font-size:15px}
.film .acties{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.knop{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;background:var(--goud);color:var(--goud-ink);font-weight:700;font-size:15px;border:0}
.knop:hover{filter:brightness(1.06)}
.vink{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--text3);font-size:14px;font-weight:600}
.film.is-gezien .vink{color:var(--goud-text);border-color:color-mix(in srgb,var(--goud) 45%,transparent);background:var(--goud-soft)}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,border-color .18s;min-width:0}
a.tool:hover{transform:translateY(-3px);border-color:var(--line2)}
.tool .still{aspect-ratio:16/9;max-width:100%;background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden}
.tool .still img{width:100%;height:100%;object-fit:cover;object-position:top left}
.tool .lijf{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.tool h3{font-size:20px}
.tool p{margin:0;color:var(--text2);font-size:14px}
.tool .naar{margin-top:auto;padding-top:10px;color:var(--goud-text);font-weight:700;font-size:14px}
.tool.leeg{background:transparent;border-style:dashed;box-shadow:none}
.tool.leeg .still{display:none}

/* Alle films */
.reeks{padding-block:22px;border-top:1px solid var(--line)}
.reeks-kop{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.reeks-kop h2{font-size:24px}
.reeks-kop a{color:var(--goud-text);font-weight:700;font-size:14px;margin-left:auto}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mini{display:flex;flex-direction:column;gap:8px;min-width:0}
.mini .still{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.mini .still img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.mini:hover .still img{transform:scale(1.04)}
.mini .tijd{position:absolute;right:8px;bottom:8px;padding:3px 7px;border-radius:6px;background:rgba(8,13,23,.8);color:#F2F2EE;font:600 11px/1 var(--meta)}
.mini b{font:700 17px/1.2 var(--titel)}
.mini span{color:var(--text3);font-size:14px;line-height:1.35}

footer{margin-top:40px;border-top:1px solid var(--line);color:var(--text3);font-size:14px}
footer .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;padding-block:26px 40px;align-items:center}
footer a{color:var(--text2)}
footer a:hover{color:var(--text)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;padding-block:36px 24px}
  .ond{grid-template-columns:1fr;gap:14px}
  .ond-kop{display:flex;align-items:baseline;gap:14px}
  .ond-kop .weging{margin:0;font-size:24px}
  .film{grid-template-columns:1fr;gap:12px}
  .film .info{padding:0 6px 6px}
  .rechts{margin-left:0}
}
@media (max-width:520px){
  .nav a{padding:6px 9px;font-size:14px}
  .film h3{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KLEUR = {cellen:'teal',voortplanting:'koraal',erfelijkheid:'paars',evolutie:'oker',ecologie:'groen',stofwisseling:'groen',dna:'teal',regeling:'koraal'};
/* ===== einde inhoud ===== */

(function(){
const root=document.documentElement, app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lees=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const schrijf=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let niveau=lees('niveau'); if(!NIVEAUS[niveau]) niveau='havo';
let gezien={}; try{gezien=JSON.parse(lees('gezien')||'{}')||{}}catch(e){gezien={}}
const kleur=id=>`var(--${KLEUR[id]||'goud'})`;
const alleFilms=Object.values(HOOFDSTUKKEN).flatMap(h=>h.films);
const alleTools=[];{const z=new Set();for(const h of Object.values(HOOFDSTUKKEN))for(const t of h.tools){if(!z.has(t.naam)){z.add(t.naam);alleTools.push(t)}}}
const hoofdstukVan=href=>(href||'').replace(/^#/,'').split('-')[0];
const minuten=m=>m?`${m} min`:'';
const bijLabel=s=>String(s||'').replace(/^Film\s*·\s*/,'').replace(/\s*·\s*\d+([,½]\d*)?\s*min$/,'').replace(/\s*·\s*\d+:\d+$/,'');
const play='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
const vinkSvg='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function themaKnop(){
  const d=root.getAttribute('data-theme')!=='light';
  const b=document.getElementById('thema');
  b.innerHTML=d?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
  b.setAttribute('aria-label',d?'Zet licht thema aan':'Zet donker thema aan');
}
document.getElementById('thema').addEventListener('click',()=>{const n=root.getAttribute('data-theme')==='light'?'dark':'light';root.setAttribute('data-theme',n);schrijf('thema',n);themaKnop()});

document.querySelectorAll('[data-niveau]').forEach(b=>b.addEventListener('click',()=>{niveau=b.dataset.niveau;schrijf('niveau',niveau);render()}));

function mozaiek(id){
  const h=HOOFDSTUKKEN[id]; if(!h||!h.films.length) return '';
  const p=h.films.slice(0,3).map(f=>`<img src="${BASE+esc(f.poster)}" alt="" loading="lazy">`).join('');
  const cls=h.films.length===1?' een':h.films.length===2?' twee':'';
  const n=h.films.length, t=h.tools.filter(x=>x.href).length;
  return `<div class="mozaiek${cls}">${p}<span class="badge">${n} ${n===1?'film':'films'}${t?` · ${t} ${t===1?'tool':'tools'}`:''}</span></div>`;
}

function home(){
  const N=NIVEAUS[niveau];
  const nTools=alleTools.filter(t=>t.href).length;
  const u=UITGELICHT;
  let out=`<section class="wrap hero">
    <div>
      <span class="mono">Biologie · ${esc(niveau)}</span>
      <h1>Wat ga je vandaag leren?</h1>
      <p class="intro">${esc(N.intro)}</p>
      <div class="telling mono">
        <span><b>${alleFilms.length}</b>uitlegfilms</span>
        <span><b>${nTools}</b>tools en practica</span>
        <span><b>${N.ond.length}</b>${niveau==='onderbouw'?'kerndoelgroep':'PTA-onderdelen'}</span>
      </div>
    </div>
    ${u?`<a class="uitgelicht" href="${BASE+esc(u.href)}">
      <div class="still"><img src="${BASE+esc(u.poster)}" alt=""></div>
      <span class="speel">${play}</span>
      <div class="op"><span class="mono">Nieuw · ${esc(u.reeks)} · ${minuten(u.duur)}</span><h2>${esc(u.titel)}</h2><p>${esc(u.vraag)}</p></div>
    </a>`:''}
  </section>
  <section class="wrap sec" aria-labelledby="h-pta">
    <div class="sec-kop"><h2 id="h-pta">${niveau==='onderbouw'?'Kerndoelen':'Per PTA-onderdeel'}</h2><p>${esc(N.methode)}</p></div>`;
  for(const o of N.ond){
    const jaar=niveau==='vwo'&&/^OND[12]$/.test(o.code)?'jaar 1':niveau==='vwo'&&/^OND[34]$/.test(o.code)?'jaar 2':'';
    out+=`<div class="ond"><div class="ond-kop"><div class="code">${esc(o.code)}</div>${o.w?`<div class="weging">${o.w}%<small>weging</small></div>`:''}${jaar?`<div class="jaar">${jaar}</div>`:''}</div><div class="kaarten">`;
    for(const [lbl,naam,hfd,mat,href] of o.subs){
      const id=hoofdstukVan(href), echt=href&&HOOFDSTUKKEN[id];
      const titel=niveau==='onderbouw'&&/^\[/.test(naam)?`Kerndoel ${lbl}`:naam;
      if(echt){
        out+=`<a class="hk" href="${esc(href)}" style="--c:${kleur(id)}">${mozaiek(id)}<div class="lijf"><span class="lbl mono"><i class="dot"></i>${esc(lbl)}</span><h3>${esc(titel)}</h3>${hfd?`<span class="hfd">${esc(hfd)}</span>`:''}${mat?`<span class="mat">${esc(mat)}</span>`:''}</div></a>`;
      } else {
        out+=`<div class="hk leeg"><div class="lijf"><span class="lbl mono"><i class="dot" style="--c:var(--text3)"></i>${esc(lbl)}</span><h3>${esc(titel)}</h3>${hfd?`<span class="hfd">${esc(hfd)}</span>`:''}<span class="volgt">materiaal volgt</span></div></div>`;
      }
    }
    out+=`</div></div>`;
  }
  out+=`</section>
  <section class="wrap sec" aria-labelledby="h-bk">
    <div class="sec-kop"><h2 id="h-bk">Binnenkort</h2><p>Hier wordt aan gewerkt</p></div>
    <div class="binnenkort">
      <div class="bk"><span class="mono">Oefenen</span><h3>Begrippen trainen</h3><p>Per hoofdstuk de begrippen oefenen tot je ze kent.</p></div>
      <div class="bk"><span class="mono">Oefenen</span><h3>Binas oefenen</h3><p>Tabellen opzoeken en aflezen, zoals op het examen.</p></div>
      <div class="bk"><span class="mono">Examen</span><h3>Examentraining</h3><p>Oude examens vraag voor vraag, met de examenatlas.</p></div>
    </div>
  </section>`;
  return out;
}

function filmRij(f,i,id){
  const g=gezien[f.href];
  return `<article class="film${g?' is-gezien':''}" data-href="${esc(f.href)}">
    <a class="still" href="${BASE+esc(f.href)}" aria-label="Bekijk ${esc(f.titel)}"><img src="${BASE+esc(f.poster)}" alt="" loading="lazy"><span class="nr">${i+1}</span>${f.duur?`<span class="tijd">${minuten(f.duur)}</span>`:''}<i class="gezien-balk"></i></a>
    <div class="info">
      <span class="bij mono">${esc(bijLabel(f.bij))}</span>
      <h3>${esc(f.titel)}</h3>
      <p class="vraag">${esc(f.vraag)}</p>
      <p class="tekst">${esc(f.tekst)}</p>
      <div class="acties"><a class="knop" href="${BASE+esc(f.href)}">${play} ${g?'Opnieuw kijken':'Bekijk film'}</a><button class="vink" type="button" aria-pressed="${g?'true':'false'}">${vinkSvg} ${g?'Gezien':'Markeer als gezien'}</button></div>
    </div>
  </article>`;
}

function toolKaart(t){
  if(!t.href) return `<div class="tool leeg"><div class="lijf"><h3>${esc(t.naam)}</h3><p>${esc(t.tekst)}</p><span class="volgt">volgt</span></div></div>`;
  return `<a class="tool" href="${BASE+esc(t.href)}">${t.img?`<div class="still"><img src="${BASE+esc(t.img)}" alt="" loading="lazy"></div>`:''}<div class="lijf"><h3>${esc(t.naam)}</h3><p>${esc(t.tekst)}</p><span class="naar">Open →</span></div></a>`;
}

function hoofdstuk(id){
  const h=HOOFDSTUKKEN[id];
  const n=h.films.length, k=h.films.filter(f=>gezien[f.href]).length;
  let out=`<section class="kop" style="--c:${kleur(id)}"><div class="wrap">
    <a class="terug" href="#home">← Alle hoofdstukken</a>
    <div class="lbl mono"><i class="dot"></i>${esc(h.label)}</div>
    <h1>${esc(h.titel)}</h1>
    <p>${esc(h.meta)}</p>
    ${n>1?`<div class="voortgang"><div class="balk"><i style="width:${Math.round(100*k/n)}%"></i></div><span>${k} van ${n} films gezien</span></div>`:''}
  </div></section>
  <div class="wrap">
    <section id="${id}-films" class="films" aria-label="Films">${h.films.map((f,i)=>filmRij(f,i,id)).join('')}</section>`;
  if(h.tools.length) out+=`<section id="${id}-tools" class="sec"><div class="sec-kop"><h2>Tools en practica</h2></div><div class="tools">${h.tools.map(toolKaart).join('')}</div></section>`;
  if(h.oefenen.length) out+=`<section id="${id}-oefenen" class="sec"><div class="sec-kop"><h2>Oefenen</h2><p>Binnenkort</p></div><div class="binnenkort">${h.oefenen.map(o=>`<div class="bk"><span class="mono">volgt</span><h3>${esc(o)}</h3></div>`).join('')}</div></section>`;
  return out+`</div>`;
}

function films(){
  let out=`<section class="kop"><div class="wrap"><a class="terug" href="#home">← Alle hoofdstukken</a><div class="lbl mono"><i class="dot"></i>Alle films</div><h1>Uitlegfilms</h1><p>${alleFilms.length} films die bij een vraag beginnen. Per hoofdstuk, in kijkvolgorde.</p></div></section><div class="wrap sec">`;
  for(const [id,h] of Object.entries(HOOFDSTUKKEN)){
    out+=`<section class="reeks"><div class="reeks-kop"><span class="lbl mono" style="--c:${kleur(id)}"><i class="dot"></i> ${esc(h.label)}</span><h2>${esc(h.titel)}</h2><a href="#${id}">Naar het hoofdstuk →</a></div><div class="strip">${h.films.map(f=>`<a class="mini" href="${BASE+esc(f.href)}"><span class="still"><img src="${BASE+esc(f.poster)}" alt="" loading="lazy">${f.duur?`<span class="tijd">${minuten(f.duur)}</span>`:''}</span><b>${esc(f.titel)}</b><span>${esc(f.vraag)}</span></a>`).join('')}</div></section>`;
  }
  return out+`</div>`;
}

function tools(){
  return `<section class="kop"><div class="wrap"><a class="terug" href="#home">← Alle hoofdstukken</a><div class="lbl mono"><i class="dot"></i>Alle tools</div><h1>Tools en practica</h1><p>Simulaties en virtuele practica om het zelf te proberen.</p></div></section><div class="wrap sec"><div class="tools">${alleTools.filter(t=>t.href).map(toolKaart).join('')}</div>${alleTools.some(t=>!t.href)?`<div class="sec-kop" style="margin-top:36px"><h2>In de maak</h2></div><div class="tools">${alleTools.filter(t=>!t.href).map(toolKaart).join('')}</div>`:''}</div>`;
}

function render(){
  document.querySelectorAll('[data-niveau]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.niveau===niveau)));
  const h=(location.hash||'#home').slice(1);
  const id=h.split('-')[0];
  let pagina='home';
  if(h==='films') {app.innerHTML=films();pagina='films'}
  else if(h==='tools') {app.innerHTML=tools();pagina='tools'}
  else if(HOOFDSTUKKEN[id]) {app.innerHTML=hoofdstuk(id);pagina=id}
  else app.innerHTML=home();
  document.querySelectorAll('[data-nav]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.nav===(pagina==='films'||pagina==='tools'?pagina:'home')));
  document.title=pagina==='home'?'Biologie bij Kamiel':`${pagina==='films'?'Films':pagina==='tools'?'Tools':HOOFDSTUKKEN[id].titel} · Biologie bij Kamiel`;
  const el=h&&h!==pagina?document.getElementById(h):null;
  if(el) el.scrollIntoView(); else window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const v=e.target.closest('.vink'); const f=e.target.closest('.film');
  if(v&&f){const k=f.dataset.href; if(gezien[k]) delete gezien[k]; else gezien[k]=1; schrijf('gezien',JSON.stringify(gezien)); render(); return;}
  const l=e.target.closest('.film a'); if(l&&f){gezien[f.dataset.href]=1; schrijf('gezien',JSON.stringify(gezien));}
});
window.addEventListener('hashchange',render);
themaKnop(); render();
})();
</script>
